ый герпес, баланит, фимоз; «сифилис» (по трактовке курса — набор разных программ)", "Чувствительность": "Схема «наружная кожа»", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Получаете ли вы желаемую близость? Был ли неприятный сексуальный контакт?", "Примеры из практики": "", "Подсказки, особенности": "По трактовке курса: пигментные пятна и кондиломы при «сифилисе» — вторичный конфликт для дермы (от диагноза); 3-я стадия — генерализованное обрушение самооценки мезодермы", "Источник": "Урок 25 (PDF)"}, {"№": "160", "Система": "Репродуктивная (мужская)", "Орган / часть / ткань": "Дерма полового члена", "Зародышевый листок": "Старая мезодерма", "Ткань (подробно)": "Старая мезодерма", "Реле в мозге": "Мозжечок", "Конфликт (тематика)": "Обезображенность, нарушение целостности, связанные с половым членом; возможен замещающий", "Биологический смысл": "В активной фазе", "Активная фаза (СА)": "Рост", "Фаза восстановления (ПКЛ)": "Распад", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "Взрослый сын признаётся родителям, что гомосексуален; у отца ужас и отвращение, когда он представляет действия сына — замещающий конфликт", "Подсказки, особенности": "", "Источник": "Урок 25 (PDF)"}, {"№": "161", "Система": "Репродуктивная (мужская)", "Орган / часть / ткань": "Предстательная железа — паренхима", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (цилиндрический кишечный эпителий)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Безобразный генитальный конфликт: не иметь права/возможности воспроизвести потомство; нельзя или не в состоянии заниматься сексом; не чувствует себя достаточно мужчиной — кто-то сомневается в мужественности или эрекции. Чаще мужчины 40+, не способные решить территориальный конфликт", "Биологический смысл": "В активной фазе: больше секрета (запах мускуса — сигнал самке о потенции, «пометить территорию»)", "Активная фаза (СА)": "Рост, усиление функции, постепенный рост ПСА; без симптомов, пока не сдавит уретру (задержка мочи)", "Фаза восстановления (ПКЛ)": "Отёк, воспаление — паренхиматозный простатит; туберкулёзный распад — мутная пенистая моча с запахом, иногда с кровью («гонорея», «триппер» — по трактовке курса). При Синдроме — временное перекрытие уретры (временный катетер)", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Аденома/рак простаты, простатит, задержка мочи, повышенный ПСА", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Сомневаются в моей мужественности»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто сомневается в вашей мужской силе? Можете ли вы иметь детей/внуков, секс?", "Примеры из практики": "Мужчина 3 года изменял жене; при разрыве любовница угрожает разрушить его семью. Пациент заметил измену жены и 15 лет не может забыть. Й. Хенкес: беременность девушки сына до брака («только не сейчас!»)", "Подсказки, особенности": "Ведущая: ПСА-тест в 80% ложноположительный (по источнику)", "Источник": "Урок 25 (PDF)"}, {"№": "162", "Система": "Репродуктивная (мужская)", "Орган / часть / ткань": "Протоки предстательной железы — слизистая", "Зародышевый листок": "Гладкая мускулатура + Эктодерма", "Ткань (подробно)": "Эктодерма (стенки — гладкая мускулатура)", "Реле в мозге": "Кора", "Конфликт (тематика)": "Территориальная маркировка с сексуальным (генитальным) аспектом", "Биологический смысл": "", "Активная фаза (СА)": "Бессимптомный некроз слизистой", "Фаза восстановления (ПКЛ)": "Отёк, воспаление — простатит", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы с зависанием в восстановлении → разрастание, сужение до полного перекрытия; хронический отёк — проблемы с мочеиспусканием", "Медицинские диагнозы": "Простатит, нарушения мочеиспускания", "Чувствительность": "Схема «наружная кожа»", "Метафоры, выражения": "«Не могу пометить свою женщину»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы не можете «пометить» свою территорию в интимной сфере?", "Примеры из практики": "Жена 45-летнего мужчины не интересуется сексом, после второго ребёнка совсем не хочет. Жена на 10 лет моложе ходит курить к соседу; муж увидел, как сосед обнимает её за плечи (и свою дочь), — с тех пор всё время думает, где она", "Подсказки, особенности": "", "Источник": "Урок 25 (PDF)"}, {"№": "163", "Система": "Мочеполовая (мужская)", "Орган / часть / ткань": "Яичко — тератома (по Хамеру)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма/зародышевая ткань (исключение)", "Реле в мозге": "Краниальная часть среднего мозга (исключение)", "Конфликт (тематика)": "Тяжёлый конфликт потери: ребёнка, лучшего друга, любимого человека, животного", "Биологический смысл": "В активной фазе: древняя способность к партеногенезу — «клонирование» после смерти родственника", "Активная фаза (СА)": "Рост компактной опухоли по типу архаичного эмбриона", "Фаза восстановления (ПКЛ)": "Остановка роста (с отсрочкой — «скачки роста» эмбриональной ткани), казеозный распад микобактериями/грибками; остаток можно удалить, но не обязательно (без симптомов)", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Тератома яичка", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кого вы потеряли (ребёнка, близкого, друга, животное)? Вините ли вы себя в этой потере?", "Примеры из практики": "Сам Хамер: смерть сына Дирка (ранен 18.08.1978, умер 07.12.1978) → тератома и интерстициальный некроз правого яичка (конфликт потери отец–сын, винил себя, что не забрал сына из клиники); разрешил конфликт беседами с женой. Перед операцией — «метастазы» в брюшине (атака на живот), после — асцит, туберкулёзный перитонит, задержка воды (Синдром), ночные поты; за 0,5–1 год всё отрегулировалось", "Подсказки, особенности": "DHS (Dirk Hamer Syndrome) — стержень ГНМ: остро-драматичный неожиданный шок + содержание конфликта определяет очаг в мозге и орган. Смерть другого человека конфликтна, только если человек остро переживает её", "Источник": "Хамер, germanische-neue-medizin.de/sonderprogramme/hodenkarzinom (PDF уроки 23–25)"}, {"№": "164", "Система": "Мочеполовая (мужская)", "Орган / часть / ткань": "Яичко — интерстициальная (гормонопродуцирующая) ткань (по Хамеру)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима (белое вещество) головного мозга; латеральность определяет, какое яичко", "Конфликт (тематика)": "Конфликт потери (умирание или уход человека) с безобразным полугенитальным аспектом (генитальная тема — фоном). Пример: мужчина узнаёт, что девушка тайно сделала аборт «его ребёнка»", "Биологический смысл": "В конце фазы исцеления: индурированная киста вырабатывает много тестостерона → репродуктивная способность и желание зачать, чтобы заменить потерю; «более мужественный босс» больше не теряет членов стаи", "Активная фаза (СА)": "Некроз, лёгкое тянущее ощущение; выработка тестостерона значительно снижается", "Фаза восстановления (ПКЛ)": "Некроз заполняется новыми клетками → киста яичка, сначала жидкая, за 9 месяцев индурируется (остаётся)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Если конфликт не решён, а лишь трансформирован — яичко всё больше атрофируется. Решение очень долгого конфликта → огромный отёк яичка", "Медицинские диагнозы": "Интерстициальный некроз яичка, киста яичка, атрофия яичка; два конфликта потери → некроз обоих яичек (констелляция паренхимы с сексуальной манией величия при сниженной детородной функции)", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кого вы потеряли (умер, ушёл)? Есть ли в этой потере что-то «безобразное», связанное с интимной сферой, детьми?", "Примеры из практики": "", "Подсказки, особенности": "Отличать от водянки яичка (брюшина при асците с открытым паховым каналом или оболочка яичка после конфликта атаки). Яичко относится к сегментам L1–L2 — увеличенные узлы там принимают за метастазы. После операций — конфликт потери самооценки (отсутствие яичка)", "Источник": "Хамер (PDF уроки 23–25)"}, {"№": "165", "Система": "Мочеполовая (мужская)", "Орган / часть / ткань": "Предстательная железа (свидетельство пациента у Хамера)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (по уроку 25)", "Реле в мозге": "Ствол головного мозга (по уроку 25)", "Конфликт (тематика)": "Конфликт деторождения или гендерный конфликт. Типичные случаи: мужчина думает, что у него никогда не будет внуков; девушку уводят или она уходит; сын пошёл опасным путём (наркотики) или гомосексуален; дочь с пагубными привычками или лесбиянка", "Биологический смысл": "Простата активна, чтобы производить больше секрета и доставить больше семенной жидкости «в нужное место»", "Активная фаза (СА)": "(в источнике не описано)", "Фаза восстановления (ПКЛ)": "Отёк простаты, сдавление уретры, затруднение мочеиспускания, температура 39,5°С, резкий рост ПСА (92,6) — затем снижение до нормы", "Эпикриз": "", "Зависание / рецидивы / синдром": "Повторные обследования области вызывают колебания ПСА", "Медицинские диагнозы": "Рак/увеличение простаты, задержка мочи, повышенный ПСА", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Будут ли у вас внуки/дети? Что происходит с детьми, с женщиной рядом, что вас задевает как мужчину?", "Примеры из практики": "Й. Хенкес (51 год): сын после операции парализован, его девушка забеременела до брака; «только не сейчас!» (католическое воспитание); на следующий день после УЗИ — задержка мочи. Разрешение — полное принятие («начните радоваться внуку»). ПСА 92,6 → 2,8 через полгода, катетер, от операции отказался", "Подсказки, особенности": "Хамер: при задержке мочи — установить катетер", "Источник": "Хамер, свидетельство пациента (PDF уроки 23–25)"}], "principles": [{"№": "1", "Раздел": "Органы и частные вопросы", "Тема": "Основа: болезней нет (урок 1)", "Содержание": "Согласно ГНМ болезней нет: изменения в теле направлены на выживание, пока существует конфликт. Конфликт = невозможность удовлетворить биологическую потребность. Основные процессы в органе: рост или утрата клеток, усиление или снижение функции, отёк, выход отёка, рубцевание, кровотечение, гной, температура, изменение чувствительности. Главное: что происходит, какие и где идут процессы, в тканях какого типа. ГНМ не рассматривает побочные эффекты лекарств, алкоголь/психоактивные вещества, травмы, вакцинацию, химические отравления — они не биологичны", "Источник": "Урок 1"}, {"№": "2", "Раздел": "Органы и частные вопросы", "Тема": "Подтверждения Хамера (урок 1)", "Содержание": "Все больные раком яичка — конфликт потери близкого; рака печени — страх умереть с голоду; рака лёгких — страх за свою жизнь или жизнь близкого. Конфликты оставляют видимые следы в мозге (очаги Хамера — концентрические кольца на КТ) в реле, управляющих органами. Четыре отдела мозга появились в разное время эволюции; кора — социальные и территориальные конфликты", "Источник": "Урок 1"}, {"№": "3", "Раздел": "Конфликт и его запуск", "Тема": "Биологический конфликт (урок 2)", "Содержание": "Невозможность удовлетворить биологическую потребность экзистенциальной значимости (угроза существованию или качеству жизни). Оценка субъективна: важно не что произошло, а как это ощущалось. У животных содержание всегда реально, у людей — реально или метафорично (нападение = физическое или оскорбление в лицо). «Кусок» для человека — деньги, должность, положение, статус", "Источник": "Урок 2"}, {"№": "4", "Раздел": "Органы и частные вопросы", "Тема": "Пример целесообразности: щитовидная железа (урок 2)", "Содержание": "Человек не справляется с обязанностями, выглядит аутсайдером среди коллег → конфликт собственной медлительности → больше тироксина → активнее, догоняет коллег", "Источник": "Урок 2"}, {"№": "5", "Раздел": "Опухоли, «метастазы», диагнозы", "Тема": "Внушения (урок 2)", "Содержание": "Любые внушения (близких из лучших побуждений, собственные мысли и страхи, паника от диагнозов) могут запускать конфликты. У детей абсолютное большинство симптомов — результат внушений. Неблагоприятный прогноз → вторичные конфликты («метастазы»). Пример: пациентка поняла «ТС» (трикуспидальный стеноз) как «терминальная стадия», а «Это конец» (конец обхода) — как приговор → отёк лёгких, смерть (Б. Лаун)", "Источник": "Урок 2"}, {"№": "6", "Раздел": "Биологические законы", "Тема": "1-й биологический закон (урок 2)", "Содержание": "Критерий 1: каждую СБП запускает СДХ — тяжёлый, драматичный, изолированно переживаемый шок; срабатывает бессознательно, «до того как человек начал думать». Нужны три условия: остро/драматично, неожиданно (не был готов), изолированно (один на один с собой: не рассказывает — не поймут, осудят, стыдно, социально неприемлемо). Нет хотя бы одного — программа не запускается. Критерий 2: восприятие в момент СДХ определяет очаг в мозге и орган (зависит от установок, воспитания, паттернов родителей, текущих биологических потребностей). Критерий 3: программа идёт синхронно на трёх уровнях — психика, мозг, орган", "Источник": "Урок 2"}, {"№": "7", "Раздел": "Органы и частные вопросы", "Тема": "Одно событие — разные органы (урок 2)", "Содержание": "Муж уходит к другой: у женщины без денег и с детьми — молочная железа (забота о гнезде, доме); у той, кто думает «я недостаточно привлекательна» — яичники (обрушение самооценки и утрата); у третьей («ушёл — и прекрасно») — драматичности нет, программа не запускается", "Источник": "Урок 2"}, {"№": "8", "Раздел": "Органы и частные вопросы", "Тема": "Стресс — следствие (урок 2)", "Содержание": "Не стресс вызывает болезни, а попадание в конфликт вызывает стресс. Признаки активной фазы: принудительное (навязчивое) мышление, поиск выхода, плохой сон, потеря аппетита, холодные руки и ноги. Одна конфликтная ситуация может запустить сразу несколько программ", "Источник": "Урок 2"}, {"№": "9", "Раздел": "Органы и частные вопросы", "Тема": "Эпидемии (урок 2)", "Содержание": "Если у группы людей одинаковые симптомы — каждый в одном типе конфликта (вся семья в ситуации «это воняет!» → после разрешения у всех насморк). Испанка: территориальный страх (бронхи) и страх смерти (альвеолы) за 4 года войны → после окончания массовое восстановление: кашель, пневмония, туберкулёз с кровавым кашлем; многие не пережили долгую фазу восстановления. Сиамские близнецы Маша и Даша болели корью и др. по отдельности", "Источник": "Урок 2"}, {"№": "10", "Раздел": "Биологические законы", "Тема": "2-й биологический закон: две фазы (урок 2)", "Содержание": "Каждая СБП имеет две фазы при условии разрешения конфликта. В момент СДХ нормотония (ритм день/ночь) сменяется постоянной симпатикотонией — активная, «холодная» фаза (СА): сужение периферических сосудов, озноб, холодные руки-ноги, нарушения сна и аппетита, мобилизация, принудительное мышление. Конфликтолиз (CL) тоже бессознательный (иногда — когда врачи отпустили домой и человек «отпустил»). Фаза восстановления (ПКЛ, «тёплая»): ПКЛ-А (экссудация, отёк в органе и в реле мозга), эпикриз, ПКЛ-В (рубцевание); тёплые руки-ноги, снижение тироксина, АКТГ, кортизола, адреналина, упадок сил, температура, боль. Отёк — фаза до 6 недель", "Источник": "Урок 2"}, {"№": "11", "Раздел": "Фазы и эпикриз", "Тема": "Эпикриз (урок 2)", "Содержание": "В самой глубокой точке ваготонии (обычно ночью во сне). Смысл: коротким сильным симпатикотоническим всплеском выдавить отёчную жидкость из очага Хамера и дать органу команду убрать лишнюю жидкость. Человек ненадолго снова как в активной фазе, но сильнее. Большой расход глюкозы, сахар может упасть почти до нуля — Хамер рекомендовал глюкозу и меньше жидкости. В ПКЛ-В очаг затягивается нейроглией (белое кольцо на КТ), орган рубцуется. Каждый прогон частично заменяет функциональную ткань соединительной", "Источник": "Урок 2"}, {"№": "12", "Раздел": "Конфликт и его запуск", "Тема": "Масса конфликта (урок 2)", "Содержание": "Масса = длительность × интенсивность. Считается, что каждые 10 лет масса снижается вдвое. От массы зависит длительность и глубина ваготонии («сколько болеет — столько восстанавливается») и сила эпикриза. Важно уменьшать массу (в т.ч. психотерапией) и решать конфликт как можно раньше; если решить нельзя — хотя бы снизить интенсивность", "Источник": "Урок 2"}, {"№": "13", "Раздел": "Треки и рецидивы", "Тема": "Зависание в фазах (урок 2)", "Содержание": "Зависание в активной фазе: человек не разрешает конфликт («работа не устраивает, но искать другую не хочу», «муж бьёт, ну ладно, потерплю») — может длиться до старости, если нет механических повреждений; опухоль реально усиливает функцию; риск — истощение или страх. Дикие животные не зависают. Биологическая смерть тоже завершает конфликт. Зависание в восстановлении — из-за рецидивов и треков; химиотерапия и препараты могут прерывать восстановление или запускать новые конфликты. Медицина видит симптомы двух фаз как две разные болезни", "Источник": "Урок 2"}, {"№": "14", "Раздел": "Треки и рецидивы", "Тема": "Рецидив и трек (урок 2)", "Содержание": "Рецидив — повторение первичного конфликта для того же органа/ткани (в фазе восстановления → возврат в активную фазу; после завершения → новая такая же программа). В момент СДХ психика фиксирует все детали обстановки, особенно непривычные/уникальные; такой нейтральный фактор становится треком в любой модальности: зрение, осязание, обоняние, слух, вкус. Треки — не враги, а предупреждающие сигналы. В терапии: решить конфликт или снизить интенсивность + «убрать» треки. Любая хроническая болезнь = рецидивы + треки; при постоянных рецидивах снижаются и функции соответствующей части мозга", "Источник": "Урок 2"}, {"№": "15", "Раздел": "Синдром и констелляции", "Тема": "Синдром подробно (урок 3)", "Содержание": "Синдром = одновременно активная программа собирательных трубочек почек + любая программа в фазе восстановления. Собирательные трубочки (энтодерма, ствол): конфликт брошенности и высыхания «я один», «у меня ничего нет», «всё потеряно», беженца, одиночества «меня все бросили», «рыба, выброшенная на берег», «госпитализации» («изолирован от родного дома»), беспомощности в решении своей проблемы. Смысл в активной фазе: удержать воду и мочевину. Вода удерживается в кавернах и жировой ткани; реально удерживается, только если вовлечены обе почки. Синдром усиливает отёки (гепатит → гепатомегалия; артрит → подагра: мочевая кислота — следствие, мочевина перерабатывается в белок) и отёк мозга. В терапии в первую очередь решать конфликт собирательных трубочек", "Источник": "Урок 3"}, {"№": "16", "Раздел": "Синдром и констелляции", "Тема": "Констелляция собирательных трубочек (урок 3)", "Содержание": "Конфликт обеих почек → констелляция: дезориентация во времени и пространстве («не знаю, где я, какой день») — потерявшийся детёныш остаётся на месте и ждёт маму. При удалении одной почки программа запускается в другой. Расходящееся косоглазие (глаз наружу, на стороне почки; можно вернуть усилием) — «рыба смотрит в сторону воды»", "Источник": "Урок 3"}, {"№": "17", "Раздел": "Органы и частные вопросы", "Тема": "История Дирка (урок 3)", "Содержание": "Июнь 1978 — первый конфликт беженца (арест в Риме из-за собаки, 3 недели в камере с преступниками, высылка). 18.08.1978 — второй (ранение, 4 часа один истекал кровью). Констелляция ствола обеих собирательных трубочек, олигурия 150–200 мл/сут, дезориентация (в реанимации думал, что в тюрьме). Выпоты в перикард, плевру, асцит — из-за Синдрома. Умер 07.12.1978 от инфаркта левого желудочка: из-за Синдрома не рассосался отёк в правом реле (территориальный конфликт)", "Источник": "Урок 3"}, {"№": "18", "Раздел": "Органы и частные вопросы", "Тема": "Очаг Хамера (урок 3)", "Содержание": "Возникает в реле, которое индивид в секунду СДХ ассоциирует с содержанием конфликта; одновременно запускаются процессы в соответствующем органе. По локализации очага — орган; по форме и цвету на КТ — фаза и интенсивность; чем сильнее и дольше конфликт, тем больше очаг", "Источник": "Урок 3"}, {"№": "19", "Раздел": "Фазы и эпикриз", "Тема": "Очаг Хамера по фазам (урок 3)", "Содержание": "СА: чёткие концентрические кольца. ПКЛ-А: отёк (интрафокальный — внутреннее кольцо, перифокальный — внешнее), кольца размываются; медицина называет это «опухолью мозга», хотя клетки мозга не делятся; возможно временное снижение/выпадение функции органа; при Синдроме очаг может быть весь в воде и задевать соседние реле. Эпикриз: выдавливание воды. ПКЛ-В: глия от внешнего края к центру, остаётся контур; ткань ригиднее — при повторе возможен разрыв (киста глии)", "Источник": "Урок 3"}, {"№": "20", "Раздел": "Биологические законы", "Тема": "3-й биологический закон: зародышевые листки (урок 3)", "Содержание": "Локализация очага и изменения ткани зависят от зародышевого листка. Эктодерма и энтодерма — 7–14 сутки, мезодерма — 15–17 сутки. Органы часто состоят из разных листков (глаз — все), а далёкие органы могут иметь соседние реле (среднее ухо и прямая/сигмовидная кишка в стволе). Древние ткани (ствол, мозжечок): в СА рост клеток, усиление функции; в ПКЛ распад. Новые (паренхима, кора): в СА деградация, в ПКЛ восполнение. Часть эктодермы (кора) меняет только функцию", "Источник": "Урок 3"}, {"№": "21", "Раздел": "Биологические законы", "Тема": "4-й биологический закон: микробы (урок 3)", "Содержание": "Микробы — не причина, а помощники восстановления в ПКЛ; до команды мозга «спят» (палочка Коха есть почти у всех, болеют единицы). Микробы эндемичны своей ткани. «Заразность» по ГНМ необоснована (одинаковая конфликтная реакция группы); но «чужеродные» микробы (в других странах) могут подселиться и навредить как небиологическое отравление. Грибки — энтодерма (ствол); микобактерии — старая мезодерма (мозжечок) и древние ткани, растут в СА пропорционально опухоли, работают в ПКЛ; бактерии (кокки) — новая мезодерма (паренхима), размножаются и работают с момента конфликтолиза, без них восстановление медленнее; вирусы («если существуют») — эктодерма. Без грибков/микобактерий (антибиотики, химиотерапия) опухоль инкапсулируется — безвредна, но видна на снимках", "Источник": "Урок 3"}, {"№": "22", "Раздел": "Ткани и схемы", "Тема": "Температура по тканям (урок 3, наблюдение из практики)", "Содержание": "Максимум температуры в ПКЛ: древние ткани (энтодерма) — 37,2; старая мезодерма (микобактерии) — 38,4; новые ткани — 39,5; эктодерма — самая высокая (40 — точно ПКЛ эктодермы). Выше 42 — необратимо. Температура может подниматься кратковременно/ночью. Несколько программ одновременно — низкую не видно на фоне высокой, поэтому по температуре только как один из инструментов", "Источник": "Урок 3"}, {"№": "23", "Раздел": "Биологические законы", "Тема": "5-й биологический закон (урок 3)", "Содержание": "Квинтэссенция: в природе нет ничего бессмысленного или злонамеренного; каждая СБП запускается, чтобы помочь разрешить конфликт и выжить. Кратковременные программы дают небольшие функциональные изменения, которые обычно не замечаются; большие клеточные изменения — только при продолжительной фазе конфликта", "Источник": "Урок 3"}, {"№": "24", "Раздел": "Конфликт и его запуск", "Тема": "Эволюция тканей и конфликтов (урок 4)", "Содержание": "1) Энтодерма + ствол: «амёба-кольцо» — найти, переварить пищу, выделить, размножиться; все вегетативные функции. Кусковые конфликты, абсолютные («нужен/полезен или ядовит», на уровне жизни и смерти). Рвотный рефлекс — отголосок кольца. Правая сторона — получение/продвижение полезного куска («невозможность получить кусок»), левая — определение опасного и выведение («невозможность избавиться от куска»). Также конфликт удержания воды. 2) Старая мезодерма + мозжечок: укрывные ткани, пассивная защита — конфликты грязи, обезображенности, атаки на целостность (реальной — удар; образной — врач говорит о полостной операции; оскорбления «облили грязью»); программа запускается в той части тела, которой субъективно воспринята атака. 3) Новая мезодерма + паренхима (белое вещество): опорно-двигательный аппарат (кости, сухожилия, мышцы, хрящи) и эмбриональные ткани — конфликт обрушения самооценки «сравнил себя с кем-то и проиграл». 4) Эктодерма + кора (серое вещество): территориальные конфликты, разделения, социальные", "Источник": "Урок 4"}, {"№": "25", "Раздел": "Латеральность, территории, гормоны", "Тема": "Биологическая латеральность (урок 4)", "Содержание": "Врождённая, не меняется в течение жизни; доминирует левое полушарие — правша, правое — левша. У однояйцевых близнецов один правша, другой левша. Амбидекстры — обычно переученные левши. Тесты: аплодирование (ведущая рука сверху), руки в замок (сверху палец ведущей руки), руки на груди (кисть ведущей сверху), беби-тест (правша кладёт ребёнка на левую руку). Для ствола и среднего мозга латеральность не важна («правая — вход, левая — выход»). Для мозжечка, паренхимы и коры: правша реагирует правой стороной на социальное взаимодействие, партнёров, отца, братьев/сестёр; левой — на мать, детей и тех, кого опекает (в т.ч. животных). У левши зеркально. Учитывать восприятие: муж как ребёнок → левая сторона у правши; немощный отец, которого опекают → левая; ребёнок-партнёр по бизнесу → правая. Сторона может определяться непосредственным воздействием (пункция, руки, которыми не удержал лестницу)", "Источник": "Урок 4"}, {"№": "26", "Раздел": "Ткани и схемы", "Тема": "Схема: энтодерма (ствол) (урок 4)", "Содержание": "СА: рост ткани (аденокарциномы, аденоидные клетки), смысл в СА — усилить орган. Клетка делится, только если работает на 100% (норма ~30%, при 80% деления нет) — поэтому слабый конфликт может долго не давать роста. Рост в прогрессии: видимые изменения не ранее 4 недель. Нет нервных окончаний — не болят, находят на плановом осмотре; боль — только если опухоль достигла чувствительных тканей. Параллельно размножаются грибки. Реле в стволе по ходу пищи, без перекреста. ПКЛ: рост прекращается, небольшой отёк, снижение функции (при Синдроме вплоть до выключения), распад чуть больше, чем выросло. Эпикриз — до 4 часов. ПКЛ-В: распад с грибками, кровотечения (чёрный кал при ЖКТ), ночные тёплые кислые гнилостные локальные поты (для новых тканей пот холодный, нелокальный, без сильного запаха). Без грибков — инкапсуляция. Нужна белковая пища (выход белка в моче), иначе белок берётся из мышц. Итог: функциональной ткани меньше, каверны, кисты, соединительная ткань; проблема — в рецидивах и зависании", "Источник": "Урок 4"}, {"№": "27", "Раздел": "Ткани и схемы", "Тема": "Схема: средний мозг (гладкая мускулатура) (урок 4)", "Содержание": "Относится к стволу, но переходная зона — частично как новая мезодерма. Органы: гладкая мускулатура артерий, кишечника, мускулатура матки, паренхима почек, жёлтое тело яичников и интерстициальная ткань яичек (тяжёлый непереносимый конфликт утраты); гаметы — исключение (энтодермальный паттерн). Темы: кишечник — недостаточность перистальтики, невозможность продвинуть кусок; матка — удержать плод, облегчить роды, стать сильнее (удержать мужчину), замещающий — помочь ребёнку стать сильнее; не удержать ребёнка, уезжающего из дома («матка — это дом»); гладкая мускулатура сердца — невозможность транспортировать достаточно крови. СА: локальное повышение тонуса и рост ткани, сниженная перистальтика в остальной части органа. ПКЛ: отёк, усиление перистальтики всего органа (колики); выросшая ткань остаётся. Эпикриз до 4 ч: сначала локальный тонус с остановкой остального, потом сильная перистальтика, сильная боль при спазмах, возможны кровотечения. Без перекреста, латеральность не учитывается, смысл в СА — орган остаётся сильнее", "Источник": "Урок 4"}, {"№": "28", "Раздел": "Ткани и схемы", "Тема": "Схема: мозжечок (старая мезодерма) (урок 4)", "Содержание": "Органы: укрывные структуры — дерма, плевра, перикард, брюшина, большой сальник; потовые, сальные железы, молочные железы (атака на гнездо). Конфликты атаки на целостность, грязи, обезображенности. С перекрестом, латеральность учитывается. Смысл в СА — усилить ткань для защиты. СА: рост клеток, без боли, размножаются микобактерии (не работают), возможны холодные поты. ПКЛ: небольшой отёк (перикардиальный выпот, плевральный выпот, асцит, «водяная подушка» под кожей при туберкулёзе дермы; в кишечнике жидкость предотвращает спайки), снижение функции (при Синдроме — до выключения); ночные тёплые локальные кислые гнилостные поты, усиливаются после эпикриза. Эпикриз до 45 мин: «внутренняя дрожь», «как слабый ток» без движения; многократное усиление функции (сильный пот, сало, выход молока); пот холодный. Туберкулёзный распад, t до 38,4; без микобактерий — инкапсуляция. ПКЛ-В: волнообразное локальное жжение, стягивающая боль. Нужна белковая пища. Итог — ткани меньше, кисты, каверны", "Источник": "Урок 4"}, {"№": "29", "Раздел": "Ткани и схемы", "Тема": "Схема: паренхима/белое вещество (новая мезодерма) (урок 5)", "Содержание": "Реле на КТ расположены от головы до пальцев ног. Конфликт обрушения самооценки; конкретная причина зависит от локализации и действия, которое орган не может совершить. С перекрестом (исключения без перекреста: мускулатура желудочков сердца, кора надпочечников, паренхима почек). Латеральность + какое именно действие не удалось (не удержал лестницу левой рукой → левая рука). Группа «Люкс»: после СБП ткани больше и она сильнее — смысл в конце фазы восстановления. СА: некроз ткани, снижение функции, бессимптомно; при зависании/рецидивах — спонтанные переломы, разрывы сухожилий при несильных нагрузках", "Источник": "Урок 5"}, {"№": "30", "Раздел": "Ткани и схемы", "Тема": "Новая мезодерма: восстановление (урок 5)", "Содержание": "ПКЛ: очень большие отёки за несколько дней — смысл обездвижить на время ослабления; при Синдроме ещё больше и может перекрыть соседние реле (в т.ч. в коре). Бактерии размножаются и работают с конфликтолиза; t до 39,5; без бактерий (препараты) восстановление медленнее — небиологичное зависание. Эпикриз до 60 секунд (чем моложе ткань — тем короче: энтодерма до 4 ч, мозжечок до 45 мин, новая мезодерма 1 мин, эктодерма 20 с). ПКЛ-В: избыточный рост, жжение, боль рубца; холодные поты, сильный упадок сил. Итог: ткани больше (костная мозоль). Очаг закрывается глией, на КТ белый", "Источник": "Урок 5"}, {"№": "31", "Раздел": "Ткани и схемы", "Тема": "Эмбриональные ткани (урок 5)", "Содержание": "Паренхима почек, яичники, яички. Фаза восстановления 9 месяцев (3 триместра): за несколько дней очень болезненный пульсирующий отёк, ослабление функции; 1-й триместр — тонкая оболочка кисты с жидкостью (диагноз «киста»); 2-й — стенки плотнеют, капилляры, своя система кровообращения (в почке — «опухоль Вильмса»); 3-й — уплотнение кисты (нефробластома). Фактически образуется новый функциональный орган", "Источник": "Урок 5"}, {"№": "32", "Раздел": "Ткани и схемы", "Тема": "Отделы коры (урок 5)", "Содержание": "Премоторно-сенсорная: эпителий протоков щитовидной железы и глоточных протоков (бессилие, фронтальный страх), слизистая придаточных пазух (неприятный запах), эмаль зубов (запрет укусить). Моторная: вся моторика поперечно-полосатой мускулатуры (трофика — из паренхимы); исключения, которыми не управляем: мускулатура желудочков сердца, сфинктеры желудка, илеоцекальный клапан. Конфликт моторики — невозможность/запрет/ограничение движения: руки — «у меня опускаются руки», «не могу удержать», «не могу защититься»; ноги — «не могу удержать», «не могу сбежать», «не знаю, что делать дальше». Сенсорная: чувствительность всего эпидермиса (схема «наружная кожа»). Постсенсорная: слизистые шейки матки, влагалища, прямой кишки, мочевого пузыря и уретры, мочеточников и лоханок, семенных пузырьков (тоже схема «наружная кожа»). Эпикриз сенсорной коры — потеря сознания: от незаметного абсанса до обморока. Зрительная (затылок): сетчатка и стекловидное тело — страх, подкрадывающийся сзади, вне зоны видимости; клеточных изменений нет, ни одна схема чувствительности", "Источник": "Урок 5"}, {"№": "33", "Раздел": "Ткани и схемы", "Тема": "Ствол vs кора: восприятие (урок 5)", "Содержание": "Ствол — архаичные фильтры: химический состав, польза/опасность куска, свет/тень (сосудистая оболочка глаза — энтодерма). Кора — сознательное: пахнет ли хорошо, вкусно ли, красиво или уродливо; при взгляде на человека древний мозг определяет, враждебен ли он, кора — насколько привлекателен", "Источник": "Урок 5"}, {"№": "34", "Раздел": "Ткани и схемы", "Тема": "Схема «Наружная кожа» — состав и протекание (урок 5)", "Содержание": "Эпидермис и волосы, слизистая гортани, слёзные протоки, слизистая бронхов, протоки молочных желёз (сосок), слизистая носа и пазух, нижняя часть наружного слухового прохода, надкостница; слизистая мочевого пузыря, мочевыводящих путей, лоханки, мочеточника, влагалища, шейки и зева матки, прямой кишки. Логика: всё, что видно снаружи; кожа проросла через нос по дыхательным путям и в груди (сосок, млечные протоки); всё ниже пупка — мочеполовые эктодермальные ткани и низ прямой кишки. СА: нарастающее онемение (смысл — забыть того, с кем контакт невозможен/неприятен); боли нет, диагностируют после конфликтолиза. ПКЛ: гиперчувствительность — боль только при прикосновении (тянущая, обжигающая), в отличие от постоянной/пульсирующей боли новой мезодермы. Эпикриз (≤20 с) — внезапная раздражающая чувствительность: чихание (нос), внезапный зуд, порыв кашля", "Источник": "Урок 5"}, {"№": "35", "Раздел": "Ткани и схемы", "Тема": "Схема «Глотка-слизистая» — состав и протекание (урок 5)", "Содержание": "Слизистая рта и языка, глотки, выводные протоки щитовидной железы, верхние 2/3 пищевода, протоки слюнных желёз, малая кривизна и привратник, луковица 12-перстной кишки, желчный пузырь и протоки, внутрипечёночные протоки, протоки поджелудочной, жаберные щели и производные жаберных дуг: коронарные артерии и вены, дуга аорты, сонная артерия, жаберные щели шеи; эмаль зубов. Логика: все эктодермальные органы ЖКТ + рот. СА: гиперчувствительность, жалящая/тянущая/жгучая боль (коронарные артерии — сильная острая боль; малая кривизна — жгучая); эпикриз — такая же, но сильнее, кратко. ПКЛ: онемение, нормализация к концу", "Источник": "Урок 5"}, {"№": "36", "Раздел": "Ткани и схемы", "Тема": "Эктодерма: клеточный процесс (урок 5)", "Содержание": "Для всех эктодермальных тканей: СА — изъязвление, клеток меньше (Хамер: смысл — расширить просвет; ведущая курса предполагает, что смысл скорее в сенсорике). ПКЛ — отёк очень быстро (иногда минуты), при Синдроме больше; восполнение и рубцевание. Правила коры: перекрест (с исключениями), латеральность учитывается, смысл в СА (изменение чувствительности), для территориальных зон — свои правила", "Источник": "Урок 5"}, {"№": "37", "Раздел": "Латеральность, территории, гормоны", "Тема": "Территориальные зоны: общее (урок 6)", "Содержание": "Территория — зона обитания и источник ресурсов для размножения. Содержание конфликтов не относится к функциям органов, а служит социальной иерархии, поэтому важен гормональный фон. Правая половина — «мужская», левая — «женская». Латеральность здесь определяет последовательность активаций. Территория самки определяется через самца (у неё — она и детёныши); у самца — внутренняя (дом, самка, детёныши) и внешняя (границы)", "Источник": "Урок 6"}, {"№": "38", "Раздел": "Латеральность, территории, гормоны", "Тема": "Реле территориального страха: гортань и бронхи (урок 6)", "Содержание": "Конфликт территориального страха/внезапного испуга — «враг у ворот» (ещё не на территории, но рядом; собака лает, чтобы никто не вошёл). Мужская зона — бронхи: нарычать, отогнать. Женская зона — гортань: в СА пропадает голос — спрятаться, не подавать звука. Если что-то может случиться — слизистая; если уже случилось (враг ворвался) — слизистая + мускулатура", "Источник": "Урок 6"}, {"№": "39", "Раздел": "Латеральность, территории, гормоны", "Тема": "Реле 4 и 8 часов (урок 6)", "Содержание": "Драка за территорию — чужак вторгся. Правое (мужское, «4 часа»): эпителий желудка, 12-перстной, желчных протоков, протоков поджелудочной (активируются вместе): чужак зашёл на мою территорию или пытается установить свои правила; СА — потеря аппетита, при еде дискомфорт и боль («на войне не едят»). Левое (женское, «8 часов»): слизистая прямой кишки — конфликт женской идентичности: «кто я», «будет ли со мной партнёр», «какую роль я занимаю», «считаются ли с моим мнением», «пойдёт ли так, как я хочу» — нет возможности обозначить себя/позицию; СА — онемение слизистой, изменения дефекации (нельзя метить, пока неясно, кому принадлежишь)", "Источник": "Урок 6"}, {"№": "40", "Раздел": "Латеральность, территории, гормоны", "Тема": "Периинсулярные реле (урок 6)", "Содержание": "Правое (мужское): территориальная утрата — внешней (бизнес, должность, деньги) или внутренней (дом, квартира, партнёрша); СА: гиперчувствительность коронарных артерий, брадикардия, снижение чувствительности полового члена/клитора, снижение тестостерона («нет территории — не размножайся»; задача — найти новую или вернуть старую). Левое (женское): сексуальная фрустрация — «выбрали не меня», невозможность спариваться с хозяином территории; смерть/уход партнёра, сексуальное насилие, невозможность контакта; СА: гиперчувствительность коронарных вен, тахикардия, онемение шейки матки, снижение чувствительности влагалища, снижение эстрогенов. Поведение: мужчины — «скупердяи» (сохранить ресурсы), женщины — «шопоголики» (приумножить)", "Источник": "Урок 6"}, {"№": "41", "Раздел": "Латеральность, территории, гормоны", "Тема": "Реле территориальной маркировки (урок 6)", "Содержание": "Конфликт «на мою территорию заходят, потому что я её недостаточно пометил»; в природе моча обозначает границы (мочевой пузырь, мочевыводящие пути)", "Источник": "Урок 6"}, {"№": "42", "Раздел": "Латеральность, территории, гормоны", "Тема": "Гормональный статус (урок 6)", "Содержание": "Соотношение мужских и женских гормонов. Изменён: у женщин — контрацептивы, беременность, лактация, удаление яичников, менопауза, гормональная терапия, конфликты/гипофункция яичников и коры надпочечников; у мужчин — отдельные препараты, вазэктомия, снижение тестостерона примерно с 70 лет. Смысл возрастного снижения: женщина может взять мужские функции защиты, мужчина менее агрессивен. Мальчики и девочки с рождения приравниваются к мужчинам и женщинам", "Источник": "Урок 6"}, {"№": "43", "Раздел": "Синдром и констелляции", "Тема": "Констелляция и правило весов (урок 6)", "Содержание": "Констелляция — активные конфликты в правой и левой территориальных зонах (у большинства взрослых). Каждая программа — гиря (масса конфликта). Правая зона регулирует тестостерон, левая — эстрогены; конфликт в зоне снижает соответствующий гормон. «Депрессия» (по Хамеру) — сильнее правая (мужская) зона: человек «женственнее», плохое настроение, пассивность, замкнутость, вялость, грусть. «Мания» — сильнее левая: активность, экстравертность, энергия. Весы качаются даже от одного услышанного слова (человек долго создавал — вспылил — разрушил — пожалел; Гоголь сжёг 2-й том «Мёртвых душ»). С момента констелляции останавливается созревание («детские лица» при ранней констелляции)", "Источник": "Урок 6"}, {"№": "44", "Раздел": "Латеральность, территории, гормоны", "Тема": "Правила весов (урок 6)", "Содержание": "1) При нормальном гормональном статусе первая активация — на гендерной стороне у правшей (мужчина-правша — правая зона, женщина-правша — левая); у левшей наоборот (женщина-левша — правая, но воспринимает по-женски и становится ещё женственнее; мужчина-левша — левая, становится ещё мужественнее). 2) Второй конфликт той же тематики — всегда на противоположной стороне. 3) С третьего: у правшей — на более загруженную сторону (разница растёт: депрессивный — ещё депрессивнее); у левшей — на менее загруженную (выравнивание). Первый сексуальный конфликт женщины-правши — левое периинсулярное реле: эстрогены снижаются, прекращаются овуляция и месячные. Однояйцевые близнецы (правша и левша) по-разному реагируют (Маша и Даша Кривошляповы). При смене гормонального статуса актуальный конфликт перемещается в другое полушарие («возрастные болезни»)", "Источник": "Урок 6"}, {"№": "45", "Раздел": "Опухоли, «метастазы», диагнозы", "Тема": "Доброкачественная/злокачественная опухоль (урок 7)", "Содержание": "ГНМ не делит опухоли на доброкачественные и злокачественные — это моменты одной программы, в которые сделали обследование. Древние ткани: точка А (начало СА) — почти норма, «здоров» (на КТ/МРТ изменения не ранее 4-й недели); Б (разгар СА) — много клеток, агрессивное деление — «злокачественная», без симптомов, функция усилена; В (сразу после CL, через несколько часов после Б) — клетки не делятся, есть грибки — «доброкачественная»; Г (ПКЛ) — меньше ткани, отёк, грибки — снова «злокачественная». Новые ткани: СА — язва, а не рак; ПКЛ-А — ткани ниже нормы, агрессивное деление, отёк — «злокачественная»; конец — «доброкачественная»; после — у новой мезодермы ткани чуть больше нормы — «доброкачественная»", "Источник": "Урок 7"}, {"№": "46", "Раздел": "Опухоли, «метастазы», диагнозы", "Тема": "Метастазы по ГНМ (урок 7)", "Содержание": "По ГНМ метастазов не существует (иначе раковые клетки находили бы в артериальной крови). Несколько опухолей — несколько программ или вторичные, чаще ятрогенные конфликты. Хамер: в день объявления диагноза у 98% снимки лёгких чистые; у 30–40% через 3–4 недели находят очаги — вторичный конфликт тупика/страха смерти (альвеолы)", "Источник": "Урок 7"}, {"№": "47", "Раздел": "Диагностика по признакам", "Тема": "Сводная диагностика по признакам (урок 7)", "Содержание": "ТЕМПЕРАТУРА в ПКЛ: энтодерма ≤37,2; старая мезодерма ≤38,4; новая мезодерма ≤39,5; эктодерма — без верхнего предела (>42 необратимо); 37–38 — возможна любая ткань; 40 — точно эктодерма (но не исключает другие). БОЛЬ: энтодерма и старая мезодерма не болят (боль — только если задеты соседние чувствительные ткани, как отёк миндалин задевает слизистую рта); гладкая мускулатура — болезненные спазмы в эпикризе; новая мезодерма — очень интенсивная пульсирующая боль при отёке в ПКЛ; эктодерма «глотка-слизистая» — боль в СА, «наружная кожа» — в ПКЛ; надкостница в СА — очень сильная тяжёлая боль; поперечно-полосатая мускулатура — боль в эпикризе. ЗУД — только эктодерма «наружная кожа», после эпикриза (реже в ПКЛ-А); в гортани и бронхах зуд = внезапный кашель. ПОТ: древние ткани — ночной, тёплый, кислый, гнилостный, локальный, усиливается после эпикриза; новые — холодный, не локальный, без гнилостного запаха. ЭПИКРИЗ: энтодерма ≤4 ч, старая мезодерма ≤45 мин, новая мезодерма ≤60 с, эктодерма ≤20 с. ГНОЙ — только ПКЛ древних тканей. ОТЁК: древние — небольшой, новая мезодерма — очень большой за несколько дней, эктодерма — очень быстро (минуты) и большой; отекает и реле мозга", "Источник": "Урок 7"}, {"№": "48", "Раздел": "Органы и частные вопросы", "Тема": "Животные (урок 7)", "Содержание": "Животные решают конфликт реально: восстановлением прежнего или жизнеспособной альтернативой (собака отгоняет хищника, утешается оставшимися щенками или снова беременеет — беременность после 1-го триместра в ваготонии разрешает конфликт), либо погибают; не зависают и обычно не попадают на рецидивы; человек после наводнения отстраивает дом, животное уходит. Беременная самка при погоне может абортировать — без груза бежать легче. Слоны «хоронят» сородичей — подобие ритуала разрешения. Гелады: 80% самок прерывают беременность при новом альфа-самце (резкое падение эстрогенов): самки-правши — конфликт территориальной утраты в левом периинсулярном реле → падение эстрогенов → выкидыш; самки-левши — правое реле, эстроген не падает, беременность сохраняется", "Источник": "Урок 7"}, {"№": "49", "Раздел": "Органы и частные вопросы", "Тема": "Два главных вопроса ГНМ", "Содержание": "Что происходит (какой процесс: рост/убыль клеток, функция) и в тканях какого вида (зародышевый листок)? Без ответа на оба вопроса нельзя определить конфликт и фазу", "Источник": "Урок 11, урок про кожу"}, {"№": "50", "Раздел": "Ткани и схемы", "Тема": "Древние ткани (энтодерма, жёлтые; управление из ствола мозга)", "Содержание": "Кусковые конфликты. В активной фазе — рост клеток (аденокарцинома), усиление функции, обычно бессимптомно (нет чувствительности). После разрешения — остановка роста по команде мозга, туберкулёзный распад с участием микобактерий/грибков, ночные кислые тёплые поты. Без микобактерий — инкапсуляция. Рецидивы → замещение функциональной ткани соединительной, полости, каверны, кисты, фиброз", "Источник": "Уроки 11, 12"}, {"№": "51", "Раздел": "Ткани и схемы", "Тема": "Новые ткани (эктодерма, красные; управление из коры)", "Содержание": "Конфликты территории, социальные, разделения, идентичности. В активной фазе — изъязвление/потеря клеток (некроз), в восстановлении — восстановление клеток с отёком, воспалением, покраснением, температурой. Конкретное содержание конфликта зависит от биологической латеральности, гормонального статуса и предыдущих конфликтов (правила весов)", "Источник": "Уроки 11, 12, кожа"}, {"№": "52", "Раздел": "Органы и частные вопросы", "Тема": "Схемы чувствительности", "Содержание": "Схема «глотка-слизистая» (слизистые эктодермы внутри тела: малая кривизна, луковица, протоки печени/поджелудочной, желчный пузырь, верхние 2/3 пищевода): боль и гиперчувствительность в активной фазе, гипочувствительность в восстановлении. Схема «наружная кожа»: онемение/потеря чувствительности в активной фазе, зуд/гиперчувствительность и боль в восстановлении", "Источник": "Уроки 11, 12, кожа"}, {"№": "53", "Раздел": "Ткани и схемы", "Тема": "Гладкая мускулатура (средний мозг)", "Содержание": "Ткань, растущая в активной фазе, после разрешения остаётся увеличенной (не некротизируется). Рецидивы → утолщение (например стеноз привратника). Сфинктеры открываются в симпатикотонии (активная фаза)", "Источник": "Урок 11"}, {"№": "54", "Раздел": "Органы и частные вопросы", "Тема": "Островковые клетки и подобные", "Содержание": "Меняется только функция, без клеточных изменений", "Источник": "Урок 11"}, {"№": "55", "Раздел": "Органы и частные вопросы", "Тема": "Мужская/женская реакция", "Содержание": "Женская (левая кора, альфа-клетки): пассивное замирание, «прикинуться мёртвым», страх и отвращение. Мужская (правая кора, бета-клетки): обороняться, сопротивляться, бороться, применить силу", "Источник": "Урок 11"}, {"№": "56", "Раздел": "Треки и рецидивы", "Тема": "Зависание и рецидивы", "Содержание": "Зависание в фазе и рецидивы сами по себе не биологичны и ведут к серьёзным последствиям; не пугаться, это «лишь зависание в процессе». Чем раньше решён конфликт, тем больше ресурсов у тела. Животные проживают реальную опасность, человек — воображаемую, поэтому изменения у людей сильнее", "Источник": "Уроки 11, 12"}, {"№": "57", "Раздел": "Синдром и констелляции", "Тема": "Синдром", "Содержание": "Синдром = активный конфликт собирательных трубочек почек (выживания/беженца) одновременно с восстановлением другой программы → задержка воды → многократное усиление отёка (протоки, пищевод, кисты-резервуары). При желтухе, протоках, кистах всегда проверять синдром и минимизировать его", "Источник": "Уроки 11, 12"}, {"№": "58", "Раздел": "Конфликт и его запуск", "Тема": "Конфликт и критерии ДХС", "Содержание": "Конфликт запускается неожиданностью, драматичностью, визуальностью (переживание в изоляции). Признаки попадания в конфликт: холодные руки-ноги, постоянный холод, пропал аппетит, мысли только об этом", "Источник": "Урок 11"}, {"№": "59", "Раздел": "Треки и рецидивы", "Тема": "Треки", "Содержание": "Треки — сопутствующие обстоятельства момента конфликта (дата, время года, растение, погода, еда, слова, люди, ссоры близких), которые потом перезапускают программу. При длительных процессах (диабет) сначала разбирать треки, потом основной конфликт", "Источник": "Урок 11, кожа"}, {"№": "60", "Раздел": "Органы и частные вопросы", "Тема": "Семья/стая", "Содержание": "Для желудка, поджелудочной, 12-перстной кишки в первую очередь искать конфликты внутри семьи/стаи. Ребёнок может проживать на телесном уровне конфликт мамы (в т.ч. во внутриутробном периоде)", "Источник": "Уроки 11, 12"}, {"№": "61", "Раздел": "Органы и частные вопросы", "Тема": "Мануальная работа", "Содержание": "При нарушениях ЖКТ автор рекомендует висцеральный массаж и восстановление режима питания/сна в дополнение к работе с конфликтом; одно не заменяет другое", "Источник": "Уроки 11, 12"}, {"№": "62", "Раздел": "Органы и частные вопросы", "Тема": "Медицинские термины", "Содержание": "Знать медицинские термины нужно, потому что клиент говорит языком врачей. Окончание «-ит» = воспаление = фаза восстановления. Внешняя компрессия/травма не биологична и в ГНМ не рассматривается", "Источник": "Уроки 11, 12"}, {"№": "63", "Раздел": "Конфликт и его запуск", "Тема": "Ятрогенные конфликты", "Содержание": "Диагноз и негативный прогноз врачей могут запускать новые конфликты (страх смерти, страх голода → вторичный рак печени) и внушением блокировать восстановление. Многие находки на МРТ — завершённые процессы", "Источник": "Урок 12"}, {"№": "64", "Раздел": "Конфликт и его запуск", "Тема": "Замещающий конфликт", "Содержание": "Единичный очаг (печень, лёгкие, бронхи жёлтых тканей) чаще говорит о замещающем конфликте — переживании за другого как за себя; множественные — о страхе за себя", "Источник": "Урок 12"}, {"№": "65", "Раздел": "Конфликт и его запуск", "Тема": "Разрешение конфликта", "Содержание": "Часто решение — позволить себе ту реакцию, которая нужна; проживать события без сопротивления, наблюдая свою реакцию. При боли (выход камня) — не сопротивляться, напряжение замыкает круг", "Источник": "Урок про кожу, урок 12"}, {"№": "66", "Раздел": "Ткани и схемы", "Тема": "Микробы", "Содержание": "По ГНМ микробы — помощники: микобактерии и грибки разрушают опухоли энтодермы в фазе восстановления (если присутствовали с момента DHS); без них — инкапсуляция. Вирусы («если существуют») участвуют в восстановлении эктодермы", "Источник": "Хамер; урок 12"}, {"№": "67", "Раздел": "Латеральность, территории, гормоны", "Тема": "4-часовое и 8-часовое реле", "Содержание": "4-часовое реле (территориальный гнев, мужская сторона): эпителий малой кривизны желудка, луковицы 12-перстной кишки, желчных протоков, протоков поджелудочной. 8-часовое (противоположная сторона): слизистая прямой кишки", "Источник": "Вопросы-ответы курса; урок 12"}, {"№": "68", "Раздел": "Органы и частные вопросы", "Тема": "Анальные сфинктеры", "Содержание": "Внутренний сфинктер (средний мозг): в симпатикотонии усиливает перистальтику для выведения застрявшего куска, смысл в активной фазе; в ваготонии расслабляется. Наружный (паренхима, новая мезодерма): в симпатикотонии открывается для выведения куска, в ваготонии закрыт. Конфликт наружного — невозможность пометить свою территорию", "Источник": "Вопросы-ответы курса (урок 13)"}, {"№": "69", "Раздел": "Органы и частные вопросы", "Тема": "Камни мочевой системы (урок 23)", "Содержание": "Камни говорят о зависании и рецидивах (единичный прогон бессимптомен); число и размер — по длительности, интенсивности, числу рецидивов. Оксалатные (до 75%): кальций в моче при распаде древних тканей (выход белка и кальция), образуются в собирательных трубочках. Уратные (~10%): закисление мочи в активной фазе древних тканей, рост креатинина и мочевины. Фосфатные (~5%): при рецидивах со сменой фаз древних тканей. Струвитные (15–20%): pH >7, фаза восстановления древних тканей. В мочевом пузыре соли выпадают песком — камни приходят из почек. Кальций из мочи (ПКЛ древних тканей и СА костной ткани) способствует росту камней", "Источник": "Урок 23"}, {"№": "70", "Раздел": "Органы и частные вопросы", "Тема": "Лоханки vs мочевой пузырь (урок 23)", "Содержание": "Одна тема — невозможность пометить территорию. Лоханки — «отсроченная» территория (будущая, которую нужно застолбить); мочевой пузырь — территория, которая УЖЕ есть", "Источник": "Урок 23"}, {"№": "71", "Раздел": "Органы и частные вопросы", "Тема": "Сфинктеры с обратной иннервацией (урок 23)", "Содержание": "Сфинктеры из поперечно-полосатой мускулатуры (прямой кишки, шейки матки, кардия, мочевого пузыря) открываются при расслаблении в симпатикотонии и закрываются напряжением в ваготонии", "Источник": "Урок 23"}, {"№": "72", "Раздел": "Фазы и эпикриз", "Тема": "Длительность фаз", "Содержание": "Длительность восстановления пропорциональна длительности и интенсивности конфликта: час конфликта → примерно полчаса первая половина восстановления + полчаса вторая. По симптому можно вычислить, что было за 1–3 часа до", "Источник": "Урок про кожу"}, {"№": "73", "Раздел": "Фазы и эпикриз", "Тема": "Эпилептический/эпилептоидный криз (эпикриз)", "Содержание": "Поворотная точка в середине фазы восстановления: организм сам останавливает и выдавливает отёк (в т.ч. отёк очага Хамера в мозге). На психике — повторное переживание всего конфликта «как в замедленной съёмке» за минуты–дни. Происходит ночью, в ваготонии, во сне/отдыхе. Симптомы: холодный пот, централизация, одышка, тошнота, головокружение, спазмы, головная боль, паника, абсансы. Кортикальные кризы — тонико-клонические судороги. После выдержанного криза без рецидивов «заболевание» в основном пережито", "Источник": "Хамер, т.1 (PDF 19–22)"}, {"№": "74", "Раздел": "Синдром и констелляции", "Тема": "Синдром (по Хамеру)", "Содержание": "Активный конфликт беженца / брошенности / экзистенциальный конфликт (собирательные трубочки почек) одновременно с фазой исцеления другого конфликта → задержка жидкости, отёки и кисты чрезвычайно увеличиваются", "Источник": "Хамер (PDF 19–22)"}, {"№": "75", "Раздел": "Латеральность, территории, гормоны", "Тема": "Латеральность", "Содержание": "Для конфликтов ствола мозга латеральность роли не играет; для большого мозга и мозжечка — огромное значение, плюс гормональная ситуация (менопауза, контрацептивы). Тест хлопка: сверху правая рука — правша, левая — левша. Леворукость переносит конфликт на противоположное полушарие", "Источник": "Хамер (PDF 10–13)"}, {"№": "76", "Раздел": "Конфликт и его запуск", "Тема": "Ятрогенные вторичные конфликты по Хамеру", "Содержание": "«Метастазы» по Хамеру — новые раки от новых конфликтов, часто вызванных диагнозом/прогнозом: атака на брюшную полость (брюшина), страх голода (солитарный очаг печени), страх рака (глоточные протоки), потеря самооценки (кости, лимфоузлы), кровотечение (селезёнка)", "Источник": "Хамер (PDF 10–13, 19–22)"}, {"№": "77", "Раздел": "Конфликт и его запуск", "Тема": "Три критерия запуска конфликта (СДХ/DHS)", "Содержание": "Неожиданно, драматично, изолированно (переживается в одиночку). «Накопительный эффект» — это не новый конфликт, а попадание на треки", "Источник": "Вопросы-ответы курса (PDF 23–25)"}, {"№": "78", "Раздел": "Треки и рецидивы", "Тема": "Работа с треками", "Содержание": "Трек — маркер ситуации, в которой произошёл конфликт, а не сам конфликт («когда цвела берёза — было опасно»). Работать нужно не с берёзой, а искать, что именно произошло, когда цвела берёза", "Источник": "Вопросы-ответы курса"}, {"№": "79", "Раздел": "Латеральность, территории, гормоны", "Тема": "Реле", "Содержание": "Реле расположены в определённых участках мозга в зависимости от ткани: ствол, мозжечок, паренхима (белое вещество) или кора. Орган из разных тканей имеет несколько реле", "Источник": "Вопросы-ответы курса"}, {"№": "80", "Раздел": "Конфликт и его запуск", "Тема": "Масса конфликта", "Содержание": "Интенсивность симптомов пропорциональна массе конфликта (длительность × интенсивность). Симптомы могут быть незаметны и в первый, и в последующие разы; человек обращает внимание, когда «крутится» в рецидивах. Фаза восстановления ориентировочно до 6 недель, полное восстановление тела — до 1,5–2 лет", "Источник": "Вопросы-ответы курса"}, {"№": "81", "Раздел": "Треки и рецидивы", "Тема": "Как отличить восстановление от зависания", "Содержание": "Смотреть эмоциональную реакцию: человек говорит о событии легко — «было и было», без напряжения и ухода от темы. Проверять все линии (партнёр для правши — супруг, брат, сестра, друзья, отец, коллеги). Смотреть динамику: при разрешении и отсутствии треков ткань восстанавливается — анализы помогают, но без эмоционального включения", "Источник": "Вопросы-ответы курса"}, {"№": "82", "Раздел": "Треки и рецидивы", "Тема": "Причины зависания в восстановлении", "Содержание": "Попадание на треки (кратковременная активная фаза, затем снова восстановление); приём лекарств продлевает фазу; общее напряжение/симпатикотония от других конфликтов снижает ваготонию", "Источник": "Вопросы-ответы курса"}, {"№": "83", "Раздел": "Латеральность, территории, гормоны", "Тема": "Гормональный статус и полушарие", "Содержание": "При смене гормонального статуса (возраст, менопауза) часть конфликтов разрешается → «возрастные» диагнозы (симптомы в восстановлении). Либо активный конфликт перемещается в другое полушарие: сам конфликт не меняется, меняется восприятие (мужское/женское); периинсулярное → периинсулярное другой стороны, 4-часовое ↔ 8-часовое (вместо болей в протоках поджелудочной — геморрой)", "Источник": "Вопросы-ответы курса"}, {"№": "84", "Раздел": "Конфликт и его запуск", "Тема": "Правша/левша и первый конфликт", "Содержание": "Правша-женщина на первый конфликт внезапного испуга всегда реагирует гортанью, правша-мужчина — бронхами (при нормальном гормональном статусе); у левшей наоборот. Левши в территориальных зонах в более выгодном положении: женщина-левша становится женственнее, мужчина-левша мужественнее; Хамер считал «нормальными» левшей", "Источник": "Вопросы-ответы курса"}, {"№": "85", "Раздел": "Латеральность, территории, гормоны", "Тема": "Периинсулярное реле и менструации", "Содержание": "Девочке-правше достаточно одного конфликта в периинсулярном реле, чтобы не было овуляции и месячных; девочке-левше — чтобы месячные пришли раньше", "Источник": "Вопросы-ответы курса"}, {"№": "86", "Раздел": "Органы и частные вопросы", "Тема": "Астма", "Содержание": "Астма (ларингиальная, бронхиальная, астматический статус) — констелляция: два конфликта в территориальных зонах коры. Масса конфликта при констелляции в территориальных зонах не растёт → при разрешении симптомы могут прекратиться сразу. При разрешении одного из конфликтов приступы прекращаются, но появятся симптомы восстановления этого органа", "Источник": "Вопросы-ответы курса"}, {"№": "87", "Раздел": "Синдром и констелляции", "Тема": "Констелляция", "Содержание": "Констелляция — два активных конфликта в разных полушариях; бывает в коре, стволе, мозжечке, паренхиме. Отличие от Синдрома: синдром — активный конфликт собирательных трубочек + восстановление другого", "Источник": "Вопросы-ответы курса"}, {"№": "88", "Раздел": "Органы и частные вопросы", "Тема": "Беременность", "Содержание": "С 4-го месяца беременности тело переходит в ваготонию: конфликты воспринимаются смягчённо или их активность переносится на послеродовой период", "Источник": "Вопросы-ответы курса"}, {"№": "89", "Раздел": "Конфликт и его запуск", "Тема": "Конфликт ребёнка", "Содержание": "У ребёнка собственный конфликт может быть с момента зачатия, но в терапии работают с мамой — она задаёт рамки восприятия", "Источник": "Вопросы-ответы курса"}, {"№": "90", "Раздел": "Латеральность, территории, гормоны", "Тема": "Территориальный страх: слизистая и мускулатура", "Содержание": "У Хамера и для слизистой, и для мускулатуры+слизистой (гортань/бронхи) — конфликт территориального страха; при меньшей интенсивности реагирует только слизистая, при большей — и мускулатура. Соседние реле часто включаются вместе", "Источник": "Вопросы-ответы курса"}, {"№": "91", "Раздел": "Органы и частные вопросы", "Тема": "Тики", "Содержание": "Тики — всегда эпикриз", "Источник": "Вопросы-ответы курса"}, {"№": "92", "Раздел": "Органы и частные вопросы", "Тема": "Боль надкостницы vs кости", "Содержание": "Надкостница (активная фаза): очень интенсивная боль, похожая на зубную, не зависит от движения. Отёк кости в восстановлении: распирающая боль, в покое не усиливается, скорее уменьшается", "Источник": "Вопросы-ответы курса"}, {"№": "93", "Раздел": "Органы и частные вопросы", "Тема": "Пальцы", "Содержание": "Пальцы — конфликт невозможности что-то сделать, взять, удержать. Сторона может определяться не латеральностью, а тем, какой рукой выполнялось действие в момент шока (женщина-правша прокручивала новости большим пальцем левой руки и увидела шокирующую новость о подруге; мужчина не удержал лестницу обеими руками)", "Источник": "Вопросы-ответы курса"}, {"№": "94", "Раздел": "Органы и частные вопросы", "Тема": "Анализы крови (пример)", "Содержание": "Высокие эритроциты — может быть активное желание действовать ради цели; низкие лейкоциты — активный конфликт обрушения самооценки для костной ткани + возможно Синдром", "Источник": "Вопросы-ответы курса"}, {"№": "95", "Раздел": "Органы и частные вопросы", "Тема": "Прямая кишка, слизистая: онемение", "Содержание": "Конфликт женской идентичности (слизистая прямой кишки): в активной фазе позывы в туалет могут не ощущаться; энкопрез отчасти связан с этим конфликтом; при рецидивах/зависании — трещины, кровотечения, особенно при Синдроме. Запор — конфликт для кишечника, сюда не относится", "Источник": "Вопросы-ответы курса"}, {"№": "96", "Раздел": "Органы и частные вопросы", "Тема": "Миома", "Содержание": "Миометрий — гладкая мускулатура: растёт в активной фазе, в восстановлении не распадается. Любой диагноз говорит о рецидивах. После разрешения миома перестаёт расти и уменьшается (уходит отёк, снижается кровоснабжение)", "Источник": "Вопросы-ответы курса"}, {"№": "97", "Раздел": "Ткани и схемы", "Тема": "Древние ткани: распад", "Содержание": "По практике в фазе восстановления распадается чуть больше ткани, чем выросло в активной фазе (Хамером не описано)", "Источник": "Вопросы-ответы курса"}, {"№": "98", "Раздел": "Органы и частные вопросы", "Тема": "Выпадение волос", "Содержание": "Если выпадение не прекращается — конфликт не решён; по практике при разрешении прекращается почти сразу", "Источник": "Вопросы-ответы курса"}, {"№": "99", "Раздел": "Органы и частные вопросы", "Тема": "ПМС", "Содержание": "Выраженный ПМС, по мнению ведущей курса, к конфликту отношения не имеет", "Источник": "Вопросы-ответы курса"}, {"№": "100", "Раздел": "Органы и частные вопросы", "Тема": "Сверхкомплектный зуб у ребёнка", "Содержание": "Фаза восстановления костной ткани (рост ткани). По практике автора — подождать, делать артикуляционные упражнения и гимнастику для челюсти", "Источник": "Вопросы-ответы курса"}, {"№": "101", "Раздел": "Конфликт и его запуск", "Тема": "Когда конфликт действительно решён", "Содержание": "Биологически конфликт решён, когда он не может повториться. У человека есть воображение, поэтому за ощущением «решилось» часто стоит лишь психологическое успокоение. Если в психике не осталось негативной оценки, треки реакции не вызывают. Трек — напоминание об опасности", "Источник": "Вопросы-ответы курса"}, {"№": "102", "Раздел": "Органы и частные вопросы", "Тема": "Анемия", "Содержание": "Анемия (кроме кровопотери, ЖКТ, диет) — всегда конфликт для костной ткани (костного мозга); при онкологии мочевого пузыря и падении гемоглобина — два отдельных процесса", "Источник": "Вопросы-ответы курса"}, {"№": "103", "Раздел": "Органы и частные вопросы", "Тема": "Гипо-/гипергликемическая кома", "Содержание": "«Кома» — переход от глубокой ваготонии к сильной симпатикотонии в момент эпикриза + время после него; препараты при медицинском вмешательстве удлиняют процесс и сам эпикриз", "Источник": "Вопросы-ответы курса"}, {"№": "104", "Раздел": "Ткани и схемы", "Тема": "Ткани «Люкс» (новая мезодерма, белое вещество)", "Содержание": "Биологический смысл — в конце фазы восстановления: организм «покупает» будущее улучшение функции временным ухудшением (остеолиз снижает прочность кости, потом кость крепче). У древних тканей усиление сразу, в активной фазе. Смысл некроза эктодермы в активной фазе Хамером не описан — не придумывать своё", "Источник": "Вопросы-ответы курса (цитата Хамера)"}, {"№": "105", "Раздел": "Органы и частные вопросы", "Тема": "Кисты и каверны", "Содержание": "В древних тканях с каждым прогоном ткани становится меньше → каверны растут. Киста — каверна, заполненная отёчной жидкостью. Каверны + отёк = рецидивирующий конфликт (+ возможно Синдром)", "Источник": "Вопросы-ответы курса"}, {"№": "106", "Раздел": "Органы и частные вопросы", "Тема": "Вздутие и метеоризм", "Содержание": "Не связаны с конфликтом желудка; могут быть конфликтом кишечника, печени, желчного пузыря (снижение ферментации), поджелудочной железы или илеоцекального клапана — уточнять симптомы", "Источник": "Вопросы-ответы курса"}, {"№": "107", "Раздел": "Органы и частные вопросы", "Тема": "Диабет 1 типа у девочки-правши", "Содержание": "Реле альфа- и бета-клеток не относятся к территориальным зонам, но для них действует правило весов: диабет 1 типа у девочки-правши говорит о наличии минимум одного конфликта в любом реле женской территориальной зоны (не обязательно страха/отвращения)", "Источник": "Вопросы-ответы курса"}, {"№": "108", "Раздел": "Треки и рецидивы", "Тема": "Диагноз = рецидивы", "Содержание": "Любой диагноз говорит о рецидивах (есть и активная фаза, и восстановление). Событие за 4–6 недель до ухудшения скорее всего не инициирующее, а рецидив — но его важно найти, чтобы понять трек. При инъекциях инсулина тело не может полностью пройти программу", "Источник": "Вопросы-ответы курса"}, {"№": "109", "Раздел": "Органы и частные вопросы", "Тема": "Неприятный запах изо рта", "Содержание": "Длительный неприятный (гнилостный) запах — распад древних тканей (подслизистая, аденоидная ткань, слюнные железы, миндалины); если годами — рецидивы конфликта (при одноцикличном прогоне восстановление уже завершилось бы). Рефлюкс — конфликт сфинктера пищевода и, возможно, малой кривизны, запах не вызывает", "Источник": "Вопросы-ответы курса"}, {"№": "110", "Раздел": "Органы и частные вопросы", "Тема": "Кхеканье у ребёнка", "Содержание": "Если ребёнок постоянно кхекает — скорее конфликт гортани, а не миндалин; при миндалинах будет неприятный запах изо рта (энтодерма)", "Источник": "Вопросы-ответы курса"}, {"№": "111", "Раздел": "Органы и частные вопросы", "Тема": "Онемение", "Содержание": "Причины онемения: конфликт для кровоснабжения, сенсорики или мышечной ткани — конкретизировать, что именно происходит", "Источник": "Вопросы-ответы курса"}, {"№": "112", "Раздел": "Органы и частные вопросы", "Тема": "Активность vs интенсивность", "Содержание": "Конфликт может быть активным, но слабой интенсивности — показатели анализов тогда в пределах условной нормы", "Источник": "Вопросы-ответы курса"}, {"№": "113", "Раздел": "Опухоли, «метастазы», диагнозы", "Тема": "«Винегрет» диагнозов", "Содержание": "Сложные диагнозы (болезнь Лайма, энцефалит, «рак средостения», ковид) — смесь симптомов разных СБП. Смотреть не на диагноз, а на конкретные симптомы: в каком органе и какой ткани идут процессы, и разбирать «винегрет на ингредиенты». «Перестаньте думать диагнозами!» (К. Кокорин)", "Источник": "Вопросы-ответы курса"}, {"№": "114", "Раздел": "Органы и частные вопросы", "Тема": "Очаг единичный/множественный", "Содержание": "У Хамера: для паренхимы печени и альвеол лёгких единичный очаг — замещающий конфликт за другого, множественные — за себя", "Источник": "Вопросы-ответы курса"}, {"№": "115", "Раздел": "Ткани и схемы", "Тема": "12-перстная кишка: новая мезодерма", "Содержание": "В 12-перстной кишке есть новомезодермальная ткань, но в конфликтах она не участвует", "Источник": "Вопросы-ответы курса"}, {"№": "116", "Раздел": "Органы и частные вопросы", "Тема": "Правило 9 месяцев", "Содержание": "Хамер: если конфликт (без констелляции) длится больше 9 месяцев, его нужно сознательно не разрешать до конца, а лишь снижать интенсивность — человек может не пережить эпикриз (инфаркт). Позднее он писал, что глубину ваготонии и силу эпикриза можно снижать преднизолоном — но, как подчёркивает ведущая, «мы не Хамер», дозы и длительность по КТ определять не можем", "Источник": "Вопросы-ответы курса"}, {"№": "117", "Раздел": "Латеральность, территории, гормоны", "Тема": "Периинсулярное реле и сердце", "Содержание": "Тахикардия — признак активного левого периинсулярного реле; в активной фазе может сопровождаться бессонницей. Инфаркт — эпикриз после конфликта периинсулярного реле", "Источник": "Вопросы-ответы курса"}, {"№": "118", "Раздел": "Органы и частные вопросы", "Тема": "Коклюш", "Содержание": "Коклюш — фаза восстановления конфликта для мускулатуры (и слизистой) гортани или бронхов (конфликт страха, испуга). Пример ведущей: прививка от страха заболеть может стать разрешением конфликта", "Источник": "Вопросы-ответы курса"}, {"№": "119", "Раздел": "Органы и частные вопросы", "Тема": "Ларингеальная астма / астматический статус", "Содержание": "Ларингеальная астма — минимум 2 СБП: мускулатура гортани + любой конфликт в правой половине территориальных зон; приступ — эпикриз мускулатуры гортани. Пока оба конфликта в симпатикотонии (СА или эпикриз) — констелляция, масса не растёт. Без констелляции был бы просто ларингит. Астматический статус — конфликт и для гортани, и для бронхов; бронхиальная астма — 2-й конфликт в любом реле женской зоны", "Источник": "Вопросы-ответы курса"}, {"№": "120", "Раздел": "Органы и частные вопросы", "Тема": "Мускулатура гортани", "Содержание": "Мускулатура гортани — новая мезодерма; тематика — обрушение самооценки от невозможности что-то сказать; реле в территориальной зоне отвечает за иннервацию и чувствительность", "Источник": "Вопросы-ответы курса"}, {"№": "121", "Раздел": "Диагностика по признакам", "Тема": "Температура 40+ у детей", "Содержание": "Температура 40+ — фаза восстановления конфликта разделения", "Источник": "Вопросы-ответы курса"}, {"№": "122", "Раздел": "Органы и частные вопросы", "Тема": "Потовые железы", "Содержание": "Потеющие ладони/стопы: смотреть локализацию — «выскользнуть из ситуации». Специфический запах апокринных — плюс к необходимости выскользнуть (кошка, которую держат на руках, «пахнет как скунс»)", "Источник": "Вопросы-ответы курса"}, {"№": "123", "Раздел": "Органы и частные вопросы", "Тема": "Псориаз (уточнение)", "Содержание": "Наложение 2 биологических программ на одной локализации, смещённых по фазам: на фоне покраснения (восстановление) — шелушение (активная фаза). Технически может относиться к разным людям (папа и тренер), но чаще — к одному человеку", "Источник": "Вопросы-ответы курса"}, {"№": "124", "Раздел": "Органы и частные вопросы", "Тема": "Выпадение волос", "Содержание": "Выпадение волос — активный конфликт; в фазе восстановления прекращается шелушение и выпадение (на отёке ещё может продолжаться)", "Источник": "Вопросы-ответы курса"}, {"№": "125", "Раздел": "Органы и частные вопросы", "Тема": "Папилломы, бородавки", "Содержание": "Смотреть, что выросло: кровоточит при повреждении — скорее эктодерма (эпидермис), не кровоточит — дерма. Возможна сочетанность дермы и эпидермиса. Локализация — зоны приятного/неприятного контакта + реальный контакт («не трогай лягушку — бородавки будут»)", "Источник": "Вопросы-ответы курса"}, {"№": "126", "Раздел": "Органы и частные вопросы", "Тема": "Родимые пятна", "Содержание": "Меланоциты есть в нижнем слое эпидермиса и в дерме — конфликт может быть для обеих тканей. Новые пятна в разных местах — привычный паттерн реагирования на конфликты разделения или атаки на целостность (или сочетанный)", "Источник": "Вопросы-ответы курса"}, {"№": "127", "Раздел": "Ткани и схемы", "Тема": "Жировая ткань и дерма", "Содержание": "При конфликте для жировой ткани (Люкс) в конце восстановления ткани больше, при конфликте дермы — меньше", "Источник": "Вопросы-ответы курса"}, {"№": "128", "Раздел": "Органы и частные вопросы", "Тема": "Глаза", "Содержание": "Мейбомиевы железы (старая мезодерма) — конфликт иссушения: увидела ужасную аварию, которую хочется скорее «развидеть». Лопнувший сосуд в глазу — новая мезодерма, обрушение самооценки «не могу что-то увидеть» (или воспаление конъюнктивы, синдром). Ангиопатия сетчатки — сосуды, обрушение самооценки. Косоглазие: в СА гладкая мышца напрягается (сходящееся), поперечно-полосатая ослабляется (расходящееся); проверить, управляется ли глаз волевым усилием; учитывать внутричерепное давление, фиброз стекловидного тела, дальнозоркость", "Источник": "Вопросы-ответы курса"}, {"№": "129", "Раздел": "Органы и частные вопросы", "Тема": "Сосуды", "Содержание": "Сосуды выполняют обеспечивающую, а не конфликтную функцию (при папилломах не участвуют)", "Источник": "Вопросы-ответы курса"}, {"№": "130", "Раздел": "Органы и частные вопросы", "Тема": "«Рак» как термин", "Содержание": "То, что врачи называют «раком», может относиться к любой фазе любой ткани (урок 7). Уточнять у врачей, где именно и в какой ткани идут процессы, + общие симптомы фаз (пот, температура и т.д.)", "Источник": "Вопросы-ответы курса"}, {"№": "131", "Раздел": "Органы и частные вопросы", "Тема": "Грипп", "Содержание": "Симптомы гриппа (усталость, кашель, насморк, боль в мышцах, нарастание температуры) — симптомы фазы восстановления", "Источник": "Вопросы-ответы курса"}, {"№": "132", "Раздел": "Органы и частные вопросы", "Тема": "Гастрит", "Содержание": "Гастрит — диагноз о рецидивах: изъязвление (активная фаза) и воспаление (восстановление) по кругу; если язву не видят, пишут гастрит; при зависании в восстановлении — атрофический гастрит", "Источник": "Вопросы-ответы курса"}, {"№": "133", "Раздел": "Латеральность, территории, гормоны", "Тема": "Латеральность глаз", "Содержание": "Где есть перекрест от органа к мозгу — учитывать латеральность (для правши правая сторона — партнёры, левая — мама, ребёнок, опекунство). У стекловидного тела перекрест есть. У сетчатки перекреста нет: у правшей левые половины сетчатки — партнёр, правые — мать и ребёнок", "Источник": "Вопросы-ответы курса"}, {"№": "134", "Раздел": "Органы и частные вопросы", "Тема": "Программы без клеточных изменений", "Содержание": "В СБП без изменений на клеточном уровне в восстановлении нет ни отёков, ни воспаления в органе —
