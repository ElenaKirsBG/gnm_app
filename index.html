яли из виду (умерли, уехали)? По кому скучаете?", "Примеры из практики": "Пожилую женщину отдают в дом престарелых — скучает по квартире, кошке, соседям. При разводе муж угрожает забрать детей; женщина-правша боится потерять детей из виду → левый глаз", "Подсказки, особенности": "Катаракта у пожилых — больше потерянных визуальных контактов", "Источник": "Урок 16 (PDF)"}, {"№": "110", "Система": "Глаза", "Орган / часть / ткань": "Радужная оболочка", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (цилиндрический кишечный эпителий)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Кусковой: захватить «световой кусок», увидеть то, что поможет выжить или избежать опасности; хочет что-то увидеть, но не удаётся, или не хочет видеть нежелательное", "Биологический смысл": "В активной фазе", "Активная фаза (СА)": "Как хориоидея — рост ткани", "Фаза восстановления (ПКЛ)": "Как хориоидея — воспаление", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → потеря пигмента и ткани, зрачок больше и асимметричен (колобома, остаётся); радужка светлеет в старости", "Медицинские диагнозы": "Ирит, колобома", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вы хотели увидеть и не смогли? Что не хотели видеть?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 16 (PDF)"}, {"№": "111", "Система": "Глаза", "Орган / часть / ткань": "Сетчатка и макула", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (часть мозга, выдвинутая на периферию); без клеточных изменений, ни одна схема чувствительности", "Реле в мозге": "Зрительная кора (затылок); БЕЗ перекреста: правое реле — правые половины сетчаток. У правши левые половины — партнёр, правые — мать и ребёнок", "Конфликт (тематика)": "Конфликт преследования, «страх сзади»: грозящая или подстерегающая опасность, от которой невозможно избавиться, может появиться из-за спины, вне зоны видимости", "Биологический смысл": "В активной фазе: снижение зрения делает опасность условно «невидимой» (дети при страхе закрывают глаза)", "Активная фаза (СА)": "Снижение зрения, помутнение, дефекты; палочки — плохое зрение в сумерках, колбочки — нарушение контраста и цвета; туннельное зрение; при зависании — слепые участки (скотома). Макула: не видит предмет в фокусе, видит сбоку; светочувствительность", "Фаза восстановления (ПКЛ)": "Отёк — зрение ещё хуже; при Синдроме гиперотёк → отслоение сетчатки (в зоне макулы — резкое ухудшение; при резких движениях — разрыв). Рубцевание сбоку → удлинение яблока → близорукость; сзади → укорочение → дальнозоркость (обычно необратимо)", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Скотома, макулодистрофия, отслоение сетчатки, близорукость, дальнозоркость, куриная слепота, нарушения цветовосприятия", "Чувствительность": "", "Метафоры, выражения": "«Страх сзади»; «опасность за спиной»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Чего вы боитесь «за спиной», что может появиться в любой момент? Кто вас преследует?", "Примеры из практики": "Владелец намеренно обанкротил фирму, чтобы уйти от налогов; налоговая это обнаружила — каждый день боится проверки или представителя закона", "Подсказки, особенности": "", "Источник": "Урок 16 (PDF)"}, {"№": "112", "Система": "Глаза", "Орган / часть / ткань": "Стекловидное тело", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Иннервация — зрительная кора, питание — паренхима (новая мезодерма); без клеточных изменений", "Реле в мозге": "Зрительная кора; С перекрестом: левые половины — из правого полушария. У правши правые половины — партнёр, левые — мать и ребёнок", "Конфликт (тематика)": "Преследование, «страх сзади», подстерегающая опасность вне зоны видимости", "Биологический смысл": "В активной фазе: помутнение — «шоры», преследователь невидим (заяц петляет, шанс выжить в 10 раз больше)", "Активная фаза (СА)": "Помутнение, сужение поля зрения, затуманивание; при рецидивах — прогрессирующая потеря периферического зрения", "Фаза восстановления (ПКЛ)": "Отёк, повышение глазного давления — глаукома; отёк может тянуть сетчатку (искажения, астигматизм)", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Помутнение стекловидного тела, «мушки», глаукома", "Чувствительность": "", "Метафоры, выражения": "«Шоры»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто/что угрожает вам сзади?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 16 (PDF)"}, {"№": "113", "Система": "Глаза", "Орган / часть / ткань": "Цилиарное тело", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (часть сосудистой оболочки)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Конфликт визуального «куска»", "Биологический смысл": "В активной фазе: больше жидкости — «эффект линз», усилить зрение", "Активная фаза (СА)": "Больше внутриглазной жидкости → повышение давления", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Глаукома", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 16 (PDF)"}, {"№": "114", "Система": "Глаза", "Орган / часть / ткань": "Сосудистая оболочка (хориоидея)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга; правый глаз — получить, левый — избавиться", "Конфликт (тематика)": "Не получить визуальный кусок (правый) или не суметь избавиться от того, что не хочется видеть/опасно (левый); визуальное разделение с объектом", "Биологический смысл": "В активной фазе: уловить больше света, чтобы разглядеть важное или опасное", "Активная фаза (СА)": "Рост ткани", "Фаза восстановления (ПКЛ)": "Воспаление — увеит", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы при каждом новом испуге в темноте", "Медицинские диагнозы": "Увеит, хориоидит", "Чувствительность": "", "Метафоры, выражения": "«Кусок света»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Когда вам не хватало света, было темно и страшно?", "Примеры из практики": "Ребёнок надел на голову пластмассовый ящик, голова застряла, внутри темно, бабушка не слышит за телевизором → правый глаз; рецидивы, когда через голову надевают свитер → увеит", "Подсказки, особенности": "Ствол различает лишь свет/тень как опасность", "Источник": "Урок 16 (PDF)"}, {"№": "115", "Система": "Глаза", "Орган / часть / ткань": "Цилиарная мышца и косые мышцы — близорукость/дальнозоркость", "Зародышевый листок": "Новая мезодерма + Гладкая мускулатура", "Ткань (подробно)": "Цилиарная — гладкая + поперечно-полосатая (по ГНМ); косые/прямые — поперечно-полосатые", "Реле в мозге": "Средний мозг + паренхима/моторная кора", "Конфликт (тематика)": "Близорукость: 4 причины — 1) цилиарная мышца (зависание в СА — постоянное напряжение гладкой; рецидивы/зависание в ПКЛ — поперечно-полосатая сильнее), 2) боковое отслоение сетчатки, 3) зависание в конфликте роговицы (кератоконус), 4) напряжение косых мышц (удлиняют яблоко, по д-ру Бейтсу). Дальнозоркость: 1) зависание цилиарной мышцы (расслабление), 2) заднее отслоение сетчатки, 3) зависание в конфликте прямых мышц. Возрастные: страх будущего («что со здоровьем?», «обеспечу ли себя в старости?», «удержусь ли на работе?», «что с родителями?») — тревожное будущее, «не хочется смотреть» → близорукость; у женщин дальнозоркость — не видеть в зеркале морщины", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Миопия (осевая, рефракционная), гиперметропия, пресбиопия", "Чувствительность": "", "Метафоры, выражения": "«Не хочу смотреть вдаль/в будущее»; «не хочу видеть морщины»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вас тревожит в будущем? Что вы не хотите видеть вблизи (своё отражение)?", "Примеры из практики": "", "Подсказки, особенности": "Удлинение глазного яблока на 1 мм = близорукость 3 диоптрии", "Источник": "Урок 16 (PDF)"}, {"№": "116", "Система": "Кожа", "Орган / часть / ткань": "Эпидермис (наружная кожа) — дерматит, нейродермит, экзема, крапивница, экзантема, атопический дерматит", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (красная, новая)", "Реле в мозге": "Кора головного мозга (сенсорная кора)", "Конфликт (тематика)": "Конфликт разделения: потеря жизненно важного контакта (желаемого) или желание отделиться от нежелательного контакта. Прямой контакт (папа гладит, сижу на коленях, объятия; папа выпорол) или метафорический (ссора родителей — «не могу занять ничью сторону, хочу отделиться от их споров»; «меня ругают → меня не любят → могут избавиться»). Нежелательный контакт: бабушка тискает, а я её боюсь; боюсь собаку", "Биологический смысл": "В активной фазе: потеря клеток → снижение чувствительности → легче забыть приятный контакт и пройти расставание без боли («чтобы расстаться легко, не должно быть больно»)", "Активная фаза (СА)": "Кожа немеет, бледная, сухая, шелушится; потеря чувствительности; обычно не замечается (списывают на усталость, старение, воду)", "Фаза восстановления (ПКЛ)": "Покраснение, воспаление, отёк, повышение температуры, зуд, иногда боль. Покраснение = в этот момент конфликта нет", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы через треки (дата, время года, цветущее растение, дождь, солнце, еда, слова, события)", "Медицинские диагнозы": "Дерматит, атопический дерматит, нейродермит, экзема, крапивница, «аллергия»", "Чувствительность": "Схема наружной кожи: в активной фазе онемение, в восстановлении — зуд, гиперчувствительность", "Метафоры, выражения": "«Бельчонок, которого мама оставила в гнезде»; зуд после душа («можно спокойно похрюкать — конфликта нет»)", "Вопросы (из курса)": "«Что было до? Что было за несколько часов до того, как появилось покраснение?»; «Было ли это днём?» (если покраснение после возвращения мамы — конфликт разлуки с родителями); для взрослых: «Почему тебе так важно быть рядом с кем-то или кого-то избегать? При каких условиях ты чувствуешь себя единым целым с этим человеком, а при каких не можешь с ним контактировать?»", "Вопросы (по теме конфликта)": "С кем вы потеряли контакт? От чьего прикосновения/контакта хотелось отстраниться?", "Примеры из практики": "Ребёнок, которого кормили грудью, а мама вышла на работу — теряет контакт-символ безопасности; вечером мама приходит, «дети висят на ней» → конфликт решён → покраснение, зуд, капризы. Ребёнок до года после поездки к бабушке расчёсывал себя до крови; мама села рядом, гладила и сказала по имени: «Ты можешь проживать свою жизнь, ты всегда можешь сказать нет тому, что тебя не устраивает, тебе нет необходимости решать мамины задачи» → перестал чесаться и уснул, утром ничего не беспокоило", "Подсказки, особенности": "Длительность восстановления ≈ длительности конфликта (час конфликта → полчаса до эпикриза + полчаса после). Аллергия — внушение или трек на разделение. Медикаментозная терапия, по опыту автора, лишь откладывает решение; лучше влажное полотенце, травяные настои от зуда. Эктодерма очень подвержена воображению и внушению: не транслировать ребёнку «опять началось». Первое — восстановить ощущение контакта (объятия, держать на руках, играть вместе). Внутренняя поверхность — желательные контакты, наружная (спина, задняя поверхность) — нежелательные", "Источник": "Урок про кожу/эпидермис (docx)"}, {"№": "117", "Система": "Кожа", "Орган / часть / ткань": "Псориаз", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (эпидермис)", "Реле в мозге": "Кора головного мозга (сенсорная кора)", "Конфликт (тематика)": "Два конфликта разделения в одной зоне, смещённые по фазе: «хочу контакта — и хочу его избежать». Метафора: «хочу быть включённым/причастным к сообществу, но не чувствую себя включённым» (класс не принимает; мама говорит «ты недостаточно хорош»)", "Биологический смысл": "", "Активная фаза (СА)": "Один конфликт активен (шелушение, сухая безжизненная чешуя)", "Фаза восстановления (ПКЛ)": "Другой в восстановлении (покраснение, зуд, чувствительность) — в той же зоне одновременно", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Псориаз (в т.ч. волосистой части головы)", "Чувствительность": "", "Метафоры, выражения": "«Я и хочу, и не хочу»; кожа головы — интеллектуальное обесценивание", "Вопросы (из курса)": "«В какое сообщество, в какую группу я не могу попасть, но хотел бы? Из какой группы меня исключили, а я хотел бы туда попасть?»", "Вопросы (по теме конфликта)": "С кем вы хотите быть рядом, но что-то в этом человеке вам неприятно?", "Примеры из практики": "Молодая женщина узнала об измене любимого: хочет близости и объятий — и ей неприятно → псориаз по всему телу, решено за одну терапию. Ребёнок хочет объятий папы, но папа пьёт, неприятен запах. Невестка любит мужа и уважает свекровь, а свекровь подчёркивает её «глупость» → псориаз волосистой части головы. Ребёнка с псориазом отвергали в классе; в новой школе он вышел и сказал, что очень хотел бы дружить с каждым — все обняли его, через 2 дня псориаз прошёл", "Подсказки, особенности": "Правило «внутренняя = желательный контакт, наружная = нежелательный» при псориазе искажается (на внутренней поверхности рук — «хочу обнять и не хочу»)", "Источник": "Урок про кожу/эпидермис (docx)"}, {"№": "118", "Система": "Кожа", "Орган / часть / ткань": "Розацеа", "Зародышевый листок": "Старая мезодерма + Эктодерма", "Ткань (подробно)": "Эктодерма (эпидермис, нерв) + старая мезодерма (дерма): несколько тканей", "Реле в мозге": "Кора головного мозга (эпидермис, тройничный нерв); для дермы в лекции реле не уточнено", "Конфликт (тематика)": "Сочетание нескольких оттенков: конфликт контакта/разделения (противоречие «люблю — и стыжусь/боюсь»), самообесценивание, защита; страх «потерять лицо»", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "Медикаментозные попытки, по опыту автора, ухудшали процесс", "Медицинские диагнозы": "Розацеа, невралгия тройничного нерва (часто сопровождает, отмечено в таблицах Хамера)", "Чувствительность": "", "Метафоры, выражения": "«Потерять лицо»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кого вы стыдитесь и при этом любите? Боитесь ли вы, что вас увидят с ним? Где вы обесцениваете себя?", "Примеры из практики": "Девушка с розацеа с 12 лет (сейчас ~30): папа уходил в запои, она боялась, что одноклассницы узнают; любит папу, но боится идти с ним пьяным по улице — противоречие", "Подсказки, особенности": "Не попадаться на внешнюю часть — разбирать все слои. Различать: одна ситуация с двумя противоположными реакциями (решаешь одну — результат) vs два конфликта (решён один — симптомы могут усилиться, работа продолжается)", "Источник": "Урок про кожу/эпидермис (docx)"}, {"№": "119", "Система": "Кожа", "Орган / часть / ткань": "Эпидермис — общее (урок 15)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Сенсорная кора", "Конфликт (тематика)": "Конфликт разделения: отсутствие желаемого телесного контакта или наличие неприятного. Локальная активация — то место, которым физически касались, а теперь нет (мама прикладывала к груди, гладила по щеке). Латеральная/по поверхности: потеря желаемого контакта — внутренние поверхности (живот, грудь, внутренние стороны рук и ног — которыми прижимаемся, обнимаем); нежелательный контакт — наружные (локти, спина, внешние стороны рук и ног — которыми отталкиваем). Дети воспринимают генерализованно — сыпь по всему телу", "Биологический смысл": "В активной фазе: онемение → временное забвение неприятного/невозможного контакта", "Активная фаза (СА)": "Снижение чувствительности до онемения; кожа сухая, трескается", "Фаза восстановления (ПКЛ)": "Зуд (характерен только для эпидермиса в фазе восстановления)", "Эпикриз": "Внезапный зуд", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Дерматиты, экзема, сыпь", "Чувствительность": "Схема «наружная кожа»", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Чьего прикосновения вам не хватает? Чьего контакта хочется избежать? Какой частью тела вы касались/отталкивали?", "Примеры из практики": "", "Подсказки, особенности": "Если есть зуд — фаза восстановления эпидермиса", "Источник": "Урок 15 (PDF)"}, {"№": "120", "Система": "Кожа", "Орган / часть / ткань": "Волосы", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Кора головного мозга", "Конфликт (тематика)": "Конфликт разделения — место, которое гладили, а теперь нет; интеллектуальное обрушение самооценки с чувством вины/стыда («я не смог», «я не сумел»)", "Биологический смысл": "", "Активная фаза (СА)": "Истончение, выпадение, снижение пигмента (тусклый цвет), при большой массе — седина", "Фаза восстановления (ПКЛ)": "Прекращение шелушения кожи головы и выпадения (на отёке ещё может быть)", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Алопеция, выпадение волос, седина", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто вас гладил по голове, а теперь нет? В чём вы «не смогли, не сумели» и стыдитесь/вините себя?", "Примеры из практики": "Седина в пожилом возрасте — вероятно разделение: дети уехали, умирают друзья, супруг", "Подсказки, особенности": "", "Источник": "Урок 15 (PDF)"}, {"№": "121", "Система": "Кожа", "Орган / часть / ткань": "Ногти и «грибок ногтей»", "Зародышевый листок": "Старая мезодерма + Эктодерма", "Ткань (подробно)": "Ноготь — эктодерма; под ногтем — дерма (старая мезодерма)", "Реле в мозге": "Кора (ноготь); мозжечок (дерма)", "Конфликт (тематика)": "Грибок — туберкулёзный распад в дерме под ногтем в фазе восстановления; наблюдение за процессом может запустить вторичный конфликт отвращения, непринятия (+ потовые железы — «выскользнуть»)", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "Распад дермы под ногтем с грибками", "Эпикриз": "", "Зависание / рецидивы / синдром": "Замкнутый круг: отвращение → потливость рук/ног → постоянные рецидивы для дермы", "Медицинские диагнозы": "Онихомикоз (грибок ногтей), потливость", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вызывает у вас отвращение (в т.ч. сам вид ногтей)?", "Примеры из практики": "", "Подсказки, особенности": "Грибки работают только в древних тканях", "Источник": "Урок 15 (PDF)"}, {"№": "122", "Система": "Кожа", "Орган / часть / ткань": "Базальный слой эпидермиса — меланоциты (витилиго)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (глубокий слой)", "Реле в мозге": "Кора", "Конфликт (тематика)": "Грубый, очень жестокий или жёсткий конфликт разделения с близким человеком", "Биологический смысл": "", "Активная фаза (СА)": "Уменьшение меланина — светлые пятна (витилиго = активная фаза глубокого слоя)", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "Связь через смс после расставания держит конфликт активным", "Медицинские диагнозы": "Витилиго", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "Витилиго на ногах: «Из какой ситуации ты хотел, но не смог убежать?»", "Вопросы (по теме конфликта)": "С кем было жёсткое, несправедливое расставание? Поддерживаете ли вы связь?", "Примеры из практики": "Женщина влюбилась в мужчину из другого города; он не считал нужным приезжать, ездила всегда она; расставание воспринято как несправедливое → белые пятна на внутренних поверхностях рук и ног; переписка по смс держит конфликт активным", "Подсказки, особенности": "Учитывать тематику, локализацию и действие, которое хочешь, но не можешь сделать", "Источник": "Урок 15 (PDF)"}, {"№": "123", "Система": "Кожа", "Орган / часть / ткань": "Веки (наружная сторона)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Кора", "Конфликт (тематика)": "Что-то произошло, когда глаза были закрыты (ребёнок спал, когда мама ушла на работу, и остался один). Если глаза были открыты — скорее сетчатка или стекловидное тело", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Дерматит век", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что случилось, пока вы спали/были с закрытыми глазами?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 15 (PDF)"}, {"№": "124", "Система": "Кожа", "Орган / часть / ткань": "Дерма (родинки, меланома, проказа, чума)", "Зародышевый листок": "Старая мезодерма", "Ткань (подробно)": "Старая мезодерма", "Реле в мозге": "Мозжечок", "Конфликт (тематика)": "Грязь, обезображенность, атака на целостность: удар, слова врача о полостной операции; оскорбления «меня как будто окунули лицом в грязь», «удар в спину»", "Биологический смысл": "В активной фазе: усиление дермы для защиты", "Активная фаза (СА)": "Рост дермы; если затронуты меланоциты дермы — тёмно-красные/коричневые пигментные пятна, меланома; разрастания выходят наружу — новые родинки (не исчезают: снаружи микобактерии не активны)", "Фаза восстановления (ПКЛ)": "Туберкулёзный распад с грибковыми бактериями, вонючий", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Родинки, меланома, невусы; средневековые лепра (генерализованный конфликт) и чума (локальный, огромные волдыри = гиперотёк при Синдроме)", "Чувствительность": "", "Метафоры, выражения": "«Облили грязью»; «удар в спину»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы почувствовали себя осквернённым, обезображенным, атакованным? Какой частью тела?", "Примеры из практики": "Средние века: смертность до 95%, ужасные условия, отсутствие гигиены — конфликты «обезображенности», «беззащитности»; когда условия улучшились и люди почувствовали себя «чище», болезни отступили", "Подсказки, особенности": "", "Источник": "Урок 15 (PDF)"}, {"№": "125", "Система": "Кожа", "Орган / часть / ткань": "Потовые и сальные железы (акне)", "Зародышевый листок": "Старая мезодерма", "Ткань (подробно)": "Старая мезодерма", "Реле в мозге": "Мозжечок", "Конфликт (тематика)": "Грязь, осквернённость, изуродованность, обезображенность — надо от чего-то избавиться", "Биологический смысл": "В активной фазе: усилить пот и кожное сало, чтобы «выскользнуть» из ситуации", "Активная фаза (СА)": "Рост ткани, усиление потоотделения, больше кожного сала (волосы быстро засаливаются)", "Фаза восстановления (ПКЛ)": "Створаживание ткани с грибками и микобактериями, гной с гнилостным запахом — акне, угревая сыпь", "Эпикриз": "Сильная потливость, усиленное выделение сала", "Зависание / рецидивы / синдром": "Подростковый круг: комплексы о внешности → акне → ещё больше комплексов; принимает себя — акне уходит", "Медицинские диагнозы": "Акне, угревая сыпь, гипергидроз, фурункулы (гной — древние ткани)", "Чувствительность": "", "Метафоры, выражения": "«Выскользнуть из ситуации»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "От чего вам хочется поскорее «выскользнуть»? Что вам кажется в себе некрасивым, грязным?", "Примеры из практики": "", "Подсказки, особенности": "Аккринные железы (ладони, стопы, голова) — без запаха; апокринные (подмышки, анус, гениталии, пупок, соски; активны 14–60 лет) — запах, феромоны. Железы Монтгомери и мейбомиевы — разновидности сальных; секрет Монтгомери при беременности растёт физиологически. Все гнойные процессы — только в древних тканях и только в восстановлении", "Источник": "Урок 15 (PDF)"}, {"№": "126", "Система": "Кожа", "Орган / часть / ткань": "Подкожная клетчатка: соединительная и жировая ткань (целлюлит, слоновость)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима (белое вещество)", "Конфликт (тематика)": "Обрушение самооценки; отложения там, где человек воспринимает себя некрасивым, неэстетичным (у женщин — живот, бёдра, ноги)", "Биологический смысл": "В конце фазы восстановления (Люкс): ткани больше", "Активная фаза (СА)": "Некроз (бессимптомно)", "Фаза восстановления (ПКЛ)": "Разрастание жировой ткани с каждым прогоном; целлюлит = восстановление жировой ткани + Синдром (вода удерживается в жировом слое)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Элефантиаз (слоновость) — локальный конфликт + постоянное зависание в восстановлении", "Медицинские диагнозы": "Жировые отложения, целлюлит, слоновость, лишний вес", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какие части тела вам кажутся некрасивыми? Где вы сравниваете себя с другими и проигрываете?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 15 (PDF)"}, {"№": "127", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Надкостница", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма; только изменение чувствительности", "Реле в мозге": "Кора головного мозга", "Конфликт (тематика)": "Интенсивный, брутальный, грубый, жёсткий конфликт разделения; на черепе — жёсткое разделение, расставание, потеря лица, пощёчина", "Биологический смысл": "В активной фазе: сильнее чувствовать разделение колющей болью — остановить животное (жертвенная смерть на пользу группе)", "Активная фаза (СА)": "Очень сильные, тяжёлые, жгучие, разлитые боли (как зубная), не зависят от движения", "Фаза восстановления (ПКЛ)": "Боль только в эпикризе; в ПКЛ кости отёк распирает надкостницу — боль от неё", "Эпикриз": "Сильная боль", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Боли в костях, мигрень (надкостница черепа), невралгия", "Чувствительность": "Схема «глотка-слизистая» (уроки 8, 22; в уроке 5 указана в «наружной коже»)", "Метафоры, выражения": "«Отрезали по живому»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "С кем было жестокое, грубое разделение?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 8 (PDF); вопросы-ответы"}, {"№": "128", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Кости — общее; карта локализаций", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма (Люкс)", "Реле в мозге": "Паренхима; латеральность (правша: правая сторона — партнёр, левая — мать/ребёнок) или действие, которое не удалось", "Конфликт (тематика)": "Обрушение самооценки: «я сравнил себя с кем-то и проиграл», по локализации и действию, которое часть тела не смогла совершить. Может запускаться и постоянным ощущением, что что-то гложет, давит (без шока), но важна изолированность. КАРТА: череп и шея — интеллектуальное или моральное обрушение самооценки; плечи — «я плохая мать», «я плохой партнёр», невозможность кого-то обнять или «я недостоин объятий» (правша: правое — муж/жена, левое — ребёнок, мама); позвоночник — «ситуация гнёт меня», «я не смог», «я не могу», «я весь непригоден»; рёбра — локальный конфликт «здесь что-то не так» (после удаления груди; органы грудной клетки); шейка бедра — не хватает усилий с чем-то справиться; кости таза — сексуальное обрушение самооценки; копчик — сексуальное с «грязным» оттенком («эта связь меня чернит»); руки, пальцы — невозможность что-то сделать, неловкость: «я не смог взять», «я был слишком неловким», «я не хочу это делать»; колени — «если бы я реагировал быстрее»; ноги — ситуация, из которой не получилось уйти, избежать. Локальная активация — после травмы внушение «эта часть больше не будет работать как раньше» (особенно у пожилых)", "Биологический смысл": "В конце восстановления: кость толще и сильнее (в месте заживления почти не сломать)", "Активная фаза (СА)": "Остеолиз, снижение плотности, выход кальция в кровь (кальций повышен); через 3–4 мес. нерешённого конфликта растёт риск спонтанного перелома", "Фаза восстановления (ПКЛ)": "Отёк кости распирает чувствительную надкостницу — сильная боль (смысл — обездвижить); при прорыве надкостницы каллус выходит наружу — «остеосаркома» (может вызвать и пункция)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Зависание в СА → потеря ткани, деформация, затем упрочнение уже деформированных костей; боли от сдавления нервов; остеопороз; болезнь Педжета (зависание + чередование фаз)", "Медицинские диагнозы": "Остеолиз, «метастазы в кости», остеосаркома, остеопороз, болезнь Педжета, переломы", "Чувствительность": "Кость не болит — болит надкостница", "Метафоры, выражения": "«Я проиграл в сравнении»; «ситуация гнёт меня»; «если бы я реагировал быстрее»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "С кем вы себя сравнили и проиграли? Какое действие этой частью тела вы не смогли совершить? Что вас «гнёт»?", "Примеры из практики": "Мужчина не удержал лестницу, на которой стоял сын, — конфликт для обеих рук (независимо от латеральности)", "Подсказки, особенности": "Сила конфликта по плотности ткани: слабые — лимфоузлы, средние — сухожилия, связки, мышцы, сильные — суставы и кости; сила — и по генерализации. В Азии (уважение к старшим, последнее слово за ними) остеопороз реже; в Японии и Индии не зарегистрирована болезнь Педжета (по источнику)", "Источник": "Урок 8 (PDF); урок 4"}, {"№": "129", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Суставы (артроз/артрит, подагра)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма (суставные поверхности, сумка, синовиальная оболочка)", "Реле в мозге": "Паренхима", "Конфликт (тематика)": "Обрушение самооценки по локализации и действию; самые сильные конфликты бьют в суставы и кости", "Биологический смысл": "Конец восстановления", "Активная фаза (СА)": "Некроз сустава (до разрушения при зависании), компенсаторное уплотнение концов костей, боли после нагрузок и ночью, деформация — артроз; отслоение хряща — «суставная мышь» (болезнь Кёнига), блокады с острой болью", "Фаза восстановления (ПКЛ)": "Отёк, воспаление — артрит (бактерии работают — «септический артрит»); жидкость синовии принимают за гной — это не гной (гной только в древних тканях). Артрит + Синдром = подагра (задержка мочевой кислоты — белок собирательными трубочками)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы/зависание → разрастание, кальцификация, снижение подвижности. Больной сустав запускает новый конфликт («не смогу гулять», «придётся просить помощи») — замкнутый круг", "Медицинские диагнозы": "Артроз, артрит, подагра, псориатический артрит (+ эпидермис), реактивный артрит/синдром Рейтера (+ программа ЖКТ или мочеполовой системы), рассекающий остеохондрит", "Чувствительность": "Боль в ПКЛ: интенсивная, пульсирующая, распирающая", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какое движение/действие этим суставом вы не смогли совершить? В чём проиграли?", "Примеры из практики": "", "Подсказки, особенности": "«-оз» — дистрофия, «-ит» — воспаление (= фаза восстановления). Боль ПКЛ новой мезодермы уменьшается при спаде отёка, разрешении Синдрома, тёплых ваннах с солью", "Источник": "Урок 8 (PDF)"}, {"№": "130", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Межпозвонковые диски и позвонки (протрузия, грыжа, искривление)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима; латеральность", "Конфликт (тематика)": "Обрушение самооценки (позвоночник — «ситуация гнёт меня», «я не смог», «я весь непригоден»). Боковое искривление — сторона партнёра или матери/ребёнка; «жизнь давит сзади/спереди» — искривление назад/вперёд", "Биологический смысл": "Конец восстановления", "Активная фаза (СА)": "Деградация дисков, обезвоживание пульпозного ядра; односторонняя деградация позвонков; при рецидивах/зависании — смещение, выпадение дисков", "Фаза восстановления (ПКЛ)": "Отёк — вытеснение ядра, протрузия; при Синдроме — грыжа (страх паралича запускает новый конфликт)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → разрастание кости, укрепление искривлённых позвонков, снижение подвижности, сколиоз (компенсаторно в противоположную сторону: правша, конфликт с матерью — некроз слева, искривление вправо)", "Медицинские диагнозы": "Протрузия, грыжа диска, остеохондроз, сколиоз, кифоз, лордоз", "Чувствительность": "", "Метафоры, выражения": "«Ситуация меня гнёт»; «жизнь давит»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вас гнёт? С кем (партнёр/мать/ребёнок) связано ощущение «я не могу»?", "Примеры из практики": "", "Подсказки, особенности": "Боль в суставах/позвоночнике (кроме надкостницы) означает, что конфликт разрешён и идёт восстановление; без обследования не важно, кость это, хрящ или связка — одна ткань и один конфликт", "Источник": "Урок 8 (PDF)"}, {"№": "131", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Поперечно-полосатая мускулатура — моторика (параличи, эпилепсия)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма (мышца); иннервация — моторная кора, чувствительность — сенсорная кора, трофика — паренхима", "Реле в мозге": "Моторная кора; латеральность (правша: правая сторона — партнёр, левая — мать/ребёнок)", "Конфликт (тематика)": "Двигательный конфликт: страх, блокирующий движение, невозможность совершить движение — «парализован от страха», «застыл от ужаса»; локально — конкретное действие мышцы: бицепс — невозможность обнять/удержать; трицепс — отстранить, оттолкнуть; ноги — нет выхода, невозможно уйти/убежать, не успеваю за кем-то. Внешняя сторона руки правши — оттолкнуть партнёра, внутренняя — притянуть", "Биологический смысл": "Притвориться мёртвым (мыши, косули) — хищник не трогает неподвижную жертву", "Активная фаза (СА)": "Снижение импульсов, нарастающий двигательный паралич (мышца, группа, конечность) — спастический паралич (рука прижата, согнута; нога разогнута, носок внутрь)", "Фаза восстановления (ПКЛ)": "Временный сильный паралич от отёка, неконтролируемые подёргивания, тики; затем восстановление", "Эпикриз": "Нескоординированные подёргивания, судороги — эпилептический приступ (при генерализованном конфликте — припадок, при локальном — локальный спазм); во время приступа человек делает движения, которые не мог сделать в активной фазе", "Зависание / рецидивы / синдром": "Зависание в СА — рассеянный склероз (по трактовке курса); зависание в ПКЛ (трофика + моторика не завершаются) — болезнь Паркинсона", "Медицинские диагнозы": "Параличи, парезы, эпилепсия, тики, судороги, рассеянный склероз, болезнь Паркинсона", "Чувствительность": "", "Метафоры, выражения": "«Застыл от ужаса»; «руки опускаются»; «не могу сбежать»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какое движение вы не смогли сделать (обнять, оттолкнуть, убежать, закрыться)? Где вы «застыли от ужаса»?", "Примеры из практики": "Мухаммед Али (Паркинсон) часто видел во сне проигранный бой 1971 г. с Джо Фрейзером: руки — «не могу закрыться от ударов», речь — территориальный страх, походка — невозможность уйти с ринга. Животное из приюта в новом доме получает эпиприступы — оно наконец «убежало»; курс советует покой, без препаратов; поездка к ветеринару, переноска, удержание могут перезапустить конфликт", "Подсказки, особенности": "Сам диагноз «эпилепсия» может запустить новые конфликты; по курсу, мнение, что при приступе гибнут клетки мозга, ошибочно. Фаза восстановления ≈ фазе конфликта", "Источник": "Урок 9 (PDF)"}, {"№": "132", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Поперечно-полосатая мускулатура — трофика (миастения, миалгия)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма (Люкс)", "Реле в мозге": "Паренхима", "Конфликт (тематика)": "Обрушение самооценки в отношении подвижности: невозможность убежать, отбиться, удержать; по локализации", "Биологический смысл": "Конец восстановления — мышца прочнее", "Активная фаза (СА)": "Атрофия, нарастающая слабость; зависание без перерывов — миастения (двоение, птоз, косоглазие, нарушение мимики, глотания, шаркающая походка, скованность, свисание головы); легче растяжения и разрывы", "Фаза восстановления (ПКЛ)": "Отёк — ещё слабее, воспаление, острая/тупая боль в покое и напряжении — миалгия; при Синдроме гиперотёк — «мышечная саркома» (сначала решать конфликт собирательных трубочек)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → соединительная ткань, рубцы — фиброз/миофиброз, постоянная боль, спонтанные разрывы", "Медицинские диагнозы": "Миастения, миалгия, саркома мышц, миофиброз, разрывы мышц", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы не смогли убежать, отбиться, удержать?", "Примеры из практики": "", "Подсказки, особенности": "Моторика и трофика обычно протекают синхронно; пациенты с параличом получают вторичный конфликт самооценки из-за невозможности двигаться", "Источник": "Урок 9 (PDF)"}, {"№": "133", "Система": "Опорно-двигательная", "Орган / часть / ткань": "Гладкая мускулатура — общее", "Зародышевый листок": "Гладкая мускулатура", "Ткань (подробно)": "Гладкая мускулатура", "Реле в мозге": "Средний мозг (переходная зона — частично как древние, частично как новая мезодерма)", "Конфликт (тематика)": "Связан с функцией органа: ЖКТ — невозможность продвинуть кусок (недостаточная перистальтика); матка — удержать плод, облегчить роды", "Биологический смысл": "«Если ты не справился, надо стать сильнее. Навсегда»", "Активная фаза (СА)": "Локальный рост клеток и усиление перистальтики, остальная часть органа останавливается", "Фаза восстановления (ПКЛ)": "Усиление всей перистальтики; ткань не распадается — её больше", "Эпикриз": "Колики и спазмы", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Колики, спазмы, миома, стенозы сфинктеров", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "~35 сфинктеров в ЖКТ; большинство — гладкие (непроизвольные)", "Источник": "Урок 9 (PDF)"}, {"№": "134", "Система": "Мочевыделительная", "Орган / часть / ткань": "Паренхима почки", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма, эмбриональная ткань (восстановление 9 месяцев)", "Реле в мозге": "Паренхима больших полушарий, БЕЗ перекреста (правое полушарие — правая почка)", "Конфликт (тематика)": "Конфликт, связанный с водой или жидкостью: утопление, затопление — «вода/жидкость опасна»", "Биологический смысл": "В конце восстановления: усилить фильтрацию и мочеобразование — легче справиться с избытком воды", "Активная фаза (СА)": "Некроз, снижение фильтрации; компенсаторная гипертензия (до конца программы) → утолщение почечной артерии («атеросклероз почечных артерий»)", "Фаза восстановления (ПКЛ)": "Из полостей — кисты с жидкостью, постепенно заполняются функциональной тканью, 9 месяцев; присоединяются к соседним тканям за кровоснабжением — «опухоль Вильмса»; после 9 мес. твёрдая функциональная — «нефробластома»; функция затем выше нормы. При Синдроме киста может лопнуть", "Эпикриз": "", "Зависание / рецидивы / синдром": "Интенсивная/длительная активная фаза, рецидивы → значительный некроз, соединительная ткань — «цирроз/сморщивание почки»", "Медицинские диагнозы": "Гипертония (почечная), нефросклероз, сморщенная почка, кисты почки, опухоль Вильмса, нефробластома", "Чувствительность": "", "Метафоры, выражения": "«Мы тонем!»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Был ли опыт, когда вода/жидкость была опасна (тонули, затопило)?", "Примеры из практики": "«Дневник Оливии» (Г. Пильхар): тётя в сдувающейся надувной лодке кричит «Помогите! Мы тонем!» — у девочки конфликт для почек", "Подсказки, особенности": "Автор курса: кисты категорически нельзя удалять до окончания 9 месяцев (риск повреждения почки, нет своего кровоснабжения)", "Источник": "Урок 23 (PDF)"}, {"№": "135", "Система": "Мочевыделительная", "Орган / часть / ткань": "Собирательные трубочки почек", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Конфликт существования: «у меня ничего нет», «всё потеряно»; беженца, брошенности, одиночества: «меня все бросили», «я один», «рыба, выброшенная на берег»; «госпитализации»: «я один, изолирован от родного дома»; беспомощности в решении своей проблемы", "Биологический смысл": "В активной фазе: удержать воду и мочевину — продлить жизнь без воды и пищи", "Активная фаза (СА)": "Рост ткани (одна/обе почки, одна или все трубочки); удержание воды и мочевины: сильная жажда, отёки, минимальное мочеиспускание, резкая прибавка веса (каждая почка до 10 л); «уремия» (не прогрессирующая недостаточность). Возможно расходящееся косоглазие (не обязательно). Обе почки — констелляция, дезориентация. Это и есть СИНДРОМ, если одновременно что-то восстанавливается", "Фаза восстановления (ПКЛ)": "Распад опухоли с грибками, восстановление мочеиспускания; моча с неприятным запахом и хлопьями", "Эпикриз": "Лихорадка, сильные боли в почках", "Зависание / рецидивы / синдром": "Рецидивы → больше минеральных остатков, отёки мешают выходу мелких камней → камни", "Медицинские диагнозы": "Олигурия, отёки, уремия, «острая почечная недостаточность», камни почек, подагра (при Синдроме)", "Чувствительность": "", "Метафоры, выражения": "«Рыба на берегу»; «я один»; «всё потеряно»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Чувствуете ли вы себя брошенным, одиноким, беженцем, потерявшим всё? Изолированы ли от дома (больница, переезд)? Беспомощны ли в решении проблемы?", "Примеры из практики": "Дирк Хамер: арест в Риме и ранение — два конфликта беженца, констелляция, олигурия", "Подсказки, особенности": "При удалении одной почки программа запускается в другой. Первым делом в терапи а)": "Где вы чувствуете сексуальную неудовлетворённость, «выбрали не меня»?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 24 (PDF)"}, {"№": "152", "Система": "Репродуктивная (женская)", "Орган / часть / ткань": "Маточные трубы", "Зародышевый листок": "Энтодерма + Гладкая мускулатура", "Ткань (подробно)": "Гладкая мускулатура + энтодермальная слизистая", "Реле в мозге": "Средний мозг / ствол", "Конфликт (тематика)": "Такие же, как для матки", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "Отёк (особенно при Синдроме) может перекрыть трубу — если конфликт разрешился в момент оплодотворения → внематочная беременность", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → соединительная ткань, спайки, плохая проходимость, внематочная беременность", "Медицинские диагнозы": "Непроходимость труб, внематочная беременность, сальпингит", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 24 (PDF); вопросы-ответы"}, {"№": "153", "Система": "Репродуктивная (женская)", "Орган / часть / ткань": "Яичники", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма, эмбриональная ткань (восстановление 9 месяцев)", "Реле в мозге": "Паренхима; латеральность (правша: левый — мать/ребёнок)", "Конфликт (тематика)": "Потеря, утрата или страх потери любимого человека (ребёнка, супруга, папы, мамы, животного) — смерть, уход, пропажа; обрушение самооценки и утрата («я недостаточно привлекательна», если муж ушёл к другой)", "Биологический смысл": "В конце восстановления (Люкс): дополнительная ткань — больше эстрогена, выше желание, моложе вид, больше шанс забеременеть, чтобы компенсировать потерю", "Активная фаза (СА)": "Безболезненный некроз, снижение эстрогена: нерегулярный/ановуляторный цикл, аменорея; при зависании/интенсивном — сморщивание («рак яичника»); у девочек — отсрочка менархе (норма ~12 лет)", "Фаза восстановления (ПКЛ)": "Отёк, воспаление — аднексит, сальпингоофорит; кисты 9 месяцев (без капсулы), потом своё кровоснабжение, функция выше — «поликистоз яичников». При Синдроме киста может разорваться при ударе, падении — клетки прирастают в брюшной полости — циклические схваткообразные боли", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Аменорея, рак яичника, аднексит, киста яичника, СПКЯ, эндометриоз (по описанию разрыва кисты)", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кого вы потеряли или боитесь потерять (смерть, уход, пропажа)? Как давно это разрешилось?", "Примеры из практики": "Женщина-правша 26 лет: узнаёт об измене матери отцу — шок, мать душевно отдаляется (конфликт потери); через 6 мес. роман закончился, дочь простила — началось восстановление → через 10 мес. на УЗИ киста левого яичника", "Подсказки, особенности": "Автор курса: кисты нельзя удалять до окончания 9 месяцев", "Источник": "Урок 24 (PDF); урок 2"}, {"№": "154", "Система": "Репродуктивная (женская)", "Орган / часть / ткань": "Жёлтое тело (тератома, дермоидная киста)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма — исключение: управляется из среднего мозга", "Реле в мозге": "Средний мозг", "Конфликт (тематика)": "Интенсивный конфликт утраты, потери потомства", "Биологический смысл": "В активной фазе: архаичная форма воспроизводства — рост «квази-эмбриона»", "Активная фаза (СА)": "Рост ткани — тератома/дермоидная киста (жир, кость, нервы, волосы, зубы, хрящ)", "Фаза восстановления (ПКЛ)": "Распад «эмбриона»", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Тератома яичника, дермоидная киста", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Потеряли ли вы ребёнка, беременность, потомство?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 24 (PDF)"}, {"№": "155", "Система": "Репродуктивная (женская)", "Орган / часть / ткань": "Беременность: выкидыш, преждевременные роды, конфликты плода", "Зародышевый листок": "", "Ткань (подробно)": "", "Реле в мозге": "", "Конфликт (тематика)": "Конфликты во время беременности могут прервать беременность. Плод переживает конфликты так же остро, как ребёнок; по практике — все активные конфликты мамы в беременность и даже за 9 мес. до зачатия. УЗИ (громко как поезд метро) может восприниматься плодом как атака. «Конфликт циркулярной пилы» — самый частый эмбриональный: пила/дрель имитирует рёв хищника → двигательные/сенсорные параличи, шизофренические констелляции у ребёнка", "Биологический смысл": "", "Активная фаза (СА)": "", "Фаза восстановления (ПКЛ)": "", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Угроза выкидыша, выкидыш, преждевременные роды, кисты почки у новорождённого", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что происходило с мамой во время беременности (шумы, испуги, УЗИ, конфликты)?", "Примеры из практики": "Хамер: акушерка на 5-м месяце мыла инструменты под шумной водой, рядом роженица истерично закричала — у плода водный конфликт + страх за территорию → схватки, кровотечения, угроза выкидыша при повторах; ушла в декрет в 6 мес. — рецидивы прекратились; у ребёнка при рождении киста левой почки, кашель, плохое зрение", "Подсказки, особенности": "С 4-го месяца беременности ваготония — конфликты смягчаются или переносятся на послеродовой период", "Источник": "Урок 24 (PDF); вопросы-ответы"}, {"№": "156", "Система": "Репродуктивная (мужская)", "Орган / часть / ткань": "Мошонка", "Зародышевый листок": "Старая мезодерма", "Ткань (подробно)": "Старая мезодерма", "Реле в мозге": "Мозжечок", "Конфликт (тематика)": "Атака на мошонку и яички — в прямом смысле (драка) или метафорично («Я щас тебе оторву..!»)", "Биологический смысл": "В а
