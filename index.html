тветы курса"}, {"№": "141", "Раздел": "Латеральность, территории, гормоны", "Тема": "Территория ребёнка", "Содержание": "До полового созревания, вне зависимости от пола, территория ребёнка — место/человек, который даёт безопасность и ресурсы. Если при правилах в доме у ребёнка появляются симптомы — возможен конфликт лишения/ограничения на его территории или конфликт «ребёнок должен быть каким-то»", "Источник": "Вопросы-ответы курса"}, {"№": "142", "Раздел": "Органы и частные вопросы", "Тема": "Шишки у суставов", "Содержание": "Гигрома, киста, ганглий, синовиальная грыжа, костная шишка, которые не беспокоят, — завершённая СБП. Блокировка пальцев с острой болью — скорее эпикриз моторной составляющей мышечно-сухожильного аппарата", "Источник": "Вопросы-ответы курса"}, {"№": "143", "Раздел": "Органы и частные вопросы", "Тема": "«Всё есть рак»", "Содержание": "Хамер имел в виду: любая СБП (кроме программ только с изменением функции) протекает с ростом или распадом ткани — тем, что медицина называет «раком». Для миелиновых оболочек своя СБП", "Источник": "Вопросы-ответы курса"}, {"№": "144", "Раздел": "Органы и частные вопросы", "Тема": "Мигрень и головная боль", "Содержание": "Одна из причин мигрени — СА фаза надкостницы черепа и эпикриз (Хамер, «Наследие», ч.1, 8.3.1). Аура — вероятно проявление фронтальной констелляции в коре. Головная боль — собирательный образ: отёк в голове, надкостница, напряжение мышц шеи и др. Константин: при запросе на головную боль ищи «второе дно» — задачу, которую решает тело", "Источник": "Вопросы-ответы курса"}, {"№": "145", "Раздел": "Опухоли, «метастазы», диагнозы", "Тема": "Опухоль груди при обращении", "Содержание": "Если женщина пришла с опухолью — она в рецидиве (диагноз = рецидивы). Фиброгландулярный комплекс = железистая + фиброзная (соединительная) ткань — рецидивирующий конфликт. После решения начнёт нарастать отёк, появятся симптомы восстановления (температура, образование и выход гноя). Без КТ понять, что конфликт решён, можно только по динамике: опухоль должна уменьшаться (до 2 лет)", "Источник": "Вопросы-ответы курса"}, {"№": "146", "Раздел": "Органы и частные вопросы", "Тема": "Зачем знать биологический смысл", "Содержание": "Понимать причины и логику, почему программа запускается в конкретном органе; знание убирает страх перед процессами — его можно донести клиенту и объяснить, что происходит и как процесс будет развиваться. Главный вопрос: какую задачу решает тело?", "Источник": "Вопросы-ответы курса"}, {"№": "147", "Раздел": "Органы и частные вопросы", "Тема": "Камни", "Содержание": "Камни (мочевой пузырь, протоки) образуются не вследствие зависания, а вследствие рецидивов", "Источник": "Вопросы-ответы курса"}, {"№": "148", "Раздел": "Органы и частные вопросы", "Тема": "Внутренний сфинктер мочевого пузыря", "Содержание": "В СА — спастический тонус: сфинктер напряжён и приоткрыт. В восстановлении — клонические сокращения (усиление перистальтики). В эпикриз — спастический паралич", "Источник": "Вопросы-ответы курса"}, {"№": "149", "Раздел": "Органы и частные вопросы", "Тема": "Бруксизм", "Содержание": "Бруксизм — непроизвольное сокращение жевательной мускулатуры; задать вопрос «в каких тканях идут процессы?» (мускулатура)", "Источник": "Вопросы-ответы курса"}, {"№": "150", "Раздел": "Органы и частные вопросы", "Тема": "Справочники", "Содержание": "Ведущая рекомендует только таблицы д-ра Хамера издательства Amici di Dirk; справочники Миронова и Матвеева не рекомендует. Атлас: Фрэнк Неттер «Атлас анатомии человека»", "Источник": "Вопросы-ответы курса"}, {"№": "151", "Раздел": "Ткани и схемы", "Тема": "Кора надпочечников", "Содержание": "Ткань группы Люкс: биологический смысл в конце фазы восстановления — повысить уровень гормонов", "Источник": "Вопросы-ответы курса"}, {"№": "152", "Раздел": "Органы и частные вопросы", "Тема": "Частые позывы у детей при малом количестве мочи", "Содержание": "Фаза восстановления для слизистой мочевого пузыря (в СА — снижение чувствительности)", "Источник": "Вопросы-ответы курса"}, {"№": "153", "Раздел": "Органы и частные вопросы", "Тема": "Сосок и млечные протоки", "Содержание": "Эктодерма; при зависании в конфликте — значительное изъязвление → втягивание груди/соска, диагноз «внутрипротоковая карцинома» (по факту язва)", "Источник": "Вопросы-ответы курса"}, {"№": "154", "Раздел": "Органы и частные вопросы", "Тема": "Маточные трубы", "Содержание": "Конфликты для маточных труб такие же, как для матки", "Источник": "Вопросы-ответы курса"}, {"№": "155", "Раздел": "Органы и частные вопросы", "Тема": "Синехии, фимоз", "Содержание": "Синехии у девочек закрывают вход во влагалище, как фимоз у мальчиков — оттенок конфликта запрета на размножение", "Источник": "Вопросы-ответы курса"}, {"№": "156", "Раздел": "Органы и частные вопросы", "Тема": "Половая сфера у детей", "Содержание": "По практике программа для половой сферы у мальчиков запускается при конфликте папы, у девочек — мамы. Тератома у мужчин до 20 лет — возможно запрет на секс и воспроизведение потомства", "Источник": "Вопросы-ответы курса"}, {"№": "157", "Раздел": "Органы и частные вопросы", "Тема": "Низкий рост у ребёнка (гипофиз)", "Содержание": "Отёк может не определяться на МРТ, конфликт может быть не решён. До 12 лет при разрешении ребёнок должен нагнать сверстников. Вопрос: «в каком аспекте ребёнок ощущает себя маленьким?», либо замещающий конфликт", "Источник": "Вопросы-ответы курса"}, {"№": "158", "Раздел": "Треки и рецидивы", "Тема": "Рецидив после разрешения", "Содержание": "Кроме рецидива возможен новый конфликт в той же зоне, если изменились условия", "Источник": "Вопросы-ответы курса"}, {"№": "159", "Раздел": "Органы и частные вопросы", "Тема": "Кровь и лимфа", "Содержание": "Кровь и лимфоидная ткань относятся к новой мезодерме", "Источник": "Вопросы-ответы курса"}], "tissues": [["Параметр", "Энтодерма (ствол мозга)", "Гладкая мускулатура (средний мозг)", "Старая мезодерма (мозжечок)", "Новая мезодерма (паренхима, белое вещество)", "Эктодерма (кора, серое вещество)"], ["Ткани / органы", "ЖКТ (слизистые желудка — большая кривизна, кишечника, 12-перстной кроме луковицы), печень, поджелудочная (паренхима), щитовидная и паращитовидные железы, альвеолы, бокаловидные клетки бронхов, подслизистая рта/носа/влагалища/мочевого пузыря, миндалины, слюнные и слёзные железы, среднее ухо, радужка, хориоидея, цилиарное тело, собирательные трубочки почек, аденогипофиз, эпифиз, эндометрий, предстательная железа, бартолиновы железы, мозговое вещество надпочечников", "Гладкая мускулатура кишечника, сосудов, матки (миометрий), бронхов; сфинктеры кардии, привратника, внутренние сфинктеры; жёлтое тело, зародышевые клетки (тератома); паренхима почек анатомически связана", "Дерма, плевра, перикард, брюшина, большой сальник, молочные железы, потовые и сальные (в т.ч. мейбомиевы) железы, оболочка нервов (шванновские клетки), мошонка", "Кости, хрящи, суставы, сухожилия, связки, мышцы (трофика), диски, лимфоузлы, селезёнка, кровь, сосуды (интима большинства), эндокард, миокард, клапаны, жировая и соединительная ткань, дентин, пульпа, пародонт, кора надпочечников; эмбриональные: паренхима почек, яичники, яички", "Эпидермис, волосы, ногти, слизистые рта, носа, гортани, бронхов, трахеи, верхних 2/3 пищевода, малой кривизны, луковицы 12-перстной, протоков (желчных, поджелудочной, слюнных, слёзных, щитовидной, млечных), мочевых путей, шейки матки, влагалища, прямой кишки; эмаль; коронарные сосуды; конъюнктива, роговица, хрусталик, сетчатка; улитка, вестибулярный аппарат; нервные клетки; надкостница; островковые клетки"], ["Тип конфликтов", "«Кусковые», абсолютные (жизнь/смерть): получить, проглотить, переварить, вывести кусок; удержание воды. Справа — получить, слева — избавиться", "По функции органа: продвинуть кусок, удержать плод, транспортировать кровь; тяжёлая утрата (жёлтое тело, тератома)", "Защита: атака на целостность, грязь, осквернённость, обезображенность; забота о гнезде (молочные железы)", "Обрушение самооценки: «сравнил себя и проиграл»; по локализации и действию, которое не удалось", "Территориальные, разделения, социальные, идентичности; страхи (фронтальный, сзади), отвращение, сопротивление"], ["Активная фаза (СА)", "Рост клеток (аденокарцинома), усиление функции, без боли; видно не раньше ~4 недель; параллельно растут грибки/микобактерии", "Локальный рост и усиление тонуса/перистальтики, остальная часть органа замедлена", "Рост клеток, усиление защиты, без боли; растут микобактерии; возможны холодные поты", "Некроз (остеолиз, дыры), снижение функции, обычно без симптомов; при зависании — переломы, разрывы", "Изъязвление/потеря клеток или только изменение функции; изменение чувствительности"], ["Где биологический смысл", "В активной фазе", "В активной фазе (ткань остаётся увеличенной)", "В активной фазе", "В конце фазы восстановления (ткани «Люкс» — больше и сильнее, чем было)", "В активной фазе (изменение чувствительности/просвета)"], ["Фаза восстановления (ПКЛ)", "Распад (туберкулёзный, казеозный) с грибками/микобактериями; ночные тёплые кислые поты; кровотечения, гной; без микробов — инкапсуляция; ткани становится чуть меньше, каверны, кисты", "Усиление перистальтики всего органа (колики); ткань не распадается", "Распад с микобактериями; выпоты (плевра, перикард, асцит); тёплые локальные гнилостные поты; ≤38,4°; без микробов — инкапсуляция", "Очень большой отёк за несколько дней, сильная пульсирующая/распирающая боль; бактерии (кокки); ≤39,5°; холодный пот, упадок сил; потом ткани больше (мозоль). Эмбриональные ткани — 9 месяцев роста кист", "Отёк очень быстро, воспаление, покраснение, температура (до 40+); зуд («наружная кожа»); вирусы «если существуют»"], ["Длительность эпикриза", "до 4 часов", "до 4 часов (колика, спазмы, боль)", "до 45 минут («внутренняя дрожь», всплеск функции — пот, сало, молоко)", "до 60 секунд", "до 20 секунд (чихание, кашель, внезапный зуд, абсанс, обморок)"], ["Боль", "Не болит (только если задеты соседние ткани)", "Не болит, кроме спазмов в эпикризе", "Не болит <script>
(function(){
"use strict";
const BUILTIN = JSON.parse(document.getElementById('gnm-data').textContent);

let DB = BUILTIN;
try{ const s = localStorage.getItem(LS_KEY); if(s){ DB = JSON.parse(s); } }catch(e){}

/* ---------- поля карточки ---------- */
const F = {
  num:'№', sys:'Система', organ:'Орган / часть / ткань', layer:'Зародышевый листок', tissue:'Ткань (подробно)',
  relay:'Реле в мозге', conflict:'Конфликт (тематика)', sense:'Биологический смысл', active:'Активная фаза (СА)',
  repair:'Фаза восстановления (ПКЛ)', epi:'Эпикриз', hang:'Зависание / рецидивы / синдром', dx:'Медицинские диагнозы',

  {k:'Старая мезодерма', c:'--oldm', bg:'--oldm-bg'},
  {k:'Новая мезодерма', c:'--newm', bg:'--newm-bg'},
  {k:'Гладкая мускулатура', c:'--smooth', bg:'--smooth-bg'},
  {k:'Эктодерма', c:'--ecto', bg:'--ecto-bg'}

function layerOf(s){ s=s||''; return LAYERS.find(l=>s.indexOf(l.k)===0) || null; }

/* ---------- поиск ---------- */
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/ё/g,'е'); }

function prep(){
  DB.organs.forEach(o=>{ o._n={}; for(const k in o){ if(k!=='_n') o._n[k]=norm(o[k]); } });
  (DB.principles||[]).forEach(p=>{ p._n={}; for(const k in p){ if(k!=='_n') p._n[k]=norm(p[k]); } });
}
prep();

function search(q){
  const terms = norm(q).split(/[\s,;.]+/).filter(t=>t.length>1).map(stem);
  if(!terms.length) return {terms, organs:[], principles:[]};
  const organs=[];
  for(const o of DB.organs){
    if(state.layer && !(o[F.layer]||'').includes(state.layer)) continue;
    let score=0, ok=true;
    for(const t of terms){
      let hit=0;
      for(const k in o._n){ if(k==='_n') continue; if(o._n[k].includes(t)) hit+= (WEIGHTS[k]||1); }
      if(!hit){ok=false;break;} score+=hit;
    }
    if(ok) organs.push({o,score});
  }
  organs.sort((a,b)=>b.score-a.score);
  const principles=[];
  if(!state.layer) for(const p of (DB.principles||[])){
    let ok=true, score=0;
    for(const t of terms){ let h=0; for(const k in p._n){ if(p._n[k].includes(t)) h+=(k==='Тема'?5:1);} if(!h){ok=false;break;} score+=h; }
    if(ok) principles.push({p,score});
  }
  principles.sort((a,b)=>b.score-a.score);

}

/* ---------- отрисовка ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(text, terms){
  let h=esc(text||'');
  if(!terms||!terms.length) return h;
  const src = norm(text||''); const marks=[];
  for(const t of terms){ let i=0; while((i=src.indexOf(t,i))>-1){ marks.push([i,i+t.length]); i+=t.length; } }
  if(!marks.length) return h;
  marks.sort((a,b)=>a[0]-b[0]);
  const merged=[]; for(const m of marks){ const l=merged[merged.length-1]; if(l&&m[0]<=l[1]) l[1]=Math.max(l[1],m[1]); else merged.push(m.slice()); }
  let out='',pos=0; const raw=text||'';
  for(const [a,b] of merged){ out+=esc(raw.slice(pos,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>'; pos=b; }
  return out+esc(raw.slice(pos));
}
function sec(title, val, terms, cls){
  if(!val || !String(val).trim()) return '';
  return `<div class="sec ${cls||''}"><h3>${esc(title)}</h3><p>${hl(val,terms)}</p></div>`;
}
function organCard(o, terms, open){
  const L = layerOf(o[F.layer]);
  const stripe = L ? `--stripe:var(${L.c});--layer-bg:var(${L.bg})` : '';

  let body = '';
  body += sec('Ткань', tissue, terms);
  body += sec('Реле в мозге', o[F.relay], terms);
  body += sec('Биологический конфликт', o[F.conflict], terms);
  body += sec('Метафоры, выражения', o[F.meta], terms);
  body += sec('Симптомы и диагнозы медицины', o[F.dx], terms);
  const ca = sec('Активная фаза (конфликт)', o[F.active], terms,'ca'), pcl = sec('Постконфликтная фаза (восстановление)', o[F.repair], terms,'pcl');
  if(ca||pcl) body += `<div class="phase">${ca}${pcl}</div>`;
  body += sec('Эпикриз', o[F.epi], terms);
  body += sec('Зависание, рецидивы, синдром', o[F.hang], terms);
  body += sec('Биологический смысл', o[F.sense], terms);
  body += sec('Чувствительность', o[F.sens], terms);
  body += sec('Вопросы клиенту (из курса)', o[F.qa], terms);
  body += sec('Вопросы клиенту (по теме конфликта)', o[F.qd], terms);
  body += sec('Примеры работы', o[F.cases], terms);
  body += sec('Подсказки', o[F.tips], terms);
  for(const k in o){ if(k==='_n'||KNOWN.has(k)) continue; body += sec(k, o[k], terms); }
  body += sec('Источник', o[F.src], terms);
  return `<article class="card ${open?'open':''}" style="${stripe}">
    <button class="head" aria-expanded="${open?'true':'false'}">
      <span class="kicker">${esc(o[F.sys]||'')}${L?`<span class="layer">${esc(o[F.layer])}</span>`:''}</span>
      <h2>${hl(o[F.organ],terms)}</h2>
      <span class="teaser">${hl(o[F.conflict]||'',terms)}</span>
    </button>
    <div class="body">${body}</div>
  </article>`;
}
function principleCard(p, terms, open){
  return `<article class="card ${open?'open':''}" style="--stripe:var(--accent)">
    <button class="head" aria-expanded="${open?'true':'false'}">
      <span class="kicker">Принцип · ${esc(p['Раздел']||'')}</span>
      <h2>${hl(p['Тема']||'',terms)}</h2>
      <span class="teaser">${hl(p['Содержание']||'',terms)}</span>
    </button>
    <div class="body">${sec('Содержание',p['Содержание'],terms)}${sec('Источник',p['Источник'],terms)}</div>
  </article>`;
}

const state = {q:'', layer:'', limit:40};
const $ = id=>document.getElementById(id);

function renderFilters(){
  const all = [{k:'',label:'Все'}].concat(LAYERS.map(l=>({k:l.k,label:l.k,c:l.c})));
  $('filters').innerHTML = all.map(x=>`<button class="chip" data-layer="${esc(x.k)}" aria-pressed="${state.layer===x.k}">${x.c?`<i style="background:var(${x.c})"></i>`:''}${esc(x.label)}</button>`).join('');
}
const EXAMPLES = ['желудок','щитовидная','зуд','кашель','территория','синдром','тератома','катаракта','псориаз','диабет','мигрень','цистит'];
function renderList(){
  const q = state.q.trim();

    const pool = state.layer ? DB.organs.filter(o=>(o[F.layer]||'').includes(state.layer)) : DB.organs;
    meta = state.layer ? `${pool.length} записей · ${state.layer}` : `В базе ${DB.organs.length} органов и тканей, ${(DB.principles||[]).length} принципов. Введите слово или выберите пример:`;
    if(!state.layer){
      html = `<div class="chips" style="flex-wrap:wrap">${EXAMPLES.map(e=>`<button class="chip" data-example="${e}">${e}</button>`).join('')}</div>`;
    } else {
      html = pool.slice(0,state.limit).map(o=>organCard(o,[],false)).join('');
      if(pool.length>state.limit) html+=`<button class="more" id="more">Показать ещё (${pool.length-state.limit})</button>`;
    }
  } else {
    const r = search(q);
    const n = r.organs.length + r.principles.length;
    meta = n ? `Найдено: органов и тканей — ${r.organs.length}, принципов — ${r.principles.length}` : '';
    const openAll = r.organs.length<=2;
    html = r.organs.slice(0,state.limit).map(o=>organCard(o,r.terms,openAll)).join('');
    if(r.organs.length>state.limit) html+=`<button class="more" id="more">Показать ещё (${r.organs.length-state.limit})</button>`;
    if(r.principles.length) html += `<div class="meta">Принципы и правила</div>` + r.principles.slice(0,15).map(p=>principleCard(p,r.terms,false)).join('');
    if(!n) html = `<div class="empty">По запросу <b>«${esc(q)}»</b> ничего нет. Попробуйте короче (например, «желуд») или другое слово.</div>`;
  }
  $('meta').textContent = meta;
  $('list').innerHTML = html;
}
function renderRef(){
  const rows = DB.tissues||[];
  let out='', table=null;
  const flush=()=>{ if(table){ out+=`<div class="tbl"><table>${table}</table></div>`; table=null; } };
  let headerNext=true;
  for(const r of rows){
    const cells = r.filter(c=>String(c).trim()!=='');
    if(!cells.length){ flush(); headerNext=true; continue; }
    if(cells.length===1 && !table){ out+=`<h2>${esc(cells[0])}</h2>`; headerNext=true; continue; }
    if(!table){ table=''; if(!out) out+=`<h2>Ткани и фазы</h2>`; }
    const tag = headerNext?'th':'td';
    table += '<tr>'+r.slice(0, r.length).map(c=>`<${tag}>${esc(c)}</${tag}>`).join('')+'</tr>';
    headerNext=false;
  }
  flush();
  $('ref').innerHTML = out;
}

/* ---------- события ---------- */
let t;
$('q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=e.target.value; state.limit=40; $('clear').hidden=!state.q; renderList(); },120); });
$('clear').addEventListener('click',()=>{ $('q').value=''; state.q=''; $('clear').hidden=true; renderList(); $('q').focus(); });
$('filters').addEventListener('click',e=>{ const b=e.target.closest('[data-layer]'); if(!b) return; state.layer=b.dataset.layer; state.limit=40; renderFilters(); renderList(); });

  $('tab-search').setAttribute('aria-pressed',!ref); $('tab-ref').setAttribute('aria-pressed',ref);
  $('view-search').hidden=ref; $('view-ref').hidden=!ref; $('searchbar').hidden=ref; $('filters').hidden=ref;

$('tab-ref').addEventListener('click',()=>showTab(true));

/* ---------- чтение .xlsx без библиотек ---------- */
async function inflate(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();

}
async function unzip(buf){

  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('Это не файл .xlsx');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={}; const td=new TextDecoder();
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true); const start=lho+30+lnl+lel;

  }
  return async name=>{ const f=files[name]; if(!f) return null; const d=f.method===8?await inflate(f.data):f.data; return td.decode(d); };
}
function xml(s){ return new DOMParser().parseFromString(s,'application/xml'); }
function colIdx(ref){ let n=0; for(const ch of ref.replace(/\d+/g,'')) n=n*26+(ch.charCodeAt(0)-64); return n-1; }

  const ssXml = await get('xl/sharedStrings.xml'); const ss=[];
  if(ssXml){ for(const si of xml(ssXml).getElementsByTagName('si')){ let t=''; for(const x of si.getElementsByTagName('t')) t+=x.textContent; ss.push(t); } }
  const sheets={};
  for(const s of wb.getElementsByTagName('sheet')){
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = relMap[rid]||''; target = target.replace(/^\/?xl\//,''); target = 'xl/'+target.replace(/^\//,'');
    const sx = await get(target); if(!sx) continue;
    const rows=[];
    for(const r of xml(sx).getElementsByTagName('row')){
      const row=[];
      for(const c of r.getElementsByTagName('c')){
        const t=c.getAttribute('t'); const v=c.getElementsByTagName('v')[0]; let val='';
        if(t==='s') val = v? (ss[+v.textContent]||'') : '';
        else if(t==='inlineStr'){ for(const x of c.getElementsByTagName('t')) val+=x.textContent; }
        else val = v? v.textContent : '';
        row[colIdx(c.getAttribute('r'))]=val;
      }
      rows.push(Array.from(row,x=>x==null?'':x));
    }
    sheets[s.getAttribute('name')]=rows;
  }
  return sheets;
}
function toObjects(rows){
  const h=(rows[0]||[]).map(x=>String(x).trim()); const out=[];
  for(const r of rows.slice(1)){ const o={}; let any=false; h.forEach((k,i)=>{ if(!k) return; const v=String(r[i]==null?'':r[i]); o[k]=v; if(v.trim()) any=true; }); if(any) out.push(o); }
  return out;
}
$('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return; const st=$('status'); st.textContent='Читаю файл…';
  try{
    const sheets = await readXlsx(await f.arrayBuffer());
    const orgName = Object.keys(sheets).find(n=>n.toLowerCase().includes('орган')) || Object.keys(sheets)[0];
    const organs = toObjects(sheets[orgName]);
    if(!organs.length || !(F.organ in organs[0])) throw new Error(`На листе «${orgName}» нет столбца «${F.organ}». Проверьте первую строку таблицы.`);
    const prName = Object.keys(sheets).find(n=>n.toLowerCase().includes('принцип'));
    const tiName = Object.keys(sheets).find(n=>n.toLowerCase().includes('ткани —')||n.toLowerCase().includes('схем'));
    DB = { organs, principles: prName?toObjects(sheets[prName]):(BUILTIN.principles||[]), tissues: tiName?sheets[tiName]:(BUILTIN.tissues||[]), version:'импорт '+new Date().toLocaleDateString('ru-RU') };
    try{ localStorage.setItem(LS_KEY, JSON.stringify(DB,(k,v)=>k==='_n'?undefined:v)); }catch(err){}
    prep(); renderList(); renderRef();
    st.textContent=`Готово: загружено ${organs.length} органов и тканей${prName?`, ${DB.principles.length} принципов`:''}.`;
  }catch(err){ st.textContent='Не получилось прочитать файл: '+err.message; }
  e.target.value='';
});
$('reset').addEventListener('click',()=>{ try{ localStorage.removeItem(LS_KEY); }catch(e){} DB=BUILTIN; prep(); renderList(); renderRef(); $('status').textContent='Вернула исходную базу ('+DB.organs.length+' записей).'; });

renderFilters(); renderList();
if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
