<style>
/* Layout: одна колонка-справочник. Липкая строка поиска сверху, под ней карточки органов; цвет полосы = зародышевый листок */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18211f; --muted:#5d6966; --line:#d9dfdd;
  --accent:#1f6f66; --accent-ink:#ffffff; --mark:#ffe08a;
  --endo:#f2c94c; --endo-bg:#fff6d6; --oldm:#e8964a; --oldm-bg:#fde9d6;
  --newm:#9b7fd1; --newm-bg:#efe8fa; --smooth:#5fae6a; --smooth-bg:#e3f3e5;
  --ecto:#e06b6b; --ecto-bg:#fbe2e2;
  --f-body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Unbounded","Golos Text",-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e6eeeb; --muted:#9aa8a4; --line:#2c3835;
  --accent:#5cc2b4; --accent-ink:#0d1513; --mark:#7a5d10;
  --endo-bg:#3a3214; --oldm-bg:#3d2816; --newm-bg:#2c2440; --smooth-bg:#1d3321; --ecto-bg:#3d1f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e6eeeb; --muted:#9aa8a4; --line:#2c3835;
  --accent:#5cc2b4; --accent-ink:#0d1513; --mark:#7a5d10;
  --endo-bg:#3a3214; --oldm-bg:#3d2816; --newm-bg:#2c2440; --smooth-bg:#1d3321; --ecto-bg:#3d1f1f; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:400 17px var(--f-body);padding:12px 40px 12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:22px;width:34px;height:34px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);padding-block:10px 4px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;border-left:6px solid var(--stripe,var(--line))}
.card>button.head{all:unset;box-sizing:border-box;display:grid;gap:4px;width:100%;padding:12px 14px;cursor:pointer}
.card>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.layer{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--layer-bg,var(--bg));color:var(--ink);text-transform:none;letter-spacing:0}
.card h2{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.teaser{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .teaser{display:none}
.body{display:none;padding:0 14px 14px;gap:0}
.card.open .body{display:grid}
.sec{padding-block:10px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 3px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.phase{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.phase .sec{border:0;padding:10px;border-radius:10px}
.phase .ca{background:color-mix(in srgb,var(--ecto) 10%,var(--surface))}
.phase .pcl{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
@media (max-width:560px){.phase{grid-template-columns:1fr}}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.more{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:10px 0}
.empty{padding:28px 4px;color:var(--muted)}
.empty b{color:var(--ink)}
.ref h2{font-family:var(--f-display);font-size:17px;margin:22px 0 8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:720px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.tbl th{position:sticky;top:0;background:var(--surface);font-weight:600}
.tbl td:first-child{font-weight:600;min-width:130px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-top:22px}
.panel h2{margin:0}
.btn{font:600 15px var(--f-body);border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.small{font-size:13px;color:var(--muted)}
.status{font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}.card.open{box-shadow:0 4px 18px rgba(0,0,0,.06)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Справочник <span>ГНМ</span></h1>

  <main id="view-search">

  <main id="view-ref" class="ref" hidden>

      <div class="row">
        <label class="btn" for="file">Выбрать файл .xlsx</label>
        <input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
        <button class="btn ghost" id="reset">Вернуть исходную базу</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>
</div>

кий смысл": "Конец восстановления (Люкс)", "Активная фаза (СА)": "Некроз, остеолиз", "Фаза восстановления (ПКЛ)": "Восстановление, рекальцификация; с каждым прогоном больше ткани → окостенение и фиксация ножки стремени", "Эпикриз": "", "Зависание / рецидивы / синдром": "Прогрессирующая тугоухость", "Медицинские диагнозы": "Отосклероз, тугоухость", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 17 (PDF)"}, {"№": "25", "Система": "ЛОР", "Орган / часть / ткань": "Вестибулярный аппарат", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма; без изъязвления/роста", "Реле в мозге": "Кора головного мозга", "Конфликт (тематика)": "Страх падения в прямом и переносном смысле, потеря равновесия, утрата баланса: «почва уходит из-под ног», «выброшен за борт»", "Биологический смысл": "", "Активная фаза (СА)": "Головокружение, тенденция к падению (правое ухо — тянет вправо, левое — влево)", "Фаза восстановления (ПКЛ)": "Головокружение исчезает", "Эпикриз": "Внезапный приступ головокружения, тошнота, рвота", "Зависание / рецидивы / синдром": "Констелляция (оба уха) → шаткая походка с широко расставленными ногами, атаксия (не слабость, а двойное головокружение)", "Медицинские диагнозы": "Головокружение, вестибулярные нарушения, атаксия", "Чувствительность": "", "Метафоры, выражения": "«Почва уходит из-под ног»; «выброшен за борт»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы потеряли опору, баланс? Чего боитесь — «упасть»?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 17 (PDF)"}, {"№": "26", "Система": "Пищеварительная", "Орган / часть / ткань": "Толстая кишка (по Хамеру)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга (латеральность роли не играет)", "Конфликт (тематика)": "Безобразный, неприятный, неперевариваемый конфликт «куска» (сегодня: машина, дом, наследство, неудачный бизнес, проигранный суд, работа)", "Биологический смысл": "В активной фазе: опухоль «выше по течению» вырабатывает много пищеварительного сока и растворяет застрявший кусок («как кубик льда в тёплой воде»)", "Активная фаза (СА)": "Компактная аденокарцинома по типу цветной капусты (или резорбтивного типа — всасывающая), растёт пока длится конфликт; параллельно размножаются микобактерии", "Фаза восстановления (ПКЛ)": "Туберкулёзно-казеозный распад опухоли микобактериями/грибками с периодическим кровотечением; через 3–4 месяца — рубцы. Без микобактерий опухоль остаётся", "Эпикриз": "", "Зависание / рецидивы / синдром": "Частые рецидивы с туберкулёзным заживлением = язвенный колит", "Медицинские диагнозы": "Рак толстой кишки, язвенный колит (фаза заживления карциномы резорбтивного типа: диарея, кровь в стуле, фрагменты слизистой, ночные поты, усталость при хорошем аппетите)", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Неперевариваемый кусок»; «безобразная проблема»", "Вопросы (из курса)": "Найти конфликтное событие (DHS), точный момент и типичное содержание конфликта", "Вопросы (по теме конфликта)": "Какая безобразная, неприятная ситуация, которую вы не можете «переварить»? Что вы уже «проглотили», а оно оказалось неперевариваемым (сделка, дом, наследство)?", "Примеры из практики": "Животное проглотило кусок с костью, кость застряла поперёк кишечника — колика = DHS. Мужчина «выиграл» в лотерею 30 000 марок и пригласил всех, а оказалось, что номер переписали — карцинома нёба. Купил дом, а договор недействителен — неперевариваемый конфликт", "Подсказки, особенности": "По Хамеру «метастазы» — новые вторичные раки от новых (часто ятрогенных) конфликтов: при объявлении о необходимости операции — конфликт атаки на брюшную полость (мезотелиома брюшины; после операции асцит как фаза восстановления) и страх голода (солитарный очаг печени справа дорсально). Терапия язвенного колита — распознать конфликт, чтобы избежать повторения", "Источник": "Хамер, germanische-neue-medizin.de/sonderprogramme/darmkrebs (PDF уроки 10–13, 9–13)"}, {"№": "27", "Система": "Пищеварительная", "Орган / часть / ткань": "Сигмовидная кишка (по Хамеру)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Уродливый, злостный, «дерьмовый» конфликт", "Биологический смысл": "Как толстая кишка", "Активная фаза (СА)": "Аденокарцинома", "Фаза восстановления (ПКЛ)": "Казеозный распад, кровотечение", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Рак сигмовидной кишки", "Чувствительность": "", "Метафоры, выражения": "«Дерьмовая ситуация»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какая подлая, «дерьмовая» ситуация, от которой вы не можете избавиться?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Хамер (PDF уроки 10–13)"}, {"№": "28", "Система": "Пищеварительная", "Орган / часть / ткань": "Прямая кишка — подслизистый слой (энтодерма) (по Хамеру)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Безобразный, подлый, мерзкий, «дерьмовый» конфликт", "Биологический смысл": "Как толстая кишка", "Активная фаза (СА)": "Компактная плоская опухоль под слизистой (ощутима, но не видна)", "Фаза восстановления (ПКЛ)": "Казеозный некротизирующий распад → подслизистый абсцесс", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Подслизистый абсцесс, «геморрой», параанальный абсцесс", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какая подлость, мерзость произошла, которую вы не можете «вывести»?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Хамер (PDF уроки 10–13)"}, {"№": "29", "Система": "Пищеварительная", "Орган / часть / ткань": "Прямая кишка — слизистая (плоский эпителий) (по Хамеру)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Кора головного мозга; латеральность (тест хлопка), гормональный статус (менопауза, контрацептивы) очень важны. У левшей вместо язвы прямой кишки — язва желудка или желчного пузыря", "Конфликт (тематика)": "(в источнике — конфликт идентичности; содержание зависит от латеральности)", "Биологический смысл": "", "Активная фаза (СА)": "Язвы без кровотечения, спазмов и боли", "Фаза восстановления (ПКЛ)": "Заполнение новыми клетками с отёком = геморрой с кровотечением, гиперчувствительностью, болью; мышечные спазмы из-за боли; особенно сильно при Синдроме", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Геморрой, «карцинома прямой кишки» (изъязвление)", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "Тест хлопка: у правши при хлопке сверху правая рука, у левши — левая", "Источник": "Хамер (PDF уроки 10–13)"}, {"№": "30", "Система": "Пищеварительная", "Орган / часть / ткань": "Тонкая кишка — тощая и подвздошная (по Хамеру)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Скрытый конфликт «неспособности переварить кусок» (неперевариваемый гнев), обычно с дополнительным аспектом угрозы голода", "Биологический смысл": "Как толстая кишка", "Активная фаза (СА)": "Аденокарцинома", "Фаза восстановления (ПКЛ)": "Распад; кровоточащие фрагменты слизистой и слизь в стуле", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Рак тонкой кишки; болезнь Крона (стадия заживления рака подвздошной кишки)", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вызвало у вас гнев, который нельзя «переварить»? Есть ли угроза остаться без средств?", "Примеры из практики": "", "Подсказки, особенности": "Многие раки кишечника находят только в фазе заживления (кровотечение) — врачи принимают симптомы восстановления за симптомы рака", "Источник": "Хамер (PDF уроки 10–13)"}, {"№": "31", "Система": "Пищеварительная", "Орган / часть / ткань": "Пищевод — верхние 2/3 (плоский эпителий слизистой)", "Зародышевый листок": "Энтодерма + Эктодерма", "Ткань (подробно)": "Эктодерма (красная, новая ткань); поверх исходной энтодермы, в средней трети остаточные островки кишечной слизистой", "Реле в мозге": "Кора головного мозга (территориальные зоны); учитывать латеральность, гормональный статус, правила весов", "Конфликт (тематика)": "Нежелание глотать кусок / желание выплюнуть; сопротивление происходящему. Территориальные конфликты и конфликты разделения (неопредмеченные)", "Биологический смысл": "", "Активная фаза (СА)": "Изъязвление, некротизирование плоского эпителия; боль, гиперчувствительность (чувствительная зона). Из-за толстого слоя эпителия глубокие язвы диагностируются нескоро", "Фаза восстановления (ПКЛ)": "Отёк, воспаление (эзофагит)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Постоянные рецидивы + зависание в фазе восстановления → разрастание ткани и отёк → сужение просвета, стеноз, непроходимость пищевода", "Медицинские диагнозы": "Язва пищевода, эзофагит, стеноз/непроходимость пищевода (стеноз верхних 2/3 = зависание в восстановлении)", "Чувствительность": "Чувствительна: горячий кусок ощущается вверху и «пропадает» внизу", "Метафоры, выражения": "«Хочу выплюнуть», «не хочу это глотать»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вам пришлось «проглотить» против воли? От чего хотелось отказаться/выплюнуть? Где вы сопротивлялись происходящему?", "Примеры из практики": "", "Подсказки, особенности": "Внешняя компрессия (травма, отёки грудной клетки) не биологична и в ГНМ не рассматривается. Важно где зона поражения и как проявляется симптом", "Источник": "Урок 11 (docx)"}, {"№": "32", "Система": "Пищеварительная", "Орган / часть / ткань": "Пищевод — нижняя 1/3 (слизистая)", "Зародышевый листок": "Энтодерма + Гладкая мускулатура", "Ткань (подробно)": "Энтодерма (жёлтая, древняя ткань); гладкая мускулатура", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Кусковой конфликт, опредмеченный: невозможность проглотить конкретный кусок (очень хочется получить — внезапно невозможно) либо необходимость проглотить опасный кусок, который хочется выплюнуть", "Биологический смысл": "В активной фазе (рост ткани → лучше протолкнуть/переварить кусок)", "Активная фаза (СА)": "Рост ткани, аденокарцинома; бессимптомно (нет чувствительности)", "Фаза восстановления (ПКЛ)": "Отёк, воспаление (эзофагит); туберкулёзный распад", "Эпикриз": "", "Зависание / рецидивы / синдром": "Зависание в активной фазе → рост ткани, опухоль → сужение просвета; отёк в начале восстановления может временно закупорить просвет (особенно при синдроме)", "Медицинские диагнозы": "Аденокарцинома пищевода, эзофагит, стеноз/непроходимость", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Кусок, который не могу проглотить»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какой конкретный «кусок» (сделка, вещь, человек, возможность) вы хотели получить и внезапно не смогли? Что пришлось взять, хотя это опасно?", "Примеры из практики": "", "Подсказки, особенности": "Перистальтика нижней трети синхронизирована с кардиальным сфинктером → при отёке/сужении внизу проверять кардию", "Источник": "Урок 11 (docx)"}, {"№": "33", "Система": "Пищеварительная", "Орган / часть / ткань": "Желудок — большая кривизна, дно, тело (слизистая, железы)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (жёлтая, древняя)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Конкретная невозможность переварить кусок (кусок стал слишком большим); внутрисемейные/внутристайные неприятности: неразделённое наследство, общее имущество — невозможно отделить и переварить свою долю; непоступление денег, на которые имеешь право; судебные процессы («кусок есть, а наложить лапу не могу»). «Застрявший кусок»: всё шло по плану — и вдруг затык", "Биологический смысл": "В активной фазе: рост клеток → больше желудочного сока, соляной кислоты, слизи → быстрее переварить застрявший кусок", "Активная фаза (СА)": "Рост клеток, аденокарцинома (по типу цветной капусты — разрастающаяся, или резорптивная — плоская); бессимптомно. Большая рыхлая опухоль может заполнять желудок → нарушение аппетита, похудание (полный желудок отключает рецепторы голода)", "Фаза восстановления (ПКЛ)": "Туберкулёзный распад с небольшими кровотечениями; отёк → снижение выработки сока → брожение, газы, метеоризм", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы и зависание в восстановлении → уменьшение функциональной ткани, замещение соединительной → застой пищи, плохой аппетит, отрыжка, распирание, вздутие, тупая боль после еды, тяжесть", "Медицинские диагнозы": "Аденокарцинома желудка, атрофический гастрит", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Не могу переварить свою долю», «кусок застрял», «шкура неубитого медведя»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что в семье/внутри «стаи» вы не можете переварить? Есть ли неразделённое наследство, общее имущество, деньги, которые вам должны, суды? Где «всё шло по плану, и вдруг затык»?", "Примеры из практики": "Хамер: опухоль желудка может быть размером с голову ребёнка. Из практики автора: вскрывали, видели рыхлую ткань, зашивали — люди (уже в восстановлении) жили годами", "Подсказки, особенности": "Психологи часто объединяют всё в «не могу переварить», но у малой и большой кривизны разные ткани и разные конфликты. Париетальные клетки дна/тела вырабатывают HCl и фактор Касла (усвоение B12 → кроветворение) — нарушения желудка связывают с нарушением кроветворения", "Источник": "Урок 11 (docx)"}, {"№": "34", "Система": "Пищеварительная", "Орган / часть / ткань": "Желудок — малая кривизна, привратник, луковица (плоский эпителий)", "Зародышевый листок": "Энтодерма + Эктодерма", "Ткань (подробно)": "Эктодерма (красная, новая) поверх энтодермы", "Реле в мозге": "Кора головного мозга (территориальные зоны); латеральность, гормональный статус, правила весов", "Конфликт (тематика)": "Территориальный гнев; конфликты за свою территорию, чаще с агрессией. Конкретное содержание зависит от латеральности и гормонального статуса", "Биологический смысл": "В активной фазе: изъязвление расширяет просвет (лучше проходимость), сильная боль заставляет отказаться от еды — «ты на войне, с полным желудком воевать тяжело»", "Активная фаза (СА)": "Изъязвление плоского эпителия, сильные боли (схема «глотка-слизистая»), изжога, тошнота (подключается кардия и нижняя треть пищевода). Боль сильнее лёжа на правом боку, меньше на левом (если желудок не переполнен)", "Фаза восстановления (ПКЛ)": "Воспаление, кровотечение из язв, сильные боли (заживающая эктодерма болит)", "Эпикриз": "Желудочные колики; затем постепенное заживление и уменьшение симптомов гастрита", "Зависание / рецидивы / синдром": "Зависание в активной фазе и рецидивы → чрезмерное изъязвление до перфорации (прободная язва: внезапная резкая боль, напряжение мышц живота, перитонит — нужна экстренная хирургия)", "Медицинские диагнозы": "Язва желудка, гастрит, прободная язва", "Чувствительность": "Схема «глотка-слизистая»: боль и гиперчувствительность в активной фазе", "Метафоры, выражения": "«На войне не едят»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "На кого вы злитесь за вторжение на свою территорию? С кем вы сейчас «воюете»? Кто нарушает ваши границы?", "Примеры из практики": "Знакомая с болями в животе без диагноза: разрешили конфликт с партнёром → врач позже обнаружил заживающую язву, о которой она не знала", "Подсказки, особенности": "Диагностическая подсказка: правый бок — боль сильнее, левый — слабее. Зависание и рецидивы сами по себе не биологичны — чем раньше решён конфликт, тем лучше. Человек, в отличие от животного, переживает воображаемую опасность", "Источник": "Урок 11 (docx)"}, {"№": "35", "Система": "Пищеварительная", "Орган / часть / ткань": "Кардиальный сфинктер (кардия)", "Зародышевый листок": "Гладкая мускулатура", "Ткань (подробно)": "Гладкая круговая мускулатура", "Реле в мозге": "Средний мозг (верхняя часть ствола мозга)", "Конфликт (тематика)": "Невозможно избавиться от плохого или невозможно усвоить хороший, уже проглоченный кусок", "Биологический смысл": "", "Активная фаза (СА)": "Сфинктер открывается (открывается в симпатикотонии) → заброс содержимого желудка в пищевод → изжога. Изжога = активная фаза, не восстановление", "Фаза восстановления (ПКЛ)": "Восстановление работы мышцы", "Эпикриз": "Приступообразный спазм желудка/пищевода, «перехватывание», тяжесть или резкое кратковременное напряжение чуть выше желудка", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Рефлюкс, изжога", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "От чего плохого (уже «проглоченного») вы не можете избавиться? Что хорошее, уже полученное, не получается усвоить?", "Примеры из практики": "", "Подсказки, особенности": "В норме кардия закрыта, открывается при перистальтической волне нижней трети пищевода", "Источник": "Урок 11 (docx)"}, {"№": "36", "Система": "Пищеварительная", "Орган / часть / ткань": "Пилорический сфинктер (привратник, пилорус)", "Зародышевый листок": "Гладкая мускулатура", "Ткань (подробно)": "Гладкая мускулатура (утолщение ~2–2,5 см); подчиняется законам желудка", "Реле в мозге": "Средний мозг (гладкая мускулатура)", "Конфликт (тематика)": "(как часть желудка — кусковой конфликт, невозможность продвинуть кусок дальше)", "Биологический смысл": "", "Активная фаза (СА)": "Рост мышечной ткани (гладкая мускулатура в активной фазе растёт и после разрешения остаётся увеличенной, не некротизируется)", "Фаза восстановления (ПКЛ)": "Ткань остаётся увеличенной", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы и долгие конфликты → утолщение стенки сфинктера → стеноз, застой пищи даже при обычном количестве еды", "Медицинские диагнозы": "Стеноз привратника", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что «застряло» и не продвигается дальше? Как долго длится эта ситуация?", "Примеры из практики": "", "Подсказки, особенности": "В покое привратник слегка приоткрыт — вода комнатной температуры свободно проходит в 12-перстную кишку; горячая задерживается в желудке. Каждый прогон программы усиливает сфинктер", "Источник": "Урок 11 (docx)"}, {"№": "37", "Система": "Пищеварительная", "Орган / часть / ткань": "Поджелудочная железа — паренхима (экзокринная часть)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (жёлтая, древняя)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Кусковой конфликт гнева, борьба за кусок, невозможность чем-то воспользоваться; наследство, имущество; часто с членами семьи. «Я получил меньше, чем рассчитывал, и мне нужно из меньшего извлечь максимум» (в отличие от печени: «извлечь пользу из чего попало»)", "Биологический смысл": "В активной фазе: рост органа → больше панкреатического сока → лучше усвоить то, что есть", "Активная фаза (СА)": "Рост клеток, аденокарцинома, усиление функции; бессимптомно, если нет сдавления/перекрытия протоков", "Фаза восстановления (ПКЛ)": "Туберкулёзный распад; ночные кислые тёплые поты (вплоть до смены белья); могут оставаться полости, каверны, кисты", "Эпикриз": "Сильная боль разной интенсивности", "Зависание / рецидивы / синдром": "Рецидивы и зависание в восстановлении → уменьшение функциональной ткани → недостаточность сока → метеоризм, диарея. Полости увеличиваются с каждым прогоном («воздушный шарик») и при конфликте собирательных трубочек почек заполняются жидкостью → кисты. Кисты >5 см: боль, сдавление солнечного сплетения (жгучая боль в спину), механическая желтуха (головка), отёки ног (воротная вена), задержка мочи, кишечная непроходимость", "Медицинские диагнозы": "Аденокарцинома поджелудочной железы, рак (в обеих фазах), кисты, недостаточность", "Чувствительность": "Нечувствительна; боль при восстановлении из-за неудачного расположения (пережатие, отёк, распирание)", "Метафоры, выражения": "«Шкура неубитого медведя»; «рассчитывал на большее — получил меньшее»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "На что вы рассчитывали (наследство, имущество, доля), а получили меньше? С кем из семьи идёт борьба за кусок?", "Примеры из практики": "Хамер: мужчина 8 лет жил отдельно от жены, подал на развод и получил письмо от адвоката с двумя неожиданными требованиями (неожиданность, драматичность) → холодные руки-ноги, пропал аппетит; осознав и выполнив условия, пережил рак и восстановился", "Подсказки, особенности": "Для желудка, поджелудочной, 12-перстной кишки в первую очередь искать конфликты внутри семьи/стаи. Распад древних тканей всегда сопровождают ночные поты. Кисты паренхиматозных органов (печень, поджелудочная, щитовидная)", "Источник": "Урок 11 (docx)"}, {"№": "38", "Система": "Пищеварительная", "Орган / часть / ткань": "Поджелудочная железа — протоки", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (красная)", "Реле в мозге": "Кора головного мозга; реле может быть с противоположной стороны; латеральность, гормональный статус, правила весов", "Конфликт (тематика)": "Территориальная злость или конфликт идентичности (по латеральности); часто с членами семьи, нарушение границ, имущественные (у Хамера — денежные) конфликты: рассчитываю на что-то и не могу получить или получаю меньше", "Биологический смысл": "В активной фазе: расширение протоков → больше сока в 12-перстную кишку", "Активная фаза (СА)": "Изъязвление протоков, боль, гиперчувствительность (схема «глотка-слизистая»)", "Фаза восстановления (ПКЛ)": "Отёк, воспаление — панкреатит; гипочувствительность; временное перекрытие протока (при лизистая»", "Метафоры, выражения": "«С пустым желудком воевать легче»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто вторгается на вашу территорию? На кого вы злитесь? Где задета ваша идентичность/место?", "Примеры из практики": "", "Подсказки, особенности": "Бульбит + гастрит вместе — одно реле, один тип конфликта", "Источник": "Урок 12 (docx)"}, {"№": "40", "Система": "Пищеварительная", "Орган / часть / ткань": "12-перстная кишка — остальная часть (кроме луковицы)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (жёлтая, древняя)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Невозможность переварить кусок (он слишком большой, не справляюсь); неприятности с членами семьи, коллегами, друзьями с «кусковым» оттенком", "Биологический смысл": "В активной фазе: рост ткани → больше слизи и пищеварительного сока → переварить застрявший кусок", "Активная фаза (СА)": "Бессимптомный рост аденокарциномы (экзофитная — растущая в просвет); пищеварение может даже улучшиться", "Фаза восстановления (ПКЛ)": "Распад (туберкулёзный), ночные кислые поты", "Эпикриз": "Сильная боль, кровотечение, чёрный кал", "Зависание / рецидивы / синдром": "Рецидивы, зависание в активной фазе → разрастание, полипы, закупорка просвета", "Медицинские диагнозы": "Экзофитная опухоль/аденокарцинома 12-перстной кишки, полипы", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Кусок не по зубам»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вам пришлось «переваривать» против воли? Какая ситуация с близкими/коллегами оказалась вам не по силам?", "Примеры из практики": "Женщина в долгожданном отпуске вынуждена круглосуточно ухаживать за больной матерью — не может насладиться отпуском", "Подсказки, особенности": "12-перстная регулирует выделение желчи и панкреатического сока; в тонком кишечнике пищеварение ферментативное, в толстом — бактериальное", "Источник": "Урок 12 (docx)"}, {"№": "41", "Система": "Пищеварительная", "Орган / часть / ткань": "Печень — паренхима (гепатоциты)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (жёлтая, древняя), цилиндрический кишечный эпителий", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Экзистенциальный конфликт голода: страх умереть с голоду / получить недостаточно еды (потеря работы, источника дохода; «нет работы — нет еды»). Отличие от поджелудочной: «пищи нет, и надо перерабатывать то, что обычно не ешь» (кору, ремень, подошву). Единичный очаг — замещающий конфликт (страх, что голодать будет другой: ребёнок, мать, брат); множественные очаги — страх за себя", "Биологический смысл": "В активной фазе: рост органа → больше ферментов и желчи → лучше усвоить скудную пищу", "Активная фаза (СА)": "Рост паренхимы, бессимптомно; редко сдавление крупного желчного протока → желтуха. Пропорционально растут микобактерии (палочка Коха)", "Фаза восстановления (ПКЛ)": "Туберкулёзный распад выросшей ткани, очень обильные ночные поты. Без микобактерий/грибков — инкапсуляция (безвредна, но может вызвать ятрогенный страх)", "Эпикриз": "Озноб, сильная боль в печени (расширение, напряжение)", "Зависание / рецидивы / синдром": "Рецидивы → соединительнотканная капсула с гноем («абсцесс»); полости при каждом прогоне → кисты/поликистоз (резервуары воды при синдроме); замещение функциональной ткани → фиброз → цирроз", "Медицинские диагнозы": "Рак печени (первичный/вторичный), кисты, поликистоз, абсцесс, фиброз, цирроз", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Сидит в печёнках»; «съесть ремень, опилки, подошву»; блокадный Ленинград", "Вопросы (из курса)": "«Какая реальная опасность тебя преследовала?» (для приехавших из зон конфликта)", "Вопросы (по теме конфликта)": "Боитесь ли вы остаться без средств к существованию, без работы, без еды? За кого вы боитесь, что он будет голодать? Что вам сказали врачи о прогнозе (ятрогенный страх)?", "Примеры из практики": "Младенцу 4,5 мес. после 3 недель антибиотиков предложили трансплантацию печени — автор: дайте ребёнку восстановиться. В бедных странах рак печени чаще (реальный страх голода); в Европе чаще вторичный/ятрогенный (после диагноза «рак желудка» — «не смогу есть»); при дефиците/политических кризисах в 35 раз чаще", "Подсказки, особенности": "Единичный очаг = за другого, множественные = за себя (признак применим и к лёгким, бронхам). Печень регенерирует даже при утрате >2/3 ткани. У детей печень непропорционально большая — увеличение не пугаться. Многие находки на МРТ — уже завершённые процессы (гипердиагностика). Цирроз у непьющих — вопросы выживания", "Источник": "Урок 12 (docx)"}, {"№": "42", "Система": "Пищеварительная", "Орган / часть / ткань": "Печень — желчные протоки (внутри- и внепечёночные)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (красная), плоский эпителий", "Реле в мозге": "Кора головного мозга, территориальные зоны", "Конфликт (тематика)": "Территориальный гнев: «вступил в борьбу на территории за выживание, ресурсов мало, надо извлечь максимум»; злость из-за нарушения границ; с родными или коллегами; часто деньги («есть деньги — есть еда»). Эмоция — сильный гнев, агрессия", "Биологический смысл": "В активной фазе: изъязвление расширяет просвет → лучше отток желчи", "Активная фаза (СА)": "Изъязвление, острая/резко схватывающая боль, гиперчувствительность", "Фаза восстановления (ПКЛ)": "Отёк → окклюзия протоков → нарушение оттока желчи; при большом количестве затронутых протоков — желтуха (желтуха = отёк в фазе восстановления протоков, конфликт уже решён). При синдроме отёк сильнее", "Эпикриз": "Резкое падение печёночных показателей, возможна печёночная кома, абсанс, гипогликемия. Хамер рекомендовал вводить глюкозу, чтобы мозг не голодал", "Зависание / рецидивы / синдром": "Рецидивы → рубцы, потеря эластичности → камнеобразование; цирроз (2-я причина — разрушение паренхимы из-за нарушения оттока). Крупные камни = постоянные рецидивы", "Медицинские диагнозы": "Желтуха, гепатит (A, B, C, D, E), холангит, камни, печёночная кома, цирроз, синдром Жильбера", "Чувствительность": "Схема «глотка-слизистая»", "Метафоры, выражения": "«Есть деньги — есть еда»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто нарушает ваши границы в вопросах денег и ресурсов? С кем вы боретесь за выживание? (Гепатит: А — близкие, от которых зависишь; B — равные члены семьи; C — денежный спор супругов; D, E — политические/сверхсоциальные)", "Примеры из практики": "Гепатит B у младшей сестры, когда старшая (на 8–10 лет старше) стала жить с парнем в их общей комнате, а младшую выселили за занавеску — территориальный гнев без возможности что-то сделать. Депутат проиграл выборы — гепатит D/E. Желтуха новорождённых — мамин территориальный конфликт или избыток обследований беременной (УЗИ, пальпация) как вторжение на территорию", "Подсказки, особенности": "Гепатит по ГНМ — фаза восстановления после территориального конфликта (вирусы, «если существуют», участвуют в восстановлении эктодермы). Чем выше буква — тем социальнее конфликт. Синдром Жильбера и диабет — «через поколение» у потомков переживших территориальные ограничения: искать в семейной истории. При выходе камня — не сопротивляться боли, напряжение усиливает спазм. При желтухе: 1) конфликт завершён, 2) минимизировать синдром, 3) это не опасность — пройти с терапией", "Источник": "Урок 12 (docx)"}, {"№": "43", "Система": "Пищеварительная", "Орган / часть / ткань": "Желчный пузырь (слизистая)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма (красная), плоский эпителий; мышечный мешок", "Реле в мозге": "Кора головного мозга, территориальные зоны", "Конфликт (тематика)": "Территориальный гнев: «уменьшилась территория → уменьшилось поступление пищи, надо отстоять территорию и из меньшего получить достаточно»; кто-то вторгается на территорию, и ничего нельзя сделать. Эмоция — злость", "Биологический смысл": "В активной фазе: изъязвление расширяет протоки → лучше отток желчи", "Активная фаза (СА)": "Боль в правом подреберье, отдаёт в правое плечо, под лопатку, под ключицу (часто ставят плече-лопаточный периартрит); гиперчувствительность", "Фаза восстановления (ПКЛ)": "Отёк, распирающая боль, нарушение оттока, кратковременная желтуха (при печёночной причине — длительнее)", "Эпикриз": "Сильная боль, рвота с желчью (жёлтая/коричневая слизь) — рвотный рефлекс расслабляет пузырь и выгоняет желчь; горечь во рту", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Холецистит, холангит, камни, плече-лопаточный периартрит справа", "Чувствительность": "Схема «глотка-слизистая»", "Метафоры, выражения": "«Растянутый шарик с водой»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Кто вторгся на вашу территорию? На кого вы злитесь, но ничего не можете сделать? Завтракаете ли вы, как вы просыпаетесь (в конфликте, без аппетита)?", "Примеры из практики": "", "Подсказки, особенности": "Отказ от завтрака (просыпаешься «воюя», без аппетита) → пузырь остаётся растянутым, теряет способность сокращаться → застой, камни, тянущая боль. Обязательно совмещать работу с конфликтом с мануальной (висцеральный массаж) и режимом питания/сна — одно не заменяет другое", "Источник": "Урок 12 (docx)"}, {"№": "44", "Система": "Пищеварительная", "Орган / часть / ткань": "Тонкий кишечник — слизистая (тощая, подвздошная; кроме луковицы 12-перстной)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Невозможность переварить кусок, извлечь из него полезное; неприятности с членами семьи, коллегами, друзьями; неперевариваемый гнев; чаще со страхом голода в широком смысле; невозможность получить выгоду или доход, на который рассчитывал", "Биологический смысл": "В активной фазе: больше пищеварительного сока → переварить застрявший кусок, извлечь питательные вещества", "Активная фаза (СА)": "Рост клеток, усиление функции; плоскорастущая опухоль (несколько слоёв эпителия, утолщается только в конце подвздошной) — обычно не диагностируется. Зависание → сужение просвета, непроходимость", "Фаза восстановления (ПКЛ)": "Отёк, воспаление, туберкулёзный распад (грибки, микобактерии): вздутие, непереваренные кусочки пищи, кровотечения (энтерит, болезнь Крона)", "Эпикриз": "Лихорадка, сильное кровотечение, спазмы, колики (участвует мускулатура), диарея", "Зависание / рецидивы / синдром": "Рецидивы + зависание в восстановлении → деградация ворсинок, снижение всасывания → непереносимость глютена, лактозы; язвы, свищи, прободение → перитонит (экстренная хирургия)", "Медицинские диагнозы": "Энтерит, болезнь Крона, непереносимость глютена/лактозы, кишечная непроходимость, свищи", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Неперевариваемый гнев»; кость поперёк кишечника", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Какую выгоду/доход вы рассчитывали получить и не получили? Что в отношениях с семьёй, коллегами, друзьями вы не можете «переварить»? Боитесь ли остаться без средств?", "Примеры из практики": "Животное проглотило кусок с костью — она застряла поперёк кишечника (колики = СДХ) → опухоль выше растворяет кость → кусок проскакивает → конфликтолиз", "Подсказки, особенности": "Непереносимость продукта может быть треком (продукт присутствовал в момент СДХ); безглютеновая/безлактозная диета лишь убирает трек, не решая конфликт. Без грибков/микобактерий (антибиотики) опухоль инкапсулируется и видна на УЗИ, хотя программа завершена", "Источник": "Урок 13 (PDF)"}, {"№": "45", "Система": "Пищеварительная", "Орган / часть / ткань": "Тонкий кишечник — гладкая мускулатура", "Зародышевый листок": "Гладкая мускулатура", "Ткань (подробно)": "Гладкая мускулатура", "Реле в мозге": "Средний мозг (верхняя часть ствола)", "Конфликт (тематика)": "Невозможность дальнейшего продвижения куска; обычно сочетан с конфликтом слизистой", "Биологический смысл": "В активной фазе: локальное усиление → продвинуть застрявший кусок", "Активная фаза (СА)": "Рост мускулатуры, локальное усиление перистальтики, замедление в остальном кишечнике", "Фаза восстановления (ПКЛ)": "Усиление перистальтики всего кишечника; разросшаяся мускулатура остаётся", "Эпикриз": "Усиленная локальная перистальтика с остановкой остального кишечника → возможна инвагинация, непроходимость; после — сильная перистальтика всего кишечника, диарея", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Инвагинация кишечника, колики, диарея", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что «застряло» и не продвигается дальше?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 13 (PDF)"}, {"№": "46", "Система": "Пищеварительная", "Орган / часть / ткань": "Толстый кишечник — слизистая (слепая, ободочная; кроме эктодермы прямой кишки)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Безобразный, подлый конфликт, злость от невозможности избавиться от неперевариваемого «куска», неперевариваемый гнев, сильная злость, некрасивая, тяжело переносимая ситуация. Чем ближе к анусу, тем «кусок» ненужнее, невыносимее, отвратительнее. Сигмовидная кишка — предательство или несправедливое обвинение", "Биологический смысл": "В активной фазе: больше секреции → кусок проходит быстрее; усиление всасывания", "Активная фаза (СА)": "Рост аденокарциномы; при длительном/интенсивном конфликте — непроходимость", "Фаза восстановления (ПКЛ)": "Воспаление, туберкулёзный распад, иногда кровотечения; диарея, сгустки крови в кале; тёплый локализованный пот, усталость. Временная непроходимость от отёка (особенно при Синдроме)", "Эпикриз": "Сильное кровотечение, боль, озноб, спазмы, колики", "Зависание / рецидивы / синдром": "Рецидивы/зависание → язвенный колит; чрезмерный распад, истончение слизистой → дивертикулы (чаще в сигмовидной)", "Медицинские диагнозы": "Рак толстой кишки, колит, язвенный колит, дивертикулы, кишечная непроходимость", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Дерьмовая ситуация»; «не могу протолкнуть»", "Вопросы (из курса)": "«От чего не получается избавиться?», «Какой кусок не получается протолкнуть?»", "Вопросы (по теме конфликта)": "Кто вас предал или несправедливо обвинил (сигмовидная)? Какая подлость, мерзость произошла?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 13 (PDF)"}, {"№": "47", "Система": "Пищеварительная", "Орган / часть / ткань": "Аппендикс (червеобразный отросток)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (слизистая толстого кишечника)", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Как толстый кишечник (неперевариваемый, безобразный кусок)", "Биологический смысл": "В активной фазе", "Активная фаза (СА)": "Рост ткани", "Фаза восстановления (ПКЛ)": "Воспаление — аппендицит; если продукты распада остаются в отростке (заслонка Герлаха не пропускает гной в слепую кишку) — воспаление не завершается", "Эпикриз": "", "Зависание / рецидивы / синдром": "Возможен разрыв аппендикса (особенно при Синдроме) → перитонит; большой сальник ложится на разрыв и частично локализует воспаление. При разрыве — срочная операция", "Медицинские диагнозы": "Аппендицит, перитонит", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "", "Примеры из практики": "", "Подсказки, особенности": "Автор: для завершения программы без операции возможны висцеральные техники на расслабление заслонки Герлаха и выход гноя в слепую кишку", "Источник": "Урок 13 (PDF)"}, {"№": "48", "Система": "Пищеварительная", "Орган / часть / ткань": "Прямая кишка — эктодермальная слизистая (10–12 см)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Кора, левая (женская) территориальная зона, «8-часовое» реле; латеральность, гормональный статус, правила весов", "Конфликт (тематика)": "Потеря идентичности: « ения (ПКЛ)": "Отёк — флебит; сильное опухание вплоть до закупорки — чаще Синдром (ошибочно «тромбофлебит»)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → утолщение вен, рубцы и дегенерация клапанов → варикозное расширение", "Медицинские диагнозы": "Флебит, тромбофлебит, варикоз", "Чувствительность": "", "Метафоры, выражения": "«Гири на ногах»; «балласт»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что ограничивает вашу свободу, висит «гирей на ногах»? Где вы не можете уйти?", "Примеры из практики": "Молодая женщина воспринимает ребёнка как груз — не может выйти на работу или отдохнуть с подругами. Женщине не нравится работа, но уйти не может, пока не выплатит ипотеку", "Подсказки, особенности": "", "Источник": "Урок 19 (PDF)"}, {"№": "78", "Система": "Лимфатическая", "Орган / часть / ткань": "Лимфатические узлы (связаны с соответствующими костями; подмышечные — с головкой/верхней третью плечевой кости) (по Хамеру)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма («младшие братья и сёстры костей»)", "Реле в мозге": "Мозговое вещество (паренхима, белое вещество) большого мозга", "Конфликт (тематика)": "Конфликт потери самооценки (немного слабее, чем для соответствующей кости). Подмышечные: самообесценивание в отношениях мать–ребёнок или с партнёром («я была плохой матерью», «плохой женой»). Паховые: «я не могу это сделать, не пройду через это» (экзамен)", "Биологический смысл": "Биологический смысл в фазе восстановления (узел/кость становятся прочнее)", "Активная фаза (СА)": "Некрозы, отверстия в узле («швейцарский сыр»), не видно; параллельно остеолизы (декальцинация) соответствующей кости", "Фаза восстановления (ПКЛ)": "Узел опухает, заполняется новыми клетками (митозы) — медицина называет «злокачественным»; в кости отёк, растяжение надкостницы — боль; плечевой сустав может опухнуть; затем рекальцификация — кальция больше, чем до", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "«Метастазы в лимфоузлах», болезнь Ходжкина (лимфогранулематоз), остеолизы", "Чувствительность": "", "Метафоры, выражения": "«Я была плохой матерью»; «Я не смогу через это пройти»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "В каких отношениях (с ребёнком, партнёром) вы почувствовали себя плохой/неполноценной? Что, как вам казалось, вы не сможете осилить?", "Примеры из практики": "Мать-правша винит себя в несчастном случае с ребёнком: рак левой груди + потеря самооценки → остеолиз головки плечевой кости и некроз подмышечных узлов; ребёнок здоров и «я не виновата» → восстановление. Студент думал, что не сдаст экзамен → сдал → увеличение паховых узлов, диагноз «болезнь Ходжкина»", "Подсказки, особенности": "Узел, опухший рядом с процессом заживления (грудь, рука), без митозов — просто реакция обмена (доброкачественно). Хамер: увеличенные узлы в восстановлении «не удалять», если не мешают механически (например при Синдроме) или психологически", "Источник": "Хамер, germanische-neue-medizin.de/sonderprogramme/lymphknoten (PDF уроки 19–22)"}, {"№": "79", "Система": "Лимфатическая", "Орган / часть / ткань": "Лимфатические узлы и сосуды (урок 20)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима", "Конфликт (тематика)": "Обрушение самооценки, связанное с локализацией: шейные узлы — интеллектуального характера (несправедливость, отсутствие свободы, несогласие); подмышечные — «я была плохой матерью» (мать после несчастного случая с ребёнком: левая грудь у правши + узлы); после резекции/мастэктомии — «моя грудь больше не будет такой красивой»", "Биологический смысл": "В конце восстановления (Люкс): лимфатической ткани больше", "Активная фаза (СА)": "Бессимптомный некроз («швейцарский сыр»)", "Фаза восстановления (ПКЛ)": "Большой отёк, деление клеток, покраснение, боль — лимфома Ходжкина; лимфаденит, лимфангит", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы — одновременно некроз, воспаление, гранулёмы, фиброз", "Медицинские диагнозы": "Лимфома Ходжкина, лимфаденит, лимфангит, «метастазы в лимфоузлах»", "Чувствительность": "", "Метафоры, выражения": "«Я была плохой матерью»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "В чём вы чувствуете себя несправедливо униженным, несвободным? Где вы обвиняете себя?", "Примеры из практики": "", "Подсказки, особенности": "Без собственной программы узлы опухают от повышенной нагрузки при восстановлении соседнего органа (горло — при ангине, отите, стоматите) и приходят в норму после. Лимфа выводит продукты распада через влагалище/уретру, ЖКТ, потовые железы, нос, миндалины, дыхательные пути", "Источник": "Урок 20 (PDF)"}, {"№": "80", "Система": "Лимфатическая/кровь", "Орган / часть / ткань": "Селезёнка (особый лимфатический узел) (по Хамеру)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Мозговое вещество большого мозга", "Конфликт (тематика)": "Конфликт кровотечения и ранения (вид потери самооценки): серьёзная кровоточащая рана; у людей — услышать диагноз «рак крови»/лейкемия, постоянные переливания крови (мозг не отличает их от кровотечения), страх заражённой крови (СПИД), любая «картина крови»", "Биологический смысл": "В активной фазе тромбоциты уходят в селезёнку (профилактика тромбоза), в восстановлении — увеличение селезёнки как запас места на случай нового кровотечения (одна из немногих программ «в готовности к рецидиву»)", "Активная фаза (СА)": "Временный некроз селезёнки, тромбоцитопения", "Фаза восстановления (ПКЛ)": "Заполнение некроза новыми клетками (митозы) → спленомегалия, может сохраняться", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Тромбоцитопения, спленомегалия", "Чувствительность": "", "Метафоры, выражения": "«Раненое животное покидает поле боя»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Была ли травма, кровотечение, операция? Слышали ли вы пугающий диагноз о крови, переливания?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Хамер (PDF уроки 19–22)"}, {"№": "81", "Система": "Лимфатическая/кровь", "Орган / часть / ткань": "Селезёнка (урок 20)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима", "Конфликт (тематика)": "Обрушение самооценки, связанное с кровью: неспособность бороться из-за кровоточащей раны; кровотечение и ранение; внушение, что «кровь плохая»; потеря ребёнка — «оторвали мою кровиночку»; переливание крови; страх заражённой крови (СПИД)", "Биологический смысл": "В конце восстановления (Люкс): селезёнка больше — лучше фильтрация при следующем кровотечении; тромбоцитопения в СА — кровь жидкая, чтобы промыть рану до её закрытия, профилактика тромбоэмболии", "Активная фаза (СА)": "Некроз, пустоты, накопление тромбоцитов в селезёнке → тромбоцитопения; зависание — гипоспленизм", "Фаза восстановления (ПКЛ)": "Полости заполняются жидкостью (кисты), воспаление (спленит), рост клеток. При Синдроме — гиперотёк, спленомегалия до 6–8 кг, ишемический или геморрагический инфаркт селезёнки (режущая/колющая боль в левом подреберье, температура, слабость), прорыв экссудата", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → соединительная ткань → снижение функции", "Медицинские диагнозы": "Тромбоцитопения, гипоспленизм, спленит, спленомегалия, инфаркт селезёнки", "Чувствительность": "Болевых рецепторов нет", "Метафоры, выражения": "«Оторвали мою кровиночку»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Было ли кровотечение, операция, переливание? Слышали ли вы, что у вас «плохая кровь»? Потеря ребёнка?", "Примеры из практики": "", "Подсказки, особенности": "При терапии в первую очередь выяснить наличие Синдрома и разрешать конфликт собирательных трубочек", "Источник": "Урок 20 (PDF)"}, {"№": "82", "Система": "Кровь", "Орган / часть / ткань": "Костный мозг, кроветворение (анемия, лейкемия)", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма", "Реле в мозге": "Паренхима", "Конфликт (тематика)": "Конфликт для костной ткани (обрушение самооценки)", "Биологический смысл": "", "Активная фаза (СА)": "Остеолиз + аплазия костного мозга: снижение лейкоцитов, эритроцитов, тромбоцитов — анемия, лейкопения; в симпатикотонии сосуды сужены, плазма уходит в ткани — показатели крови кажутся «лучше»", "Фаза восстановления (ПКЛ)": "Плазма возвращается — «псевдоанемия» (усталость, бледность, нарушение концентрации, боли в костях); сначала быстро растут лейкоциты и лейкобласты — «лейкемия» (ей всегда предшествует анемия/лейкопения); через 4–6 недель растут эритроциты и тромбоциты, кровь нормализуется", "Эпикриз": "", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "Анемия, железодефицитная анемия, лейкопения, лейкемия (лейкоз)", "Чувствительность": "", "Метафоры, выражения": "", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы почувствовали себя «хуже других»?", "Примеры из практики": "Мать отнимает 2-летнего сына от груди ради годовалой дочери; сын воспринимает «мама меня больше не любит» (кости челюсти — нет молока); когда забыл — температура, спит 48 часов, 6 недель «лейкемия»: слабость, боли в костях (особенно челюсть), много спит; через 6 недель здоров", "Подсказки, особенности": "Железодефицит также — кровопотеря, месячные, атрофия слизистой желудка; диета не рассматривается. Высокогорье повышает эритроциты без СБП", "Источник": "Урок 8 (PDF)"}, {"№": "83", "Система": "Эндокринная", "Орган / часть / ткань": "Щитовидная железа — паренхима", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма (цилиндрический кишечный эпителий)", "Реле в мозге": "Ствол головного мозга; правая доля — получить, левая — избавиться", "Конфликт (тематика)": "Общий конфликт собственной медлительности: правая — «кусок» не получить из-за медлительности (работа, должность, повышение, контракт, бизнес, покупка, человек, которого не удаётся «схватить» или удержать — «не хватает скорости»); левая — от «куска» не избавиться из-за медлительности. Уязвимы: те, кого заставляют срочно делать, конкурентные профессии (менеджеры, агенты, продавцы, спортсмены), дедлайны (журналисты, производство), работа «на износ» (две работы, матери-одиночки); дети, на которых давят родители, учителя, тренеры («ты слишком медлительный!»)", "Биологический смысл": "В активной фазе: больше тироксина → быстрее → больше шансов получить или избавиться", "Активная фаза (СА)": "Рост ткани, повышение Т3, Т4: ускоренный обмен, похудание, частый пульс, нарушения сна и концентрации — гипертиреоз; зависание → твёрдый зоб, давление на трахею; большая пролиферация — «рак щитовидной железы»", "Фаза восстановления (ПКЛ)": "Отёк, воспаление, боль, затруднённое дыхание и глотание, ночная потливость — тиреоидит; временный гипотиреоз; снижение кальцитонина → временное повышение кальция; туберкулёзный распад. Без грибков — инкапсуляция узлов, повышенная выработка гормонов сохраняется (постепенно нормализуется)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Каждый прогон/зависание → соединительная ткань → гипотиреоз, болезнь Хашимото; у детей — кретинизм; у взрослых — микседема (торможение, снижение интеллекта, слабость, подавленность, нет аппетита, низкое давление, высокий холестерин)", "Медицинские диагнозы": "Гипертиреоз, зоб, рак щитовидной железы, тиреоидит, гипотиреоз, Хашимото, микседема, кретинизм, «горячие узлы» (активная фаза)", "Чувствительность": "Нечувствительна", "Метафоры, выражения": "«Не успеваю»; «слишком медленный»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вы не успели получить/от чего не успели избавиться, потому что были «слишком медленным»? Кто вас торопит, говорит, что вы медлительны?", "Примеры из практики": "Пенсионерка много лет помогала по хозяйству в семье, чувствовала себя почти её членом; неожиданно уволили: «Ты всё делаешь слишком медленно!» — не сохранила «кусок хлеба». Человек на работе выглядит аутсайдером рядом с коллегами — тироксин помогает догнать", "Подсказки, особенности": "Гипотиреоза не бывает без предшествующего гипертиреоза — две фазы одной программы. Смотреть гормоны в динамике", "Источник": "Урок 18 (PDF); урок 2; вопросы-ответы"}, {"№": "84", "Система": "Эндокринная", "Орган / часть / ткань": "Щитовидная железа — протоки (архаичные выводные)", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма", "Реле в мозге": "Премоторно-сенсорная кора, с перекрестом; не территориальные зоны, но действуют те же правила (пол, латеральность, гормональный статус); «панические реле»", "Конфликт (тематика)": "Конфликт бессилия или страха спереди (фронтального страха) — женская пассивная реакция на приближающуюся опасность: чувствую себя бессильным, беспомощным, брошенным на произвол судьбы; невозможно предотвратить надвигающееся спереди; время утекает, а ничего не происходит; «у меня связаны руки», «я ничего не могу сделать»", "Биологический смысл": "", "Активная фаза (СА)": "Изъязвление протоков, тянущие боли; на уровне психики — паника. Гормоны обычно в норме", "Фаза восстановления (ПКЛ)": "Отёк: изъязвлённые полости заполняются серозной жидкостью — кисты, эутиреоидный зоб, «холодные узлы»; при Синдроме — «рак протоков щитовидной железы». Без рецидивов кисты уменьшаются", "Эпикриз": "Паника резко усиливается — паническая атака", "Зависание / рецидивы / синдром": "Фронтальная констелляция (правые + левые протоки): навязчивый страх того, что впереди, тревога, сердцебиение, повышенное давление — паническое состояние, в эпикризе — паническая атака. Фронтально-затылочная констелляция (протоки + сетчатка/стекловидное тело по диагонали): «ловушка между опасностями спереди и сзади», страх, который невозможно стряхнуть. Переполненная киста может разорваться — свищ (всегда справа: правые протоки ближе к коже)", "Медицинские диагнозы": "Кисты щитовидной железы, эутиреоидный зоб, холодные узлы, свищ, панические атаки, тревожное расстройство", "Чувствительность": "Схема «глотка-слизистая»", "Метафоры, выражения": "«Связаны руки»; «встреча со страхом лицом к лицу»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что надвигается на вас спереди, а вы ничего не можете сделать? Где вы чувствуете себя бессильным? Есть ли одновременно страх «сзади»?", "Примеры из практики": "", "Подсказки, особенности": "При работе с паническими атаками решать фронтальную или фронтально-затылочную констелляцию", "Источник": "Урок 18 (PDF); вопросы-ответы"}, {"№": "85", "Система": "Эндокринная", "Орган / часть / ткань": "Паращитовидные (околощитовидные) железы", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга; справа — получить, слева — избавиться", "Конфликт (тематика)": "Невозможность получить желаемое (справа) или избавиться от нежелательного (слева) из-за мышечной слабости, бессилия, пассивности", "Биологический смысл": "В активной фазе: больше паратгормона → больше кальция → активнее мышцы", "Активная фаза (СА)": "Рост ткани, гиперпаратиреоз, повышение кальция; при значительном росте — «рак паращитовидной»; зависание/рецидивы → декальцинация костей, отложение кальция в сосудах и клапанах (тромбозы); твёрдый зоб", "Фаза восстановления (ПКЛ)": "Распад с грибками; чаще узлы инкапсулируются — паратгормон остаётся повышенным", "Эпикриз": "", "Зависание / рецидивы / синдром": "«Зависшее исцеление» (рецидивы прерывают восстановление) → уменьшение ткани, соединительная ткань → хронический гипопаратиреоз, низкий кальций", "Медицинские диагнозы": "Гиперпаратиреоз, гипопаратиреоз (всегда после гипер-), рак паращитовидной", "Чувствительность": "", "Метафоры, выражения": "«Нет сил»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Что вы не можете получить или от чего избавиться, потому что чувствуете бессилие, слабость?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 18 (PDF)"}, {"№": "86", "Система": "Эндокринная", "Орган / часть / ткань": "Кора надпочечников", "Зародышевый листок": "Новая мезодерма", "Ткань (подробно)": "Новая мезодерма (Люкс)", "Реле в мозге": "Паренхима, без перекреста", "Конфликт (тематика)": "Оказаться выбитым из колеи, идти не тем путём, оказаться на ложном пути, принять неправильное решение, потерять ориентир, «поставить не на ту лошадь»", "Биологический смысл": "В активной фазе — меньше гормонов, снизить энергию, замедлить движение по ложному пути; в конце восстановления — больше кортизола/альдостерона: силы выйти на правильный путь и наверстать", "Активная фаза (СА)": "Некроз, снижение кортизола и альдостерона: слабость, упадок сил, нет аппетита; при зависании — рост АКТГ, гиперпигментация; хроническое снижение — болезнь Аддисона (усталость, мышечная слабость, потеря веса, тошнота, рвота, низкое давление)", "Фаза восстановления (ПКЛ)": "Кисты, зарастающие функциональной тканью («аденома/карцинома надпочечника») — избыток кортизола и альдостерона; повышенная выработка остаётся", "Эпикриз": "", "Зависание / рецидивы / синдром": "Зависшее восстановление/кисты → синдром Кушинга (кортизол: нарушения сна, одутловатость лица, вес на туловище, шее, спине, гипертония) или синдром Конна (альдостерон: жажда, гипертония, много мочи); больше андрогенов → гирсутизм у женщин", "Медицинские диагнозы": "Надпочечниковая недостаточность, Аддисон, аденома надпочечника, Кушинг, Конн, гирсутизм", "Чувствительность": "", "Метафоры, выражения": "«Поставила не на ту лошадь»; «сбилась с пути»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы чувствуете, что пошли не тем путём, сделали неправильный выбор (партнёр, работа)?", "Примеры из практики": "Молодая мать троих детей: муж почти не обращает внимания, она сомневается в браке — «поставила всё не на того партнёра» → недостаточность правого надпочечника (правша, партнёр — справа)", "Подсказки, особенности": "", "Источник": "Урок 23 (PDF); вопросы-ответы"}, {"№": "87", "Система": "Эндокринная", "Орган / часть / ткань": "Мозговое вещество (паренхима) надпочечников — хромаффинные клетки", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга", "Конфликт (тематика)": "Непереносимо сильный стресс, экстремальное напряжение, нехватка времени что-то сделать/закончить", "Биологический смысл": "В активной фазе: больше гормонов и глюкозы — пережить стресс, повысить работоспособность", "Активная фаза (СА)": "Рост ткани, больше дофамина, норадреналина, адреналина: приступообразное повышение давления, сердцебиение, беспокойство, повышение сахара", "Фаза восстановления (ПКЛ)": "Туберкулёзный распад", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы/зависание → хронический туберкулёз паренхимы, снижение функции", "Медицинские диагнозы": "Феохромоцитома (по смыслу — опухоль хромаффинных клеток), гипертонические кризы", "Чувствительность": "", "Метафоры, выражения": "«Не успеваю»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Где вы под экстремальным давлением сроков?", "Примеры из практики": "Офисный сотрудник: слишком много задач и давление руководства, чтобы всё было сделано быстро", "Подсказки, особенности": "", "Источник": "Урок 23 (PDF)"}, {"№": "88", "Система": "Эндокринная/мозг", "Орган / часть / ткань": "Аденогипофиз (передняя доля гипофиза)", "Зародышевый листок": "Энтодерма", "Ткань (подробно)": "Энтодерма", "Реле в мозге": "Ствол головного мозга; правая сторона — захватить, левая — избавиться", "Конфликт (тематика)": "1) Невозможность захватить/избавиться от «куска», потому что индивид слишком маленький (мальчика дразнят за маленький рост). 2) Невозможность содержать ребёнка или семью («слишком маленький» метафорически)", "Биологический смысл": "В активной фазе: больше гормона роста (1) или пролактина (2)", "Активная фаза (СА)": "(1) Рост аденогипофиза, больше соматотропина: у детей быстрый рост, гигантизм; у взрослых — акромегалия (удлинение рук, ног, увеличение челюсти, носа, языка). (2) Больше пролактина: больше молока у кормящей, выделения из груди у неко опорциональное)", "Фаза восстановления (ПКЛ)": "Отёк, воспаление, туберкулёзный распад, нормализация мелатонина; полости — кисты эпифиза (остаются, видны на МРТ/КТ)", "Эпикриз": "", "Зависание / рецидивы / синдром": "Рецидивы → уменьшение ткани, мало мелатонина → преждевременное половое созревание (макрогенитосомия)", "Медицинские диагнозы": "Задержка полового созревания, преждевременное половое созревание, кисты эпифиза, нарушения сна", "Чувствительность": "", "Метафоры, выражения": "«Потерялся в темноте»; «не могу принять решение»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Когда внезапно стало темно? Где вы «потерялись», не можете сделать выбор?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 21 (PDF)"}, {"№": "90", "Система": "Мозг", "Орган / часть / ткань": "Таламус и гипоталамус", "Зародышевый листок": "Эктодерма", "Ткань (подробно)": "Эктодерма; орган и реле в одном месте; только функциональные изменения", "Реле в мозге": "Сам таламус/гипоталамус", "Конфликт (тематика)": "Конфликт тупика: не видит выхода из очень опасной ситуации, полная покорность — «хоть бы я уже умер!»", "Биологический смысл": "", "Активная фаза (СА)": "Обычно секунды-минуты; изменение гормонов и химии крови, мобилизация всех резервов: неугомонность, нервозность, бессонница, маниакальная гипервозбудимость, сильное покраснение лица и верха груди, частое мочеиспускание; долго — быстро теряет силы, «сгорает»", "Фаза восстановления (ПКЛ)": "Гормоны и кровь нормализуются; отёк в мозге (при Синдроме — риск гидроцефалии)", "Эпикриз": "Резкий всплеск симпатикотонии — человек падает, гормональные параметры «к нулю»", "Зависание / рецидивы / синдром": "", "Медицинские диагнозы": "", "Чувствительность": "", "Метафоры, выражения": "«Хоть бы я умер»; «тупик»", "Вопросы (из курса)": "", "Вопросы (по теме конфликта)": "Была ли ситуация, где вы не видели никакого выхода?", "Примеры из практики": "", "Подсказки, особенности": "", "Источник": "Урок 21 (PDF)"}, {"
